 SEA_imperial_influence_events.1.a:0 "Dismiss the Army Faction"
 SEA_imperial_influence_events.1.b:0 "Dismiss the Naval Faction"
 SEA_imperial_influence_events.1.c:0 "Dismiss the Zaibatsu Faction"
 SEA_imperial_influence_events.1.d:0 "Dismiss the Civilian Government Faction"
 SEA_imperial_influence_events.1.desc:0 "A bitter power struggle has broken out among the various internal factions within [ROOT.GetNameDef], all vying for the [GetImperialInfluenceRulerTitle]'s ear, trying to sway [GetImperialInfluenceGenderHimHer] to their cause. The question on everyone's mind is; which faction will the [GetImperialInfluenceRulerTitle] ultimately favor, and which one will [GetImperialInfluenceGenderHeShe] disregard?"
 SEA_imperial_influence_events.1.t:0 "Internal Power Struggle Erupts"
 SEA_imperial_influence_events.100.desc:0 "The Army faction has tried to increase their influence over the [GetImperialInfluenceRulerTitle], but due to their shortcomings have failed to do so. Because of this they have now lost face and thus prestige, meaning their influence have decreased."
 SEA_imperial_influence_events.100.t:0 "The Army Faction Loses Influence"
 SEA_imperial_influence_events.110.desc:0 "The Army has delivered their demands. It seems they are looking to expand their production capabilities and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we build more Military Factories to increase our output. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.110.t:0 "The Army Faction Seek to Expand Armament Production"
 SEA_imperial_influence_events.120.desc:0 "The Army has delivered their demands. Lacking central control and autonomy to act on their own, they wish to see a new Chief of Army appointed to the post, which will also serve to strengthen their influence over the [GetImperialInfluenceRulerTitle]. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.120.t:0 "The Army Faction Demand Political Appointments"
 SEA_imperial_influence_events.130.desc:0 "The Army has delivered their demands. They wish for us to increase our national conscription, and send out recruiters to rural villages to enlist more young men for the coming war effort. Despite the guise of simply strengthening our armed forces, they seemingly also wish to increase their control and influence over the [GetImperialInfluenceRulerTitle]. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.130.t:0 "The Army Faction Desires Conscription Law Changes"
 SEA_imperial_influence_events.140.desc:0 "The Army has delivered their demands. They wish for us to increase the amount of regiments in our army, and establish more divisions to aid in the coming conquests. Despite the guise of simply strengthening our armed forces, they seemingly also wish to increase their control and influence over the [GetImperialInfluenceRulerTitle]. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.140.t:0 "The Army Faction Plans for Expansion"
 SEA_imperial_influence_events.150.desc:0 "The Army has delivered their demands. It seems they are looking to expand their motorized vehicle production capabilities and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we build more trucks to fuel their need for expansion. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.150.t:0 "The Army Faction Insists in Support Trucks"
 SEA_imperial_influence_events.160.desc:0 "The Army has delivered their demands. It seems they are looking to expand their tank production capabilities and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we build more tanks fuel their needs for expansion. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.160.t:0 "The Army Faction Demands Increased Tank Production"
 SEA_imperial_influence_events.161.desc:0 "The Army has delivered their demands. It seems they are looking to expand their artillery production capabilities and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we build more artillery fuel their needs for expansion. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.161.t:0 "The Army Faction Demands Increased Artillery Production"
 SEA_imperial_influence_events.200.desc:0 "The Naval faction has tried to increase their influence over the [GetImperialInfluenceRulerTitle], but due to their shortcomings have failed to do so. Because of this they have now lost face and thus prestige, meaning their influence have decreased."
 SEA_imperial_influence_events.200.t:0 "The Naval Faction Loses Influence"
 SEA_imperial_influence_events.210.desc:0 "The Navy has delivered their demands. It seems they are looking to expand their production capabilities and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we build more Naval Dockyards to increase our output. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.210.t:0 "The Naval Faction Seek to Expand Dockyard Production"
 SEA_imperial_influence_events.220.desc:0 "The Navy has delivered their demands. Lacking central control and the autonomy to act on their own, they wish to see a new Chief of Navy appointed to the post, which will also serve to strengthen their influence over the [GetImperialInfluenceRulerTitle]. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.220.t:0 "The Naval Faction Demand Political Appointments"
 SEA_imperial_influence_events.230.desc:0 "The Navy has delivered their demands. They wish for us to increase our national conscription, and send out navy envoys to rural villages to recruit more young men for the coming war effort. Despite the guise of simply strengthening our armed forces, they seemingly also wish to increase their control and influence over the [GetImperialInfluenceRulerTitle]. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.230.t:0 "The Naval Faction Desires Conscription Law Changes"
 SEA_imperial_influence_events.240.desc:0 "The Navy has delivered their demands. It seems they are looking to expand their carrier fleet and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we order the construction of more carriers to fuel their needs for expansion. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.240.t:0 "The Naval Faction Demands increased Aircraft Carrier Production"
 SEA_imperial_influence_events.241.desc:0 "The Navy has delivered their demands. It seems they are looking to expand their production capabilities and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we order the construction of more Naval Dockyards to fuel their needs for expansion. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.241.t:0 "The Naval Faction Demands increased Naval Production"
 SEA_imperial_influence_events.242.desc:0 "The Navy has delivered their demands. It seems they are looking to expand their battleship fleet and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we order the construction of more battleships to fuel their needs for expansion. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.242.t:0 "The Naval Faction Demands increased Battleship Production"
 SEA_imperial_influence_events.300.desc:0 "The Zaibatsu's have tried to increase their influence over the [GetImperialInfluenceRulerTitle], but due to their shortcomings have failed to do so. Because of this they have now lost face and thus prestige, meaning their influence have decreased."
 SEA_imperial_influence_events.300.t:0 "The Zaibatsu Faction Loses Influence"
 SEA_imperial_influence_events.310.desc:0 "The Zaibatsu leaders have delivered their demands. It seems they are looking to expand their holdings and industries and their influence over the [GetImperialInfluenceRulerTitle], and are as such demanding that we build more Civilian Factories to increase our industrial base. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.310.t:0 "The Zaibatsu Faction Seek to Expand Our Industrial Base"
 SEA_imperial_influence_events.320.desc:0 "The Zaibatsu leaders have delivered their demands. It seems they wish for at the very least one of their members to be placed on the [GetImperialInfluenceRulerTitle]'s advisory board, so that they may guide the industrialization and the path of the nation. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.320.t:0 "The Zaibatsu Faction Demand Political Appointments"
 SEA_imperial_influence_events.330.desc:0 "The Zaibatsu leaders have delivered their demands. They wish for us to adjust the economic strategy of our nation, and for more funds to go towards the industrial conglomerates. Despite the guise of simply strengthening our economy, they seemingly also wish to increase their control and influence over the [GetImperialInfluenceRulerTitle]. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.330.t:0 "The Zaibatsu Faction Desires Economy Law Changes"
 SEA_imperial_influence_events.340.desc:0 "The Zaibatsu leaders have delivered their demands. It seems they wish for at the very least one of their companies to be hired for direct contracts by the [GetImperialInfluenceRulerTitle], so that they may guide the industrialization and path of the nation. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.340.t:0 "The Zaibatsu Faction Demand We Hire a Industrial Company"
 SEA_imperial_influence_events.400.desc:0 "The Civilian Government has tried to increase their influence over the [GetImperialInfluenceRulerTitle], but due to their shortcomings have failed to do so. Because of this they have now lost face and thus prestige, meaning their influence have decreased."
 SEA_imperial_influence_events.400.t:0 "The Civilian Government Loses Influence"
 SEA_imperial_influence_events.420.desc:0 "The party leaders have delivered their demands. It seems they wish for at the very least one of their members to be placed on the [GetImperialInfluenceRulerTitle]'s advisory board, so that they may guide the political direction of the nation and steer it toward a brighter future. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.420.t:0 "The Civilian Government Faction Demand Political Appointments"
 SEA_imperial_influence_events.430.desc:0 "The party leaders have delivered their demands. They wish for us to adjust the economic strategy of our nation, and for the investment and trading strategies to be shifted in the favor of internationalism and better relations with our trading partners. Despite the guise of simply strengthening our economy, they seemingly also wish to increase their control and influence over the [GetImperialInfluenceRulerTitle]. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.430.t:0 "The Civilian Government Faction Desires Trade Law Changes"
 SEA_imperial_influence_events.440.desc:0 "The party leaders have delivered their demands. It seems they are distraught at the growing power and influence of the Army over the [GetImperialInfluenceRulerTitle], and wish for swift action in limiting their growth and power. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.440.t:0 "The Civilian Government Faction Seeks to limit the Army's Influence"
 SEA_imperial_influence_events.450.desc:0 "The party leaders have delivered their demands. It seems they are distraught at the growing power and influence of the Navy over the [GetImperialInfluenceRulerTitle], and wish for swift action in limiting their growth and power. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.450.t:0 "The Civilian Government Faction Seeks to limit the Navy's Influence"
 SEA_imperial_influence_events.460.desc:0 "The party leaders have delivered their demands. It seems they are distraught at the growing power and influence of the Zaibatsus over the [GetImperialInfluenceRulerTitle], and wish for swift action in limiting their growth and power. It seems they are willing to show some patience, but will not wait forever."
 SEA_imperial_influence_events.460.t:0 "The Civilian Government Faction Seeks to limit the Zaibatsus Influence"
 SEA_imperial_influence_failure_event_option_1:0 "Loss teaches where pride cannot"
 SEA_imperial_influence_failure_event_option_10:0 "Cause brings result"
 SEA_imperial_influence_failure_event_option_2:0 "Even the Moon wanes, yet returns"
 SEA_imperial_influence_failure_event_option_3:0 "Our resolve remains firm"
 SEA_imperial_influence_failure_event_option_4:0 "A Shameful display"
 SEA_imperial_influence_failure_event_option_5:0 "Do or do not. They did not."
 SEA_imperial_influence_failure_event_option_6:0 "Even monkeys fall from trees"
 SEA_imperial_influence_failure_event_option_7:0 "Spilt water won't go back into its tray"
 SEA_imperial_influence_failure_event_option_8:0 "The winds of tomorrow will blow tomorrow"
 SEA_imperial_influence_failure_event_option_9:0 "Fall down seven times but get up eight times"
 SEA_japan.1.a:0 "Put an end to this farce, now!"
 SEA_japan.1.b:0 "The time has come to return to tradition!"
 SEA_japan.1.c:0 "The Military must be reigned in!"
 SEA_japan.1.d:0 "The Military must be reigned in!" # Intentional
 SEA_japan.1.desc:0 "Citing threats to the soul of the imperial nation, young officers loyal to the Kōdōha faction within the IJA have organized a coup d'etat, with the goal of purging the government and military leadership of those who oppose their ethos of militarism and direct Imperial control of the state. They have already surrounded the residences of top officials, and have captured the government center of Tokyo. The Emperor however remains silent, despite the rebels' hopes that he would speak out to support them. How will this incident proceed?"
 SEA_japan.1.e:0 "The People must realize they are being subverted from all sides!"
 SEA_japan.1.t:0 "The February 26 Incident"
 SEA_japan_foreign_policy.1.a:0 "This is an Opportunity for us"
 SEA_japan_foreign_policy.1.b:0 "We must maintain our independence at all costs!"
 SEA_japan_foreign_policy.1.desc:0 "The leadership of [FROM.GetNameDef]'s Kwantung Army have demanded our submission. They have however come with an offer. Should we join them, they will aid us in reclaiming the Mongol lands of old for us, and will allow us to establish a new Mongol Empire under their control. What say we?"
 SEA_japan_foreign_policy.1.t:0 "[FROM.GetNameDefCap] Demands our Submission"
 SEA_japan_foreign_policy.10.a:0 "This is not worth fighting over"
 SEA_japan_foreign_policy.10.b:0 "We will not give it up to them!"
 SEA_japan_foreign_policy.10.desc:0 "A delegation sent to us from [FROM.GetNameDef] has presented us with an ultimatum. They have given us a week to vacate our troops from the Tonkin region, and allow their troops to take up positions and establish military bases in the region. They cite this is to ensure that the Chinese do not threaten [VIN.GetAdjective] sovereignty, but we know what this is really about..."
 SEA_japan_foreign_policy.10.t:0 "[FROM.GetNameDefCap] demands Occupation of [671.GetName]"
 SEA_japan_foreign_policy.103.a:0 "It is too good to pass up"
 SEA_japan_foreign_policy.103.b:0 "We will not give up our economic independence!"
 SEA_japan_foreign_policy.103.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has arrived at our capital today extending an offer to us. They wish for us to increase our currency union activities and further our economic integration with them. It would help our economy significantly, but something smells fishy about all of this..."
 SEA_japan_foreign_policy.103.t:0 "[FROM.GetNameDefCap] Demands Economic Integration"
 SEA_japan_foreign_policy.104.a:0 "We are grateful for their naiveté"
 SEA_japan_foreign_policy.104.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has responded favorably to our offer, and their diplomats have arrived in our nation to sign the necessary documents to facilitate their further economic integration."
 SEA_japan_foreign_policy.104.t:0 "[FROM.GetNameDefCap] Accepts our offer"
 SEA_japan_foreign_policy.105.a:0 "Terrible news..."
 SEA_japan_foreign_policy.105.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has responded to our integration invitation with strong displeasure, and claims that any sort of closer economic partnership between our countries is and will forever be off the table. Perhaps they could see what we had in store for them..."
 SEA_japan_foreign_policy.105.t:0 "[FROM.GetNameDefCap] Rejects our offer"
 SEA_japan_foreign_policy.11.a:0 "A Great Day for the [ROOT.GetAdjective] People"
 SEA_japan_foreign_policy.11.desc:0 "The leadership in [FROM.GetNameDef] have seen reason, and have begun vacating their troops from Tonkin, in order to allow us to establish a security zone there to ensure that the Chinese troops do not enter [VIN.GetAdjective] territory. The day is won!"
 SEA_japan_foreign_policy.11.t:0 "[FROM.GetNameDefCap] Transfers [671.GetName]"
 SEA_japan_foreign_policy.112.a:0 "It allows us to focus our efforts on other areas"
 SEA_japan_foreign_policy.112.b:0 "Compromise on our Empire? Never!"
 SEA_japan_foreign_policy.112.desc:0 "Diplomats belonging to [FROM.GetNameDef] have proposed an agreement where they be given overlordship of our subjects in Burma and Malaysia in exchange for resource rights to some of the vital areas, claiming this to be a part of their Pacific Guardian doctrine, claiming it would allow us to focus on Europe and Africa while they protect Asia from communism. What say we?"
 SEA_japan_foreign_policy.112.t:0 "[FROM.GetNameDefCap] Requests Control of our Asian Colonies"
 SEA_japan_foreign_policy.113.a:0 "We will guard the Pacific for them"
 SEA_japan_foreign_policy.113.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has graciously accepted our offer, and has signed the paperwork to facilitate a handover of their colonies in Malaysia and Burma to us, in exchange for retaining control of vital natural resources in the area. Today is a great day for the Asian people!"
 SEA_japan_foreign_policy.113.t:0 "[FROM.GetNameDefCap] Transfer Their Asian Colonies"
 SEA_japan_foreign_policy.114.a:0 "Arrogant westerners..."
 SEA_japan_foreign_policy.114.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has made a shameful display, and shown to us how clouded and corrupted the western mindset is. We made them a deal they couldn't refuse, that would make Asia a better place, yet somehow they found a way. Today is a dark day for our alliance."
 SEA_japan_foreign_policy.114.t:0 "[FROM.GetNameDefCap] Denies our Request"
 SEA_japan_foreign_policy.118.a:0 "We will be stronger together"
 SEA_japan_foreign_policy.118.b:0 "That would go against our principles of neutrality..."
 SEA_japan_foreign_policy.118.desc:0 "A delegation from far away has recently arrived at our capital, seeking an audience with [ROOT.GetLeader]. They claim to be from [FROM.GetNameDef], and seek an alliance between our nations. Do we accept?"
 SEA_japan_foreign_policy.118.t:0 "[FROM.GetNameDefCap] Invites us to Their Alliance"
 SEA_japan_foreign_policy.119.a:0 "They share our vision for the future"
 SEA_japan_foreign_policy.119.desc:0 "[FROM.GetLeader] has graciously accepted our offer to formalize an alliance between our nations, and has already begun initiatives to integrate into our sphere. Today is a day for celebration!"
 SEA_japan_foreign_policy.119.t:0 "[FROM.GetNameDefCap] Accepts our Invitation"
 SEA_japan_foreign_policy.12.a:0 "They will come to regret their decision!"
 SEA_japan_foreign_policy.12.b:0 "We must let this go"
 SEA_japan_foreign_policy.12.desc:0 "The leadership in [FROM.GetNameDef] have refused to see reason, stating that they will not give up even an inch of land in Indochina. This greatly hinders our further expansion south... Should we accept this, or is it perhaps time to strike down the west?"
 SEA_japan_foreign_policy.12.t:0 "[From.GetNameDefCap] Refuses our Demands"
 SEA_japan_foreign_policy.120.a:0 "It's their loss"
 SEA_japan_foreign_policy.120.desc:0 "[FROM.GetLeader] has rudely decided to reject our offer of an alliance between our nations, stating that it would go against their principle of neutrality. We can only imagine the amounts of corruption that led to this erroneous decision."
 SEA_japan_foreign_policy.120.t:0 "[FROM.GetNameDefCap] Refuses to Join Us"
 SEA_japan_foreign_policy.121.a:0 "Oh..."
 SEA_japan_foreign_policy.121.desc:0 "[FROM.GetLeader], our former overlord, has signed documents facilitating the handover of control over our nation to [JAP.GetNameDef]. It seems we have been placed under the protection of another major power. We now have a new Overlord under whose whims we will be subordinated."
 SEA_japan_foreign_policy.121.t:0 "[FROM.GetNameDefCap] Transfers us to [JAP.GetAdjective] Control"
 SEA_japan_foreign_policy.122.a:0 "It would seem something's afoot in [From.GetNameDef]..."
 SEA_japan_foreign_policy.122.desc:0 "The [From.GetAdjective] have decided to recall their left-leaning civil servants and generals, and have instead sent us their right-leaning generals and civil servants in unofficial exile."
 SEA_japan_foreign_policy.122.t:0 "Exchange of [From.GetAdjective] Generals"
 SEA_japan_foreign_policy.123.a:0 "This will strengthen our hold over [Root.GetNameDef]."
 SEA_japan_foreign_policy.123.desc:0 "The process of exchanging our right-leaning generals and civil servants for the left-leaning ones we had previously sent into unofficial exile in [From.GetNameDef] has now been completed."
 SEA_japan_foreign_policy.123.t:0 "[Root.GetAdjective] Generals Exchanged"
 SEA_japan_foreign_policy.124.a:0 "We will be stronger together"
 SEA_japan_foreign_policy.124.b:0 "That would go against our principles of neutrality..."
 SEA_japan_foreign_policy.124.desc:0 "A delegation from far away has recently arrived at our capital, seeking an audience with [ROOT.GetLeader]. They claim to be from [FROM.GetNameDef], and seek an alliance between our nations. Do we accept?"
 SEA_japan_foreign_policy.124.t:0 "[FROM.GetNameDefCap] Invites us to The Fifth International"
 SEA_japan_foreign_policy.125.a:0 "They share our vision for the future"
 SEA_japan_foreign_policy.125.desc:0 "[FROM.GetLeader] has graciously accepted our offer to formalize an alliance between our nations, and has already begun initiatives to integrate into our sphere. Today is a day for celebration!"
 SEA_japan_foreign_policy.125.t:0 "[FROM.GetNameDefCap] Accepts our Invitation"
 SEA_japan_foreign_policy.126.a:0 "It's their loss"
 SEA_japan_foreign_policy.126.desc:0 "[FROM.GetLeader] has rudely decided to reject our offer of an alliance between our nations, stating that it would go against their principle of neutrality. We can only imagine the amounts of corruption that led to this erroneous decision."
 SEA_japan_foreign_policy.126.t:0 "[FROM.GetNameDefCap] Refuses to Join Us"
 SEA_japan_foreign_policy.127.a:0 "No, we must let this go..."
 SEA_japan_foreign_policy.127.b:0 "Yes, they will pay for this!"
 SEA_japan_foreign_policy.127.desc:0 "The treacherous [FROM.GetLeader] has left us in favor of the communists in [JAP.GetNameDef], breaking the agreements signed between our nations at the end of the Russian civil war. Should we punish them for their turncoat behavior?"
 SEA_japan_foreign_policy.127.t:0 "[FROM.GetNameDefCap] Joins the Fifth International"
 SEA_japan_foreign_policy.128.a:0 "We do not possess the strength to reject their demands"
 SEA_japan_foreign_policy.128.b:0 "We will fight to the last man!"
 SEA_japan_foreign_policy.128.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has demanded that our illegal breakaway state once again submit to the rule of the central authority in Tokyo, and return to the [FROM.GetAdjective] sphere. How should we respond to this apparent threat?"
 SEA_japan_foreign_policy.128.t:0 "[FROM.GetLeader] Demands our Submission"
 SEA_japan_foreign_policy.129.a:0 "Brilliant"
 SEA_japan_foreign_policy.129.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has intelligently accepted our demands and submitted to our authority, once again bringing the [FROM.GetAdjective] nation back into our sphere of influence. We stand victorious on this day, as the [FROM.GetAdjective] people have now been liberated from their bourgeois dictatorship!"
 SEA_japan_foreign_policy.129.t:0 "[FROM.GetLeader] Agrees to our Demands"
 SEA_japan_foreign_policy.13.a:0 "It is not worth fighting over"
 SEA_japan_foreign_policy.13.b:0 "Who do they think they are?"
 SEA_japan_foreign_policy.13.desc:0 "\nEarlier this week, forces belonging to [JAP.GetNameDef] moved in and occupied our territory of [721.GetName], stating that they were on a mission to protect the region from potential occupation by their enemies. This is clearly an act of war, however it is one which we could likely choose to simply ignore, seeing as they are not a foe we can afford fighting at the moment."
 SEA_japan_foreign_policy.13.t:0 "[FROM.GetNameDefCap] occupies [721.GetName]!"
 SEA_japan_foreign_policy.130.a:0 "Then we must take back our territory by force!"
 SEA_japan_foreign_policy.130.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has unfortunately rejected our demands for submission, claiming that the will of the people is for an independent democracy rather than a revolutionary state in the [ROOT.GetAdjective] sphere. They have made the wrong choice..."
 SEA_japan_foreign_policy.130.t:0 "[FROM.GetLeader] Rejects our Demands"
 SEA_japan_foreign_policy.131.a:0 "For the Proletariat!"
 SEA_japan_foreign_policy.131.b:0 "We must stop this folly!"
 SEA_japan_foreign_policy.131.desc:0 "After recent calls by the [FROM.GetAdjective] government and agitators such as Pak Hon-yong it seems that the [ROOT.GetAdjective] proletariat has grown weary of waiting for a peaceful change of government. Following intense discourse it seems that diplomacy has fallen through and armed conflict has ensued, with Hon-yong's forces already having seized control of the southern parts of the country."
 SEA_japan_foreign_policy.131.t:0 "[FROM.GetNameDefCap] Incites a Civil War in [ROOT.GetNameDef]"
 SEA_japan_foreign_policy.132.a:0 "We do not possess the strength to reject their demands"
 SEA_japan_foreign_policy.132.b:0 "We will fight to the last man!"
 SEA_japan_foreign_policy.132.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has demanded that our bourgeois dictatorship submit to the rule of the central communist authority in Tokyo, and allow the people of our nation to properly rule themselves, as a loyal part of the [FROM.GetAdjective] sphere. How should we respond to this apparent threat?"
 SEA_japan_foreign_policy.132.t:0 "[FROM.GetLeader] Demands our Submission"
 SEA_japan_foreign_policy.133.a:0 "Brilliant"
 SEA_japan_foreign_policy.133.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has accepted our demands and submitted to our authority, bringing the [FROM.GetAdjective] nation into our sphere of influence. We stand victorious on this day, as the [FROM.GetAdjective] people have now been liberated from their bourgeois dictatorship!"
 SEA_japan_foreign_policy.133.t:0 "[FROM.GetLeader] Agrees to our Demands"
 SEA_japan_foreign_policy.134.a:0 "Then we must liberate their people by force!"
 SEA_japan_foreign_policy.134.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has unfortunately rejected our demands for submission, claiming that the will of the people is for an independent nation rather than a revolutionary state in the [ROOT.GetAdjective] sphere. They have made the wrong choice..."
 SEA_japan_foreign_policy.134.t:0 "[FROM.GetLeader] Rejects our Demands"
 SEA_japan_foreign_policy.135.a:0 "Prosperity is within sight!"
 SEA_japan_foreign_policy.135.desc:0 "Earlier today, [ROOT.GetLeader] and various [JAP.GetAdjective] army leaders held a joint proclamation, declaring the establishment of a new [ROOT.GetAdjective] state. We will stand victorious against all of our foes!"
 SEA_japan_foreign_policy.135.t:0 "Proclamation of the Second Philippine Republic"
 SEA_japan_foreign_policy.14.a:0 "Very well"
 SEA_japan_foreign_policy.14.desc:0 "The [FROM.GetAdjective] administrators who have aided in the establishment of our state have decided that now would be a good time to reorganize our government structure, and reshape our legal system. In the long run this will only serve to strengthen us though, so we have no reason to refuse them."
 SEA_japan_foreign_policy.14.t:0 "[FROM.GetNameDefCap] Reorganizes our Government"
 SEA_japan_foreign_policy.15.a:0 "This is not worth fighting over"
 SEA_japan_foreign_policy.15.b:0 "We will not give it up to them!"
 SEA_japan_foreign_policy.15.desc:0 "Citing that the city may be a good point for their enemies to strike them from should the opportunity arise, the [FROM.GetAdjective] troops administering the [592.GetName] region have presented us with an ultimatum. Either we allow them in, essentially giving them the powers to do as they wish with the city, or we face the full force of the [FROM.GetAdjective] army. What should we do?"
 SEA_japan_foreign_policy.15.t:0 "[FROM.GetNameDefCap] demands Occupation of [729.GetName]"
 SEA_japan_foreign_policy.16.a:0 "A Great Day for the [ROOT.GetAdjective] People"
 SEA_japan_foreign_policy.16.desc:0 "The regional administrators of [729.GetName] have decided to let our troops in, realizing that resistance would ultimately prove futile. Our people rejoice, as another western power has been pushed out from East Asia!"
 SEA_japan_foreign_policy.16.t:0 "[FROM.GetNameDefCap] Transfers [729.GetName]"
 SEA_japan_foreign_policy.17.a:0 "They will come to regret their decision!"
 SEA_japan_foreign_policy.17.b:0 "We must let this go"
 SEA_japan_foreign_policy.17.desc:0 "The regional administrators of [729.GetName] have forgotten their place, and decided to refuse the demands previously issued to them by our governors in [592.GetName]. The time has come to take down the [FROM.GetAdjective] empire once and for all!"
 SEA_japan_foreign_policy.17.t:0 "[From.GetNameDefCap] Refuses our Demands"
 SEA_japan_foreign_policy.18.a:0 "We will be stronger together"
 SEA_japan_foreign_policy.18.b:0 "That would go against our principles of neutrality..."
 SEA_japan_foreign_policy.18.desc:0 "A delegation from far away has recently arrived at our capital, seeking an audience with his highness. They claim to be from [FROM.GetNameDef], and seek an alliance between our nations. Do we accept?"
 SEA_japan_foreign_policy.18.t:0 "[FROM.GetNameDefCap] Invites us to Their Alliance"
 SEA_japan_foreign_policy.19.a:0 "They know what's best for them"
 SEA_japan_foreign_policy.19.desc:0 "[FROM.GetLeader] has graciously accepted our offer to formalize an alliance between our nations, and has already begun initiatives to integrate into our sphere. Today is a day for celebration!"
 SEA_japan_foreign_policy.19.t:0 "[FROM.GetNameDefCap] Accepts our Invitation"
 SEA_japan_foreign_policy.2.a:0 "The Emperor will be pleased to hear this"
 SEA_japan_foreign_policy.2.desc:0 "[FROM.GetLeader] has stepped down in favor of our candidate for the [FROM.GetAdjective] throne, Prince De. The region has now fallen under our occupation, and the reorganization of their government will proceed shortly."
 SEA_japan_foreign_policy.2.t:0 "[FROM.GetNameDefCap] Submits to Our Rule"
 SEA_japan_foreign_policy.20.a:0 "It's their loss"
 SEA_japan_foreign_policy.20.desc:0 "[FROM.GetLeader] has rudely decided to reject our offer of an alliance between our nations, stating that it would go against their principle of neutrality. We can only imagine the amounts of corruption that led to this erroneous decision."
 SEA_japan_foreign_policy.20.t:0 "[FROM.GetNameDefCap] Refuses to Join Us"
 SEA_japan_foreign_policy.21.a:0 "If that is what they wish to do"
 SEA_japan_foreign_policy.21.desc:0 "Our gracious overlord [FROM.GetNameDef] has decided to finally legitimize our claims to being the true Mongol state, and have proposed another reorganization of our government and agencies to facilitate this change in policy. Today is a great day for the [ROOT.GetAdjective] people!"
 SEA_japan_foreign_policy.21.t:0 "[FROM.GetNameDefCap] Further Reorganizes our Government"
 SEA_japan_foreign_policy.22.a:0 "They won't cause us any harm, let them be"
 SEA_japan_foreign_policy.22.b:0 "It is imperative that we increase our national security!"
 SEA_japan_foreign_policy.22.desc:0 "Agents suspected to be acting on the orders of the [FROM.GetAdjective] have been spotted within our borders, seemingly attempting to make contact with nobles, and enticing our citizens with great promises of Co-Prosperity. How should we handle the situation?"
 SEA_japan_foreign_policy.22.t:0 "Suspected [FROM.GetAdjective] Agents Spotted"
 SEA_japan_foreign_policy.27.a:0 "A great day indeed"
 SEA_japan_foreign_policy.27.desc:0 "The day has finally come, that we can launch our campaign and claim the realm of Outer Mongolia, currently ruled by the illegitimate coward [MON.GetLeader]. It is time to show the world that the spirit of Ghengis Khan lives on!"
 SEA_japan_foreign_policy.27.t:0 "[FROM.GetNameDefCap] Supports Pan-Mongol Claims"
 SEA_japan_foreign_policy.29.a:0 "At least we can now focus on other areas"
 SEA_japan_foreign_policy.29.desc:0 "The Suiyuan Campaign has come to an end, and the new borders have been drawn up. This is likely the last time our subjects can attempt an incursion like this without the Chinese central government joining in, as they are now on high alert regarding our actions in the region."
 SEA_japan_foreign_policy.29.t:0 "Results of the Suiyuan Campaign"
 SEA_japan_foreign_policy.3.a:0 "They have disrespected the Emperor, this cannot stand!"
 SEA_japan_foreign_policy.3.b:0 "We did not need them anyway"
 SEA_japan_foreign_policy.3.desc:0 "[FROM.GetLeader] has refused to give in to our demands, despite having seen what we did to Nima-odsor when he stood up against our divine ruler. Perhaps it is time to teach them a lesson in humility."
 SEA_japan_foreign_policy.3.t:0 "[FROM.GetNameDefCap] Refuses to Submit to the Emperor"
 SEA_japan_foreign_policy.30.a:0 "Another threat dealt with"
 SEA_japan_foreign_policy.30.desc:0 "Finally, the relentless assault by [JAP.GetNameDef] and their vicious subjects have come to a halt, and their troops are returning to their positions. It is unknown whether what transpired today will be remembered in history, but at least the Nanjing Government is now aware of the [JAP.GetAdjective] ambitions in the region."
 SEA_japan_foreign_policy.30.t:0 "The End of the Suiyuan Campaign"
 SEA_japan_foreign_policy.31.a:0 "Show them who they're dealing with"
 SEA_japan_foreign_policy.31.desc:0 "Forces belonging to [MEN.GetNameDef] and the Grand Han Righteous Army have assaulted our positions in Suiyuan, and seem intent on capturing the Inner Mongolian aimags in our possession. We cannot let them pass!"
 SEA_japan_foreign_policy.31.t:0 "Pro-Japanese Forces Assault our Positions!"
 SEA_japan_foreign_policy.32.a:0 "We can promise them that"
 SEA_japan_foreign_policy.32.b:0 "We will make no deals with the [JAP.GetAdjective]"
 SEA_japan_foreign_policy.32.desc:0 "[FROM.GetAdjective] diplomats have made a one-eighty in regards to their foreign policy, and are now stating that they wish to work more closely with us, on the condition that we crack down on communist and anti-Japanese sentiments. Something is fishy about the deal, but perhaps it is worth the risk?"
 SEA_japan_foreign_policy.32.t:0 "Japan Seeks Collaboration against the Communist Threat"
 SEA_japan_foreign_policy.33.a:0 "The first step has been taken"
 SEA_japan_foreign_policy.33.desc:0 "[FROM.GetLeader], leader of [FROM.GetNameDef] has accepted our proposition, and promised to ban protests against our state, whilst also preparing to crack down on communist activities within the nation. Soon, we will be able to formalize an alliance with them, so that we can destroy the festering sore that threatens to lead all Asian people toward an inescapable and inevitable demise."
 SEA_japan_foreign_policy.33.t:0 "[FROM.GetLeader] Accepts our Demands"
 SEA_japan_foreign_policy.34.a:0 "They will come to regret their decision"
 SEA_japan_foreign_policy.34.desc:0 "[FROM.GetLeader], leader of [FROM.GetNameDef] has decided that the [FROM.GetAdjective] people deserve no quarter, rejecting our gracious offer and making the decision for us that we need to bring the [FROM.GetAdjective] nation to an end."
 SEA_japan_foreign_policy.34.t:0 "[FROM.GetLeader] Rejects our Demands"
 SEA_japan_foreign_policy.35.a:0 "How dare they!"
 SEA_japan_foreign_policy.35.desc:0 "Various radio stations on the west coast have begun broadcasting [FROM.GetAdjective] propaganda in order to sway our population to take their side in the conflict for Asia. We must shut this down, before it does too much harm!"
 SEA_japan_foreign_policy.35.t:0 "[FROM.GetNameDefCap] Spreads Pro-[FROM.GetAdjective] Sentiments"
 SEA_japan_foreign_policy.4.a:0 "We will be stronger together"
 SEA_japan_foreign_policy.4.b:0 "That would go against our principles of neutrality!"
 SEA_japan_foreign_policy.4.c:0 "We are in the middle of a war! Ask them to wait."
 SEA_japan_foreign_policy.4.c_tt:0 "We will be asked to respond once the limited war is over"
 SEA_japan_foreign_policy.4.desc:0 "A [FROM.GetAdjective] delegation has approached us seeking our cooperation in their quest for domination of the Asian continent, demanding that we join them in their current and future wars as they pursue this endeavor. They do not seem like they will take a no as an answer, but surely this cannot be to our benefit?"
 SEA_japan_foreign_policy.4.t:0 "[FROM.GetNameDefCap] Demands we Join Their Alliance"
 SEA_japan_foreign_policy.40.a:0 "The Emperor's supreme authority must always come first!"
 SEA_japan_foreign_policy.40.b:0 "We must pursue prosperity for all Asian states!"
 SEA_japan_foreign_policy.40.desc:0 "With the establishment of the Greater East Asia Co-Prosperity Sphere, a question has arisen. Do we pursue to promised goal of Asian prosperity, or do we take that which is rightfully ours and assert our control over Asia more directly?"
 SEA_japan_foreign_policy.40.t:0 "The Question of East Asian Co-Prosperity"
 SEA_japan_foreign_policy.41.a:0 "We should employ this strategy immediately!"
 SEA_japan_foreign_policy.41.b:0 "It would be wise to wait with our decision"
 SEA_japan_foreign_policy.41.desc:0 "The Senbu have been established to increase our control over our continental possessions, and have begun attempting to increase the compliance in our occupied territories. Perhaps it is time to give them more administrative duties, and properly put them to use?"
 SEA_japan_foreign_policy.41.t:0 "The Senbu"
 SEA_japan_foreign_policy.42.a:0 "It lies within our best interest"
 SEA_japan_foreign_policy.42.b:0 "This smells fishy"
 SEA_japan_foreign_policy.42.desc:0 "[FROM.GetLeader] has proclaimed that both of our nations possess a shared destiny, and that only by walking side by side can we eradicate the communist threat. To that end, the proposition of an alliance has been put forward to us, though its terms seem to state that it is only temporary. Should we accept their offer?"
 SEA_japan_foreign_policy.42.t:0 "A Sino-Japanese Alliance"
 SEA_japan_foreign_policy.43.a:0 "Splendid"
 SEA_japan_foreign_policy.43.desc:0 "Our people rejoice, as the [FROM.GetAdjective] nation has joined us in arms against the ultimate threat to Asian stability, namely the communists. Though this pact is only temporary, it is sure to bring us great advantages."
 SEA_japan_foreign_policy.43.t:0 "[FROM.GetLeader] Signs the Pact"
 SEA_japan_foreign_policy.44.a:0 "Nothing can be done about it"
 SEA_japan_foreign_policy.44.desc:0 "Foolishly, [FROM.GetLeader] of [FROM.GetNameDef] has decided to act dishonorably, refusing our great proposal. The alliance has been called off, and the Kwantung Army has once again begun eyeing up northern China. Perhaps a readjustment to our foreign policy is what is needed right now."
 SEA_japan_foreign_policy.44.t:0 "[FROM.GetLeader] Refuses to Sign the Pact"
 SEA_japan_foreign_policy.49.a:0 "Prosperity is within sight!"
 SEA_japan_foreign_policy.49.desc:0 "In a proclamation held in Shanghai today, [ROOT.GetLeader] alongside generals and administrators sent by the IJA declared the founding of new Chinese government, a better alternative to the corrupt Kuomintang fiefdom. Long live the Republic of China!"
 SEA_japan_foreign_policy.49.t:0 "Proclamation of the Reorganized Government"
 SEA_japan_foreign_policy.5.a:0 "As they should"
 SEA_japan_foreign_policy.5.desc:0 "[FROM.GetLeader] has seen reason, and decided that [FROM.GetNameDef] will officially sign the necessary documents to facilitate their entry into our faction. Today is a day to be celebrated!"
 SEA_japan_foreign_policy.5.t:0 "[FROM.GetNameDefCap] Accepts our Offer"
 SEA_japan_foreign_policy.59.a:0 "Prosperity is within sight!"
 SEA_japan_foreign_policy.59.desc:0 "Earlier today, [ROOT.GetLeader] and various [JAP.GetAdjective] army leaders held a joint proclamation, declaring the establishment of a new [ROOT.GetAdjective] state. We will stand victorious against all of our foes!"
 SEA_japan_foreign_policy.59.t:0 "Proclamation of the State of Burma"
 SEA_japan_foreign_policy.6.a:0 "Prepare the troops to attack!"
 SEA_japan_foreign_policy.6.desc:0 "[FROM.GetLeader] refuses to see reason, and has stated that [FROM.GetNameDef] will not be joining an alliance with us. What is not known to them, is that we have no intention of letting them be neutral in the upcoming world conflict.."
 SEA_japan_foreign_policy.6.t:0 "[FROM.GetNameDefCap] Refuses to Join Us"
 SEA_japan_foreign_policy.60.a:0 "Fight them back, destroy any traitors!"
 SEA_japan_foreign_policy.60.desc:0 "[JAP.GetLeader] has proclaimed the establishment of a new [ROOT.GetAdjective] state, one opposed to us and our current course. It seems they are prepared to fight for their independence from us, and are not going to give up without a fight!"
 SEA_japan_foreign_policy.60.t:0 "Japan Establishes the State of Burma"
 SEA_japan_foreign_policy.61.a:0 "It was predictable"
 SEA_japan_foreign_policy.61.b:0 "Perhaps he is right..."
 SEA_japan_foreign_policy.61.desc:0 "The traitor Wang Jingwei was seen leaving his residence last week, and left with an unknown destination. In hindsight it seemed inevitable, due to his dissatisfaction with [ROOT.GetLeader]s policies. He will not however be missed."
 SEA_japan_foreign_policy.61.t:0 "Wang Jingwei's Betrayal"
 SEA_japan_foreign_policy.62.a:0 "He will make for a strong leader"
 SEA_japan_foreign_policy.62.b:0 "Sun Dianying is more capable"
 SEA_japan_foreign_policy.62.desc:0 "Wang Jingwei, a former high-ranking member in the Kuomintang has arrived in Shanghai and wishes to work with us. Due to his position and popularity, it may be wise to give him a prominent position in our government, as he may be able to lead us well."
 SEA_japan_foreign_policy.62.t:0 "Wang Jingwei Defects"
 SEA_japan_foreign_policy.66.a:0 "Prosperity is within sight!"
 SEA_japan_foreign_policy.66.desc:0 "Earlier today, [ROOT.GetLeader] and various [JAP.GetAdjective] army leaders held a joint proclamation, declaring the establishment of a new [ROOT.GetAdjective] state. We will stand victorious against all of our foes!"
 SEA_japan_foreign_policy.66.t:0 "Proclamation of the Provisional Government of Free India"
 SEA_japan_foreign_policy.67.a:0 "Fight them back, destroy any traitors!"
 SEA_japan_foreign_policy.67.desc:0 "[JAP.GetLeader] has proclaimed the establishment of a new [ROOT.GetAdjective] state, one opposed to us and our current course. It seems they are prepared to fight for their independence from us, and are not going to give up without a fight!"
 SEA_japan_foreign_policy.67.t:0 "Japan Establishes the Provisional Government of Free India"
 SEA_japan_foreign_policy.68.a:0 "Prosperity is within sight!"
 SEA_japan_foreign_policy.68.desc:0 "Earlier today, [ROOT.GetLeader] and various [JAP.GetAdjective] army leaders held a joint proclamation, declaring the establishment of a new [ROOT.GetAdjective] state. We will stand victorious against all of our foes!"
 SEA_japan_foreign_policy.68.t:0 "Proclamation of the Second Philippine Republic"
 SEA_japan_foreign_policy.7.a:0 "On second thought, we should just submit now"
 SEA_japan_foreign_policy.7.b:0 "Then let them come!"
 SEA_japan_foreign_policy.7.desc:0 "Not taking no for an answer, [FROM.GetAdjective] troops have been spotted preparing for a swift invasion of our country, likely intending to quickly move in and subjugate us, bringing us into their sphere. This is likely the last chance we have to avoid conflict, but the question stands. Do we take it?"
 SEA_japan_foreign_policy.7.t:0 "[FROM.GetNameDefCap] Prepares for an Invasion"
 SEA_japan_foreign_policy.75.a:0 "We are most grateful!"
 SEA_japan_foreign_policy.75.desc:0 "It seems that our contacts in [FROM.GetNameDef] have finally managed to secure a deal with the nation's leadership, after the Kōdōha faction in which most of our contacts existed recently took over the government after a successful coup d'etat. Long live the two emperors!"
 SEA_japan_foreign_policy.75.t:0 "[FROM.GetAdjective] Equipment Arrives"
 SEA_japan_foreign_policy.76.a:0 "We will have to accept the situation"
 SEA_japan_foreign_policy.76.b:0 "They think too highly of themselves"
 SEA_japan_foreign_policy.76.desc:0 "[FROM.GetLeader] has declared that due to the state of emergency that was declared in the wake of the Kōdōha coup, and the possibility of dissenting officers hiding in our governed regions, we should become an integrated part of the nation. This would in turn allow for full governance by the [FROM.GetAdjective] state. Do we accept?"
 SEA_japan_foreign_policy.76.t:0 "[FROM.GetNameDefCap] Demands Full Integration"
 SEA_japan_foreign_policy.77.a:0 "Great!"
 SEA_japan_foreign_policy.77.desc:0 "[FROM.GetLeader], our governor of [FROM.GetNameDef] has accepted full integration into our nation earlier today. This means that our government can finally hold full control over even the local divisions of our Korean regions."
 SEA_japan_foreign_policy.77.t:0 "[FROM.GetNameDefCap] Accepts Total Integration"
 SEA_japan_foreign_policy.78.a:0 "We need someone more trustworthy in charge!"
 SEA_japan_foreign_policy.78.b:0 "We will respect their wishes, for now..."
 SEA_japan_foreign_policy.78.desc:0 "Despite the obvious advantages and it clearly being the best for the future of the nation, the governor of [FROM.GetNameDef], [FROM.GetLeader] has rejected our request for total integration. One can only speculate as to the reasons, but it seems they might not have the nations best interests in mind."
 SEA_japan_foreign_policy.78.t:0 "[FROM.GetNameDefCap] Rejects Total Integration"
 SEA_japan_foreign_policy.79.a:0 "Yes, this will benefit us"
 SEA_japan_foreign_policy.79.b:0 "No! Manchuria's destiny lies elsewhere!"
 SEA_japan_foreign_policy.79.desc:0 "[FROM.GetLeader] has approached us with a proposition, claiming it is for the best of both our populations. The request is for our nation to become an integrated part of [FROM.GetNameDef] in due time, ending our autonomy and making us a core part of their realm. Does this really benefit us?"
 SEA_japan_foreign_policy.79.t:0 "[FROM.GetNameDefCap] Seeks Closer Integration"
 SEA_japan_foreign_policy.8.a:0 "And order is restored"
 SEA_japan_foreign_policy.8.desc:0 "Finally, after long deliberation, the delegation from [FROM.GetNameDef] has decided to sign the revised documents we presented them with, avoiding military intervention, but giving up their independence in the process. Now, we stand fully ready to strike south!"
 SEA_japan_foreign_policy.8.t:0 "[FROM.GetNameDefCap] Submits to our Demands"
 SEA_japan_foreign_policy.80.a:0 "Very well"
 SEA_japan_foreign_policy.80.desc:0 "The Concordia Association, the ruling elite in [FROM.GetNameDef], have agreed to our proposition and stand ready to administer the region as an integral part of our realm in the near future. It seems our plans for unification will be able to proceed smoothly."
 SEA_japan_foreign_policy.80.t:0 "The Concordia Association Agrees"
 SEA_japan_foreign_policy.81.a:0 "We will deal with them later"
 SEA_japan_foreign_policy.81.b:0 "If that is their wish.."
 SEA_japan_foreign_policy.81.desc:0 "The Concordia Association, the ruling elite in [FROM.GetNameDef], have decided to refuse our offer, claiming that they do not benefit from being integrated in our nation. Perhaps they were persuaded by Manchurian dissidents or communists, but sadly it is not a decision we can reverse all that easily..."
 SEA_japan_foreign_policy.81.t:0 "The Concordia Association Opposes Us"
 SEA_japan_foreign_policy.82.a:0 "Anything for our [FROM.GetAdjective] friends!"
 SEA_japan_foreign_policy.82.b:0 "This puts us in too much danger"
 SEA_japan_foreign_policy.82.desc:0 "Our historical friends over in the far eastern nation of [FROM.GetName] have approached us with an enticing offer. Due to our historical ties, and our mutual distrust towards the [SOV.GetAdjective] state, they have offered a military pact that states that if one of us enters a war with [SOV.GetNameDef], so will the other. Surely this is too good of an opportunity to pass up?"
 SEA_japan_foreign_policy.82.t:0 "[FROM.GetNameDefCap] Seeks Anti-Soviet Cooperation"
 SEA_japan_foreign_policy.83.a:0 "Excellent!"
 SEA_japan_foreign_policy.83.desc:0 "Our great friends in [FROM.GetNameDef] have graciously accepted our offer to establish a mutual anti-[SOV.GetAdjective] pact. Delegates are signing the necessary documents to make the agreement into reality at this very moment, and preparation for a swift invasion of [SOV.GetNameDef] should it become necessary are also underway."
 SEA_japan_foreign_policy.83.t:0 "[FROM.GetLeader] Signs the Pact"
 SEA_japan_foreign_policy.84.a:0 "Perhaps a second isolation would benefit us..."
 SEA_japan_foreign_policy.84.desc:0 "Sadly, despite our historical efforts to improve relations between our two nations, [FROM.GetLeader] has turned down our proposal for a mutual anti-[SOV.GetAdjective] pact. It is stated to be too dangerous for the [FROM.GetAdjective] nation should the pact be discovered by [SOV.GetAdjective] agents."
 SEA_japan_foreign_policy.84.t:0 "[FROM.GetLeader] Dismisses the Pact"
 SEA_japan_foreign_policy.85.a:0 "Our foresight pays off."
 SEA_japan_foreign_policy.85.d:0 "Just as we suspected when we signed the Anti-Soviet Pact, we now find ourselves in a state of war with the Soviet Union. It is time for our co-signatories to honor their promise and join us."
 SEA_japan_foreign_policy.85.t:0 "Call Pact Members to War"
 SEA_japan_foreign_policy.86.a:0 "[From.GetNameDefCap] does not stand alone!"
 SEA_japan_foreign_policy.86.b:0 "This is not our war."
 SEA_japan_foreign_policy.86.b_tt:0 "§YThis will be viewed as a betrayal by all countries who honor the pact (§!§R-50§!§Y opinion)§!"
 SEA_japan_foreign_policy.86.desc:0 "The Polish-Japanese Anti-Soviet Pact stipulates that all signatories must join in any defensive conflict with the Soviet Union. [From.GetName] has now been attacked by the Soviets and has sent out a request for all pact members to come to their aid immediately. It is time to show the [Root.GetAdjective] dedication to protecting the world from the threat of the Soviet Union once and for all."
 SEA_japan_foreign_policy.86.t:0 "[From.GetNameDefCap] Calls Pact Members to War"
 SEA_japan_foreign_policy.87.a:0 "It is what we signed off on"
 SEA_japan_foreign_policy.87.desc:0 "After the Concordia Association recently agreed to the Kōdōhas demands, it was only ever a matter of time before this would happen. Today, a [FROM.GetAdjective] delegation arrived with documents to facilitate our full integration into their nation, something which has already been signed by our own delegates."
 SEA_japan_foreign_policy.87.t:0 "The [FROM.GetAdjective] Annexation"
 SEA_japan_foreign_policy.88.a:0 "Splendid"
 SEA_japan_foreign_policy.88.desc:0 "[FROM.GetLeader], the leader of [FROM.GetNameDef] has accepted full integration into our nation earlier today. This means that our government can finally hold full control over even the local divisions of our Manchurian regions."
 SEA_japan_foreign_policy.88.t:0 "The Annexation of [FROM.GetNameDef]"
 SEA_japan_foreign_policy.9.a:0 "Tennoheika Banzai!"
 SEA_japan_foreign_policy.9.desc:0 "The final chance we graciously offered to [FROM.GetLeader] was refused, and our troops now stand ready to swiftly occupy their major cities. The time has come to show them what the [ROOT.GetAdjective] nation is made out of!"
 SEA_japan_foreign_policy.9.t:0 "[FROM.GetLeader] Refuses to Submit"
 SEA_japan_foreign_policy.92.a:0 "Ties can be strengthened through trade"
 SEA_japan_foreign_policy.92.b:0 "We see no need for agreements..."
 SEA_japan_foreign_policy.92.c:0 "We should establish a proper defensive agreement with them"
 SEA_japan_foreign_policy.92.d:0 "We should sign all of the proposed agreements!"
 SEA_japan_foreign_policy.92.desc:0 "Diplomats belonging to [FROM.GetNameDef] have approached us regarding the strengthening of our ties, something that was being curtailed by the military factions within their country, something that has now been dealt with. They wish for both trade, research and defensive agreements. Either we could sign off on one of these, or we could accept it all. It doesn't seem like a good idea to snub them entirely, after all the effort they went through to get here."
 SEA_japan_foreign_policy.92.t:0 "The [FROM.GetAdjective] Wish for Closer Ties"
 SEA_japan_foreign_policy.93.a:0 "Excellent!"
 SEA_japan_foreign_policy.93.desc:0 "The gracious leader of [FROM.GetNameDef], [FROM.GetLeader], has accepted one of our proposals, agreeing to establish closer trade and research connections to our nation. This is a great day for [ROOT.GetNameDef] and her diplomatic achievements!"
 SEA_japan_foreign_policy.93.t:0 "[FROM.GetLeader] Signs a Cooperation Agreement"
 SEA_japan_foreign_policy.94.a:0 "Dreadful"
 SEA_japan_foreign_policy.94.desc:0 "The two faced leader of [FROM.GetNameDef], [FROM.GetLeader], has denied all of our proposals, shutting down the idea of closer connections between our nations. This is a dark day for [ROOT.GetNameDef] and her diplomatic achievements..."
 SEA_japan_foreign_policy.94.t:0 "[FROM.GetLeader] Doesn't Sign any Agreement"
 SEA_japan_foreign_policy.95.a:0 "Excellent!"
 SEA_japan_foreign_policy.95.desc:0 "The gracious leader of [FROM.GetNameDef], [FROM.GetLeader], has accepted one of our proposals, agreeing to establish a defensive pact with our nation, where both of us promise to come to the others aid in case one is attacked. This is a great day for [ROOT.GetNameDef] and her diplomatic achievements!"
 SEA_japan_foreign_policy.95.t:0 "[FROM.GetLeader] Signs a Defense Agreement"
 SEA_japan_foreign_policy.96.a:0 "Excellent!"
 SEA_japan_foreign_policy.96.desc:0 "The gracious leader of [FROM.GetNameDef], [FROM.GetLeader], has accepted all of our proposals, agreeing to establish closer trade and research and development connections, as well as establishing a defensive pact with our nation, where both of us promise to come to the others aid in case one is attacked. This is a great day for [ROOT.GetNameDef] and her diplomatic achievements!"
 SEA_japan_foreign_policy.96.t:0 "[FROM.GetLeader] Signs a Comprehensive Diplomatic Agreement"
 SEA_japan_foreign_policy.97.a:0 "We see no issue with this"
 SEA_japan_foreign_policy.97.b:0 "You can take your papers back to Tokyo!"
 SEA_japan_foreign_policy.97.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has sent diplomats to our capital to discuss the prospect of intricate trade relations with the [FROM.GetAdjective] nation. This would take our relationship closer, but this will allow them access to our resources at a cheaper price, which has the risk of hurting our economy."
 SEA_japan_foreign_policy.97.t:0 "[FROM.GetNameDefCap] Requests Trade Agreements"
 SEA_japan_foreign_policy.98.a:0 "Splendid"
 SEA_japan_foreign_policy.98.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has responded well to our proposal for cheaper trade between our nations, and has signed the necessary paperwork to facilitate this going into effect immediately. They share our vision of a bright future, for all of Asia!"
 SEA_japan_foreign_policy.98.t:0 "[FROM.GetNameDefCap] Agrees to the Trade Proposal"
 SEA_japan_foreign_policy.99.a:0 "How deplorable!"
 SEA_japan_foreign_policy.99.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef] has responded harshly on our request for cheaper trade within our alliance, threatening to establish tariffs if we try to force such an issue through. It seems [FROM.GetNameDef] will not be a part of the bright future we have in mind."
 SEA_japan_foreign_policy.99.t:0 "[FROM.GetNameDefCap] Rejects the Trade Proposal"
 SEA_japan_news_events.01.a:0 "We must return to the ways of the Taishō era!"
 SEA_japan_news_events.01.b:0 "Looks like someone finally got a backbone"
 SEA_japan_news_events.01.desc:0 "\n In an impassioned speech delivered by [JAP.GetLeader], he exclaims that the military has gone too far this time, following the recent attempted coup d'etat by the Kōdōha faction within the army. He further claims that 'if the countless assassinations and attempted ousting of our government by fringe elements wasn't enough, they now also seek to use the recent incident to strengthen their own power and wrest control of our nation away from its people. This can not be allowed to continue!' \n\nIt seems conflict may be brewing in [JAP.GetNameDef]."
 SEA_japan_news_events.01.t:0 "[JAP.GetLeader] Speaks out Against Military Interference"
 SEA_japan_news_events.02.a:0 "We will bring prosperity to all of Asia!"
 SEA_japan_news_events.02.b:0 "Another ploy from the propaganda machine"
 SEA_japan_news_events.02.desc:0 "\nWith the proposed objectives of ensuring economic self-sufficiency and cooperation among the member states, along with resisting the influence of Western imperialism and Soviet communism, [JAP.GetLeader] has today announced the founding of the Dai Tōa Kyōeiken. Whether this is truly the objective of the union, or just another careful ploy by the [JAP.GetAdjective] propaganda machine is still on the top of everyone's minds."
 SEA_japan_news_events.02.t:0 "Formation of the Greater East Asia Co-Prosperity Sphere"
 SEA_japan_popup_events.10.a:0 "How dishonorable! We must act swiftly!"
 SEA_japan_popup_events.10.desc:0 "Recently rumors have been swirling around of a possible coup d'etat being planned by the Kōdōha faction, a radical traditionalist faction within the army. It seems likely that they will wait until Lieutenant Colonel Saburō Aizawa's trial is over, with him being an integral part of their organization. Knowing their possible motives, it seems likely that they will attempt to assassinate many of those who they see as a threat to their values during this coup. We may need to act swiftly, lest we see a bloodbath in the near future."
 SEA_japan_popup_events.10.t:0 "Rumors of a Military Coup"
 SEA_japan_popup_events.11.a:0 "The orders will be given, but try not to leave evidence"
 SEA_japan_popup_events.11.b:0 "No, the former Emperor must live!"
 SEA_japan_popup_events.11.desc:0 "With the Emperor still in house arrest despite the long time since we established our government, dissent is growing ever faster. It seems that our people wish to see Hirohito properly restored to the throne, and they may even be preparing to take action to free him if we do not do something about the situation soon. Perhaps they would calm down a bit if there were no such figure who could be restored to the throne, however unpopular it may be for us to make this happen. How should we approach this?"
 SEA_japan_popup_events.11.t:0 "Rumors of a Popular Rebellion"
 SEA_japan_popup_events.12.a:0 "The nation mourns"
 SEA_japan_popup_events.12.b:0 "Find the perpetrators, Nagako demands answers!"
 SEA_japan_popup_events.12.desc:0 "The prime minister announced earlier today that the former Emperor Shōwa has recently been found deceased in the imperial residence. Many suspect that it may have been a deliberate move by the military to try and secure their power, though the official claim is that he died of natural causes, though the Tokyo police haven't been allowed to enter to confirm his cause of death. Surely this is treason by the military itself?"
 SEA_japan_popup_events.12.t:0 "The Emperor Found Dead in his Residence"
 SEA_japan_popup_events.13.a:0 "Declare martial law, Nagako will solve the nations instability!"
 SEA_japan_popup_events.13.desc:0 "Through the recent investigations made by the Tokyo Metropolitan Police on the orders of Nagako, the wife of the late Emperor Shōwa, it has been discovered that the Kōdōha faction is indeed responsible for the coldblooded killing of the former Emperor. With more than enough grounds to declare this to be high treason, it is time to oust this treacherous clique from power."
 SEA_japan_popup_events.13.t:0 "Kōdōha Officers Indicted for Hirohito's Murder"
 SEA_japan_popup_events.14.a:0 "May Machida Chūji lead the Rikken Minseitō well" 
 SEA_japan_popup_events.14.desc:0 "Despite the dangerous times, the general election has been concluded, and our people have decided who will represent them in the House of Representatives. The Rikken Minseitō under Machida Chūji has emerged from the election as the biggest party, with Rikken Seiyūkai losing its majority. Though not holding great importance due to the recently falling powers of the civilian government, this election shows that our democracy still stands, fragile as it may be."
 SEA_japan_popup_events.14.t:0 "Conclusion of the 1936 General Election"
 SEA_japan_popup_events.15.a:0 "They must be stopped!" 
 SEA_japan_popup_events.15.desc:0 "Earlier this morning, Prime Minister Keisuke Okada was gunned down by Tokkō secret police officers while waiting to take the Yamanote Line at Tokyo Station. Soon after, the military issued a threat to the Imperial Diet, stating that any attempt to exclude them will be met by force. This is a clear escalation of the situation, and interim PM Machida Chūji has appealed to the Emperor to acknowledge the situation and make a statement. Only time will tell which side he will take."
 SEA_japan_popup_events.15.t:0 "Okada Killed at Tokyo Station"
 SEA_japan_popup_events.16.a:0 "The Liberal Machida Chūji" 
 SEA_japan_popup_events.16.b:0 "The Socialist Abe Isoo" 
 SEA_japan_popup_events.16.c:0 "President of the House of Peers, Tokugawa Iesato" 
 SEA_japan_popup_events.16.desc:0 "In response to the recent pleas by interim PM Machida Chūji, Emperor Hirohito has spoken out against the violence incited by the ongoing factionalist conflict, and has decided which person he should nominate to take up the role and become the new Prime Minister in these trying times. The person he has nominated is..."
 SEA_japan_popup_events.16.t:0 "The Emperor Nominates a new Prime Minister"
 SEA_japan_popup_events.17.a:0 "Things are ramping up..." 
 SEA_japan_popup_events.17.desc:0 "Many high-ranking officials within both the Imperial Japanese Army and the Imperial Japanese Navy have now declared that the army will go on strike, following our government's declaration to put an end to their influence over our politics. They say they will not defend the current government in the event of an attack, and are likely already plotting yet another coup d'etat to oust our Prime Minister from power."
 SEA_japan_popup_events.17.t:0 "The Military Declares a Strike"
 SEA_japan_popup_events.18.a:0 "Deploy the Metropolitan Police to Tokyo immediately!"
 SEA_japan_popup_events.18.desc:0 "The Military has begun preparing for clashes against forces loyal to the government after the civilian police forces recently declared loyalty to the diet. It seems they are attempting to secure control of regions in the case a civil war breaks out. We must begin counteracting this act of insurgency with utmost haste!"
 SEA_japan_popup_events.18.t:0 "The Military Entrenches Themselves"
 SEA_japan_popup_events.19.a:0 "We must not give in to their demands!"
 SEA_japan_popup_events.19.b:0 "Our people have overstepped, withdraw!"
 SEA_japan_popup_events.19.desc:0 "After the killing of another Japanese officer in Shanghai, we have received an ultimatum stating that unless we fully withdraw from the region, they will attack within the week. \n\nHow should we respond?"
 SEA_japan_popup_events.19.t:0 "The Hongkou Ultimatum"
 SEA_japan_popup_events.20.a:0 "They will pay for this!"
 SEA_japan_popup_events.20.desc:0 "Chinese authorities claim that the 'breaking point' has been reached in regards to our 'unwarranted aggressions' towards China! Our demands for reparations have been refused, and there are reports of more Japanese nationals coming under attack in Shanghai. If we needed an excuse to deal decisively with the Chinese, this is it!"
 SEA_japan_popup_events.20.t:0 "[FROM.GetLeader] Refuses the Hongkou Ultimatum"
 SEA_japan_popup_events.21.a:0 "The war will have to wait."
 SEA_japan_popup_events.21.desc:0 "Surprisingly, the Chinese have chosen to back down following the ultimatum sent for the control of Shanghai. They understand that angering us carries a steep price, and have agreed to extensive territorial concessions that include the city itself and its surrounding regions. Little by little, China is becoming ours."
 SEA_japan_popup_events.21.t:0 "[FROM.GetLeader] Signs the Hongkou Ultimatum"
 SEA_japan_popup_events.22.a:0 "The time has come to bring back the spirit of the Taishō Era!"
 SEA_japan_popup_events.22.desc:0 "After hearing news of the revocation of the controversial Peace Preservation Law, the army garrison at their headquarters in Osaka Castle opened fire at government-loyal garrisons stationed outside the park. It seems they will not back down without a fight, and are prepared to tear a rift in our nation's soul if it means preserving their hegemony. We must bring them down!"
 SEA_japan_popup_events.22.t:0 "The Siege of Osaka Castle"
 SEA_japan_popup_events.23.a:0 "Very well, Nobuhito will take his place"
 SEA_japan_popup_events.23.desc:0 "The legitimacy of Emperor Hirohito has come into question ever since his complacency towards the increasing military dominance over politics and inaction when violence ramped up between the factions in the country. Now, many call for one of his younger brothers, Nobuhito, who is an outspoken supporter of the civilian government, to take the title of Emperor, as his older brothers have both committed acts of treason. This would be able to retain royal support for our current government, and bolster our people's morale."
 SEA_japan_popup_events.23.t:0 "The Complacent Emperor"
 SEA_japan_popup_events.24.a:0 "We have reclaimed our future!"
 SEA_japan_popup_events.24.desc:0 "The last remnants of the Imperial Army in the Home Islands have waved the white flag, signaling the end to the decades long conflict raging between our nations government and its own military. Large parts of the nation were damaged by the fighting, but this signals a new start for the [ROOT.GetAdjective] people. Overseas, our enemy still lingers, but right now, it is the time for rebuilding. The government has already made plans to organize the first general election now that the corrupt elements can no longer interfere."
 SEA_japan_popup_events.24.t:0 "The Imperial Army Surrenders"
 SEA_japan_popup_events.25.a:0 "The Rikken Minseitō is victorious!"
 SEA_japan_popup_events.25.b:0 "The Rikken Seiyūkai is victorious!"
 SEA_japan_popup_events.25.desc:0 "The first election after the removal of the military from our politics is now being held, and people are going and using their vote to steer the future of the nation. The election currently stands between the liberal Rikken Minseitō party and the more conservative Rikken Seiyūkai, both having led the Imperial Diet very recently. The ballots are being cast, and soon, a winner will be determined."
 SEA_japan_popup_events.25.t:0 "The General Election"
 SEA_japan_popup_events.26.a:0 "There is no use resisting them"
 SEA_japan_popup_events.26.b:0 "It is time to crush this Japanese yoke!"
 SEA_japan_popup_events.26.desc:0 "With the civil war now raging between the military and the government in Japan, the Kwantung Army stationed in our country has taken the opportunity to perform a military coup against our own government, in the hopes of securing their own feudal warlord state in Manchuria. Should we let this happen, or should we resist them with all we have?"
 SEA_japan_popup_events.26.t:0 "The Kwantung Army's Coup D'etat"
 SEA_japan_popup_events.27.a:0 "Throw the invaders back into the sea!"
 SEA_japan_popup_events.27.desc:0 "With the civil war now raging between the military and the government in Japan, the Korean people have realized that this is the moment for them to regain control of their country and kick out the Japanese oppressors. Once again, the Korean Peninsula will flourish under the rule of its own people."
 SEA_japan_popup_events.27.t:0 "The Golden Opportunity"
 SEA_japan_popup_events.28.a:0 "Hokkaido is perfect"
 SEA_japan_popup_events.28.b:0 "Shikoku is remote enough"
 SEA_japan_popup_events.28.c:0 "Establish a branch in Kagoshima"
 SEA_japan_popup_events.28.desc:0 "The communist party has decided to begin underground operations, out of the sight and mind of both the Imperial Army and the government. The only question that comes to mind for them now is, which region would be remote enough where the possibility of being discovered and rooted out would be as low as possible?"
 SEA_japan_popup_events.28.t:0 "A Rural Base of Operations"
 SEA_japan_popup_events.29.a:0 "The Revolution has finally begun!"
 SEA_japan_popup_events.29.desc:0 "Early this morning, forces belonging to the Imperial Army occupied a warehouse on the outskirts of Miyazaki in which communist revolutionaries were located, attempting to arrest them. Kyūichi Tokuda has been rescued from Abashiri prison by local communist guerillas, and after a shootout occurred at the Miyazaki warehouse, the order has been given over a radio broadcast by Tokuda to begin the revolution with utmost haste. It seems the time for action is upon us."
 SEA_japan_popup_events.29.t:0 "The Miyazaki Incident"
 SEA_japan_popup_events.3.a:0 "This is a disaster!"
 SEA_japan_popup_events.3.desc:0 "At a plenary session of the House of Representatives of the Imperial Diet earlier today, Hamada Kunimatsu, a member of the Rikken Seiyukai Party gave a scathing critique of army minister Hisaichi Terauchi and the growing power of the military factions. Upon being confronted by the minister for disrespecting the military's authority and supposedly insulting their honor, he responded with 'Check the transcript and if there are any words that insult the military, I will commit seppuku and apologize to you. If there are no such words, you will commit seppuku yourself'. After this, Terauchi was furious at this and glared at Hamada from the stage, causing chaos with angry shouts flying through the assembly hall."
 SEA_japan_popup_events.3.t:0 "The Harakiri Debate"
 SEA_japan_popup_events.30.a:0 "The Kōza-ha are in the right here"
 SEA_japan_popup_events.30.b:0 "The Rōnō-ha's ideals shine brightest today"
 SEA_japan_popup_events.30.desc:0 "With the situation now more stable after the defeat of the Imperial Army, debate has broken out in the national diet regarding which route to take. The Kōza-ha argue that only through utilizing the proletariat and using an authoritarian guiding hand to steer the people can we achieve our ideal future, while the Rōnō-ha argue that a softer and less intrusive umbrella movement would be ideal to control the state. Which idea should be enacted?"
 SEA_japan_popup_events.30.t:0 "Debate on the Future Direction of the State"
 SEA_japan_popup_events.31.a:0 "Sanzō Nosaka has the popularity"
 SEA_japan_popup_events.31.b:0 "Kyūichi Tokuda has the experience"
 SEA_japan_popup_events.31.desc:0 "With the triumph of the revolution and power now in the hands of the Kōza-ha the time has come to elect a premier for the new people's republic. The two party front-runners during the war were Sanzō Nosaka and Kyūichi Tokuda, and with the revolution triumphant they have both shown that they are capable and willing to lead us toward communism. While ideologically not always aligned both show great potential, and who the choice lands on is therefore entirely up to fate. Will it be the international Nosaka or the more experienced but perhaps less widely popular Tokuda?"
 SEA_japan_popup_events.31.t:0 "A Leader for the Kōza-ha"
 SEA_japan_popup_events.32.a:0 "Hitoshi Yamakawa has the experience"
 SEA_japan_popup_events.32.b:0 "Kanson Arahata has the people's support"
 SEA_japan_popup_events.32.c:0 "Yamakawa Kikue has the most revolutionary ideas"
 SEA_japan_popup_events.32.desc:0 "Following the end of the civil war and the triumph of the revolution the Labor-Farmer faction has gained the confidence of the party and the people. Not being as orthodox in their ideals they have managed to gain many followers and as a result also the seat of power. The main question still remains however, who will become the next premier of the republic? Three candidates have been presented but the final election still remains. Will it be Hitoshi Yamakawa, who as a central figure in the socialist movement has shown his experience? Will it be Kanson Arahata, who has managed to gather large amounts of support with the people and therefore already was elected chairman? Or will it be Yamakawa Kikue, who despite her lesser prominence within the party has shown that she's fit for the role as both a leader and reformer?"
 SEA_japan_popup_events.32.t:0 "A Leader for the Rōnō-ha"
 SEA_japan_popup_events.33.a:0 "Make them live as normal people"
 SEA_japan_popup_events.33.b:0 "Let them serve their term in prison"
 SEA_japan_popup_events.33.c:0 "They are too dangerous to be kept alive!"
 SEA_japan_popup_events.33.d:0 "Send them into exile"
 SEA_japan_popup_events.33.desc:0 "With power now firmly in the hands of the people, the question of the former imperial family still looms over our heads. There are many differing opinions on how they best should be handled, some promoting reform and lowering them to the status of the common worker while some argue that they should face harsher punishments for their crimes against the people both during the war and long before. Where the choice falls is still undecided, but whatever it may be there will be dissenting opinions that may have to be dealt with."
 SEA_japan_popup_events.33.t:0 "The Fate of the Imperial Family"
 SEA_japan_popup_events.34.a:0 "We should make use of their fascinating traditions"
 SEA_japan_popup_events.34.b:0 "These revolutionary leaders must be granted the autonomy they deserve!"
 SEA_japan_popup_events.34.desc:0 "Many of our political thinkers have been reasoning that the lumpenproletariat are the main body of our revolution, and that the Ainu people are also included inside this group. Furthermore, they believe that the Ainu people have lived in a primitive communist system and deem them worthy of being the 'leaders of the Communist revolution'. The question now however stands as, in what way should they be so? Should it be by the incorporation of their traditions into our socialist society, or should it be through granting autonomy to the Ainu people?"
 SEA_japan_popup_events.34.t:0 "Debates on the Ainu Revolution Theory"
 SEA_japan_popup_events.35.a:0 "We will graciously accept"
 SEA_japan_popup_events.35.b:0 "No, the governorship must stay!"
 SEA_japan_popup_events.35.desc:0 "Our overlord [FROM.GetNameDef] has demanded that our colonial governor step down in favor of Yi Un, heir to the [ROOT.GetAdjective] throne and loyal to the Japanese Empire. This sounds like a deal too good to pass up."
 SEA_japan_popup_events.35.t:0 "[FROM.GetLeader] Wants to Empower the Yi Dynasty"
 SEA_japan_popup_events.36.a:0 "Allow them to continue"
 SEA_japan_popup_events.36.b:0 "Clamp down on these socialist agitators!"
 SEA_japan_popup_events.36.desc:0 "It has come to our attention that there are currently [FROM.GetAdjective] cells active in our country spreading communist sentiment. Although this seems harmless enough, it would appear that some of the propaganda is rather revolutionary in nature. Reports of workers being encouraged to organize and band together are becoming all the more frequent, and judging from recent history, we cannot be certain that this is not an elaborate ploy from the [FROM.GetAdjective] leadership to ultimately integrate us."
 SEA_japan_popup_events.36.t:0 "[FROM.GetNameDefCap] Stirs Communist Sentiment"
 SEA_japan_popup_events.37.a:0 "Allow them to continue"
 SEA_japan_popup_events.37.b:0 "Clamp down on these socialist agitators!"
 SEA_japan_popup_events.37.desc:0 "It has come to our attention that there are currently [FROM.GetAdjective] cells active in our country spreading communist sentiments. Although this in itself seems harmless enough, it would appear that some of the propaganda is rather revolutionary in nature. Reports of workers being encouraged to organize and band together are becoming all the more frequent, and judging from recent history, we cannot be certain that this is not an elaborate ploy from the [FROM.GetAdjective] leadership to ultimately integrate us."
 SEA_japan_popup_events.37.t:0 "[FROM.GetNameDefCap] Stirs Communist Sentiment"
 SEA_japan_popup_events.38.a:0 "For the Proletariat!"
 SEA_japan_popup_events.38.b:0 "We must stop this folly!"
 SEA_japan_popup_events.38.desc:0 "After a long period of growing communist sentiment it seems that the [ROOT.GetAdjective] proletariat has grown weary of waiting for a peaceful change of government. Following intense discourse it seems that diplomacy has fallen through and armed conflict has ensued."
 SEA_japan_popup_events.38.t:0 "Civil War in [ROOT.GetNameDef]"
 SEA_japan_popup_events.39.a:0 "This is the way forward!"
 SEA_japan_popup_events.39.b:0 "No, [ROOT.GetLeader] will continue to lead"
 SEA_japan_popup_events.39.desc:0 "Due to our umbrella movement's incorporation of various socialist movements around Japan, the Buddhist socialist movement with Girō Senoo at the helm has grown rapidly, and the Youth League for Revitalizing Buddhism has become the go-to movement for our socialist youths. Now, party advisor Tsuji Jun has pressed [ROOT.GetLeader] on the issue of leadership, claiming that the state would be better off with the ever-more popular Girō Senoo in charge of the party. Is this the right way forward towards spiritual liberation as well as social and economic emancipation?"
 SEA_japan_popup_events.39.t:0 "The Revitalization of Buddhism"
 SEA_japan_popup_events.4.a:0 "We must gain his support, by any means necessary!"
 SEA_japan_popup_events.4.b:0 "We have other candidates in mind"
 SEA_japan_popup_events.4.c:0 "If he doesn't support us, he must go..."
 SEA_japan_popup_events.4.desc:0 "Our Emperor has expressed disinterest towards our ambitions for a Shōwa Restoration and an establishment of a new military government. It is likely that he is still simply under the spell of the control faction, but will he not side with us, we would likely have to replace his imperial highness with his brother Yasuhito. Should we 'persuade' him to join us or might it be wise to let history play its course?"
 SEA_japan_popup_events.4.t:0 "Convincing the Emperor"
 SEA_japan_popup_events.43.a:0 "How dare they oppose the Emperors wish?"
 SEA_japan_popup_events.43.b:0 "The dark clouds must disappear from the reign of the Emperor!"
 SEA_japan_popup_events.43.desc:0 "Having heard of the Emperor's wish to announce a formal end to the East Asian war, several putschists under the command of Major Kenji Hatanaka have made a move to convince the Imperial Guard to aid them in occupying the Tokyo Imperial Palace and placing the Emperor in house arrest. Generals Shizuichi Tanaka and Takeshi Mori have prepared to put a swift end to this attempted coup d'etat, but who knows which side will come out on top?"
 SEA_japan_popup_events.43.t:0 "The Kyūjō Incident"
 SEA_japan_popup_events.45.a:0 "Our consolidation continues"
 SEA_japan_popup_events.45.desc:0 "Following the collapse of the official Japanese army command and the civil war that ensued in the Home Islands, the Japanese protectorate known as the East Hebei Autonomous Government which lies on our south-western border now lies unprotected. The time has come for us to strike, and take it while the [JAP.GetAdjective] government has too many other problems to deal with to care for what happens on the continent."
 SEA_japan_popup_events.45.t:0 "Occupying the East Hebei Autonomous Government"
 SEA_japan_popup_events.46.a:0 "We will deal with them later..."
 SEA_japan_popup_events.46.desc:0 "Following the collapse of the official Japanese army command and the civil war that ensued in the Home Islands, our former protectorate known as the East Hebei Autonomous Government which lies on [MAN.GetNameDef]'s south-western border now lies unprotected. As such, they have decided to strike, and take it while our government has too many other problems to deal with to care for what happens on the continent."
 SEA_japan_popup_events.46.t:0 "The Kwantung Army Occupies East Hebei"
 SEA_japan_popup_events.5.a:0 "Excellent!"
 SEA_japan_popup_events.5.desc:0 "After sufficient 'persuasion', it seems that our great emperor has decided to support our newly formed government, giving us the official blessing to continue forward with our plans of a Shōwa Restoration. This will serve to strengthen our nation!"
 SEA_japan_popup_events.5.t:0 "Hirohito Decides to Support the New Government"
 SEA_japan_popup_events.50.a:0 "Very well, if that is the Prime minister they want..."
 SEA_japan_popup_events.50.b:0 "We will not comply with their demands!"
 SEA_japan_popup_events.50.desc:0 "With the formation of the Imperial Rule Assistance Association, it has become clear that Genki Abe, the leader of the Thought Police alongside the various leaders of the civil service are not particularly pleased with the actions of [ROOT.GetLeader]. Now, they are demanding that he step down in favor of the pro-Nazi politician Seigō Nakano. Should we accept this pressure?"
 SEA_japan_popup_events.50.t:0 "A Joint Demand from the Tokkō and the Bureaucrats"
 SEA_japan_popup_events.51.a:0 "For the Emperor!"
 SEA_japan_popup_events.51.desc:0 "Due to our naval staff desiring to extend our Pacific defense perimeter to farther-flung atolls, our fleet was recently sent out to patrol the West Emperor Chain, when it came across an American fleet. The battle was hard fought, but in the end we sent the enemy packing, causing significant damage to their navy as well as their morale. For this achievement, our commanders have been given adequate promotions."
 SEA_japan_popup_events.51.t:0 "The Battle of Midway"
 SEA_japan_popup_events.52.a:0 "We showed them what for"
 SEA_japan_popup_events.52.desc:0 "Since the Japanese began attempting to expand their Pacific defense perimeter to farther-flung atolls, their fleets have begun to once again stray closer to Pearl Harbor. Unbeknownst to our enemies, however, our codebreakers had already determined the date and location of their planned attack on Midway, enabling an ambush of our own. The commander of the Pacific Fleet had sent a large force under Frank Jack Fletcher to the Midway area before the Japanese had arrived, and thanks to this careful preparation, we have now dealt a significant blow to their forces, one they will not quickly recover from."
 SEA_japan_popup_events.52.t:0 "The Battle of Midway"
 SEA_japan_popup_events.53.a:0 "A shameful display"
 SEA_japan_popup_events.53.desc:0 "Due to our naval staff desiring to extend our Pacific defense perimeter to farther-flung atolls, our fleet was recently sent out to capture the Midway Atoll. Unbeknownst to our commanders, however, American codebreakers had already determined the date and location of our planned attack on Midway, enabling an ambush of their own. The battle resulted in a devastating loss, and the media is censoring any and all information regarding the losses to the public, in order to keep morale high."
 SEA_japan_popup_events.53.t:0 "The Disaster at Midway"
 SEA_japan_popup_events.54.a:0 "This is an unprecedented disaster!"
 SEA_japan_popup_events.54.desc:0 "Since the Japanese began attempting to expand their Pacific defense perimeter to farther-flung atolls, their fleets have begun to once again stray closer to Pearl Harbor. Unbeknownst to our enemies, however, our codebreakers had already determined the date and location of their planned attack on Midway, enabling an ambush of our own. The commander of the Pacific Fleet had sent a large force under Frank Jack Fletcher to the Midway area before the Japanese had arrived. Despite all our best efforts, however, our fleet was no match for theirs, and within hours the course of the battle was already determined. Perhaps this is the turning point our enemies needed to bring our Pacific fleet to heel."
 SEA_japan_popup_events.54.t:0 "The Devastating Battle of Midway"
 SEA_japan_popup_events.6.a:0 "Then he must abdicate in favor of his son"
 SEA_japan_popup_events.6.b:0 "Place him under house arrest!"
 SEA_japan_popup_events.6.desc:0 "Despite our persistent attempts to persuade our great emperor, it seems he refuses to see reason. Though less than ideal, we did know that this was a possibility, and have plans laid to deal with a scenario of this kind. His brother, Yasuhito, a general in the Imperial Japanese Army is the candidate we have in mind who will take his place. This will either be as a Sesshō for Hirohito's son Akihito, or as a new emperor, one much more in line with our ideology."
 SEA_japan_popup_events.6.t:0 "Hirohito Refuses to Support the New Government"
 SEA_japan_popup_events.7.a:0 "Yasuhito will take his place"
 SEA_japan_popup_events.7.desc:0 "Earlier today our officers reportedly found Emperor Shōwa dead in his residence. They claim he was assassinated by foreign agents, but we cannot know for certain, for the truth may hurt us more than it would benefit us. Due to this threat, the military has declared martial law, and stated that Prince Chichibu, general of the Imperial Army will be crowned, as it would be too dangerous to continue the succession and give the crown to Akihito when the assailants may still be at large. Is this part of a greater conspiracy, or is there truly a foreign assailant?"
 SEA_japan_popup_events.7.t:0 "Hirohito Assassinated!"
 SEA_japan_popup_events.8.a:0 "Masaki is more popular among the men"
 SEA_japan_popup_events.8.b:0 "Araki should be made the nation's Sōtō"
 SEA_japan_popup_events.8.desc:0 "With the establishment of our new military government, the question of leadership has once again arisen. The founder of the Kōdōha Sadao Araki has stated that he wishes to take up the role of prime minister, and has put this forward to the emperor, but with Jinzaburō Masaki being more popular among both the men and the general populace than Araki, it may be wiser to allow him the role of Prime Minister, while Araki simply takes up a ceremonial position. What should we do?"
 SEA_japan_popup_events.8.t:0 "Question of the Military Clique's Leadership"
 SEA_japan_popup_events.9.a:0 "We must stay clear of such western concepts!"
 SEA_japan_popup_events.9.b:0 "Araki is right, and we should embrace those ideas"
 SEA_japan_popup_events.9.desc:0 "General Sadao Araki, a noted political philosopher within the army, has linked the ancient Bushido code of the samurai with ideas similar to European fascism in order to form the philosophical basis of his ideology, which links the Emperor, the people, the land and morality as one and indivisible. In order to strengthen these ideas, it may be wise to adopt a form of government closer to those in the west that he builds his ideological model upon. What say we?"
 SEA_japan_popup_events.9.t:0 "The Question of Morality, Bushido and Fascism"
 SEA_warlords.75.a:0 "They are welcome to try"
 SEA_warlords.75.b:0 "A foolish idea"
 SEA_warlords.75.desc:0 "The Inner Mongolian Army and Grand Han Righteous Army stand ready to launch an operation into the territories of warlord [SHX.GetLeader], provided they get our air support and supervision by Japanese staff officers. Perhaps we can secure more of Inner Mongolia without proving a larger-scale war in China."
 SEA_warlords.75.t:0 "[FROM.GetLeader] Wishes to Begin the Suiyuan Campaign"
 SHX:0 "Shanxi"
 SHX_suiyuan_campaign_idea:0 "Defending against the Suiyuan Campaign"
 SIA:0 "Siam"
 SIA_limited_war_cat:0 "Limited War"
 SIA_limited_war_cat_desc:0 "We cannot hope to overcome the great powers of the region in open war — not yet. By pressing our claims piece by piece, through carefully scoped campaigns, we chip away at their position while our own strength continues to grow."
 SIA_limited_war_indochina:0 "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc:0 "Take control of all highlighted states to win the §YLimited War§! and claim them without escalating to a full scale war.\n§RLosing more than [?var:global.limited_war_surrender_threshold|%.0] surrender progress will lose us the limited war§!"
 SIA_recover_indochina:0 "Recover Indochina"
 SIA_recover_indochina_desc:0 "The last century saw our country being fragmented by the [FRA.GetAdjective], a government across the world who has no business telling us what to do or how to live, and yet with gunboats and arms they took what was ours. In this century the power of the [FRA.GetAdjecive] is fading; this century is ours."
 SIA_recover_indochina_tt:0 "Unlocks the ability to launch limited wars against §YIndochina§! territories"
 SIA_reluctant_submission:0 "Reluctant Submission"
 SIA_reluctant_submission_desc:0 "Should [ROOT.GetNameDef] face invasion by a stronger foe, there may come a moment when open resistance promises only ruin. To bend is bitter, yet sometimes a government must yield to preserve the nation from destruction and await a more favorable hour."
 SIA_reluctant_submission_tt:0 "We will be able to peace out an attacking major country. However they will expect us to print money for them.\nOur §YConsumer Goods Factories factor§! will increase by §Y[?idea_SIA_printing_money_monthly_change|%]§! monthly, to a max of §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nTaking the focus §Y$SIA_thai_rice_company$§! will reduce the increase rate by §G50%§!\n\nTaking the focus §Y$SIA_demand_repatriation$§! will remove the need to print money."
 SIA_retake_lost_british_states:0 "Retake Lost British States"
 SIA_retake_lost_british_states_desc:0 "It was not only the [FRA.GetAdjective] who divided our great kingdom, but also the [ENG.GetAdjective] who, driven by ambition, also seized every opportunity to claim their share. As their attention is fixed on greater rivals the moment has come for us to act."
 SIA_retake_lost_british_states_tt:0 "Unlocks the ability to launch limited wars against British territories in §YBurma§! and §YMalaysia§!"
 SIA_standing_our_ground:0 "Standing Our Ground"
 SIA_standing_our_ground_desc:0 "There comes a point when retreat and negotiation offer only further humiliation. [ROOT.GetNameDefCap] must show that it still possesses the will to stand, to fight and to drive out those who presume they may dictate our fate at gunpoint."
