 FIN_finnish_federation_of_trade_unions:0 "Finnish Federation of Trade Unions"
 FIN_finnish_federation_of_trade_unions_desc:0 "The trade unions represent the true masters of industry, the workers. By cooperating with the federation of trade unions, we can reorganize the entire economy to the betterment of the working class."
 FIN_lotta_svard_support_battalions_bonus_tt:0 "§Y$category_support_battalions$:§! Organization: §G+10§!, HP: §G+5§!"
 FIN_socialist_welfare:0 "Socialist Welfare"
 FIN_socialist_welfare_desc:0 "Through the careful management of the economy and defense of our nation, we now have the resources to reward the working people with the establishment of a true welfare state. We shall ensure our people live long, happy lives."
 FIN_winter_warfare_battalion_tt:0 "Unlocks support battalion §Y$winter_logistics_support$§!."
