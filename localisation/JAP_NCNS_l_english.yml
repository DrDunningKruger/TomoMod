 JAP_minister_of_finance:0 "Minister of Finance"
 JAP_ministry_of_colonial_affairs:0 "Ministry of Colonial Affairs"
 JAP_ministry_of_colonial_affairs_desc:0 "Starting out initially as the Hokkaidō Colonization Office, the ministry has already come a long way. We must expand its responsibilities so that it can properly administer Nan'yō, Chōsen, Karafuto, Kantō and Taiwan. One day, may these lands be referred to by all as Japanese!"
 JAP_ministry_of_commerce_and_industry:0 "Ministry of Commerce and Industry"
 JAP_ministry_of_commerce_and_industry_desc:0 "In order to get a better overview of our finances, we should expand the Ministry of Commerce and Industry and ensure that they have all the resources they need to properly perform their tasks."
 JAP_ministry_of_greater_east_asia:0 "The Ministry of Greater East Asia"
 JAP_ministry_of_greater_east_asia_desc:0 "By establishing the Daitōashō, we will be able to more efficiently administrate overseas territories obtained in the Pacific, as well as coordinate the establishment and development of the Greater East Asia Co-Prosperity Sphere."
