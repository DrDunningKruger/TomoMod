 JAP_operation_MO_military_offensive:0 "Operation MO"
 JAP_operation_an_idea:0 "Operation AN"
 JAP_operation_take_australia:0 "Operation AN" # Australia-New Zealand
 JAP_operation_take_australia_desc:0 "The time has finally come. High command has authorized the operation to land in Australia, code-named Operation AN. We will strike down our foes, and take control of the underbelly of Asia!"
 JAP_organize_the_fifth_column_2_tt:0 "Gain 5 units with §Y5 militia§! battalions.\n"
