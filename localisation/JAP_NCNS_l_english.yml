 CHI_accepted_JAP_demands_to_suppress_communism_and_more_flag:0 "China has chosen to cooperate with our demands"
 CHI_avoid_another_crisis_cat:0 "Another Crisis in the Making"
 CHI_avoid_another_crisis_cat_desc:0 "Since the Mukden incident the Kwantung army has been preparing themselves to invade us yet again. We can now see them posturing more and more for each day and it is only a matter of time until they strike. Maybe [JAP.GetNameDef] can be appeased to keep the peace to allow us to prepare just a bit more."
 CHI_end_military_primacy:0 "End Military Primacy"
 CHI_end_military_primacy_desc:0 "The military has served its purpose, but its grip on power must be broken. Civilian authority must be restored if [ROOT.GetName] is to become a nation governed by law, not by generals."
 CHI_kwantung_army_impatience_dummy:0 "The Looming Crisis"
 CHI_prepare_for_a_change_in_leadership:0 "Prepare for a Change in Leadership"
 CHI_prepare_for_a_change_in_leadership_desc:0 "We have had our current government for a decade, and the specter of [JAP.GetNameDef] still haunts the [CHI.GetAdjective] nation. There is a need to have someone else hold the reins of power."
 CHI_prepare_for_a_change_in_leadership_tt:0 "§R[CHI_chiang_kaishek.GetName] will be replaced in the Xi'an incident for [CHI_wang_jingwei.GetName]§!"
