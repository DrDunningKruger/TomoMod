 JAP_kwantung_army_decisions:0 "The Kwantung Army"
 JAP_kwantung_army_decisions_desc:0 "Our forces operating in Manchuria and China, the Kantō-gun, are currently acting highly autonomously and have been known for taking action without approval from higher order. Originally created to operate as security force for the Kwantung leased territory, they have now far exceeded their original size, and may pull us into large-scale conflict if we do not take firm control of the situation."
 JAP_kwantung_army_impatience:0 "Kwantung Army Growing Impatient"
 JAP_kwantung_army_impatience_desc:0 "The Kwantung Army is quickly growing impatient with the current status-quo in China, and seem likely to continue on their path of expanding their domain without the government's approval if things go on like this."
