 RAJ_forward_bloc:0 "Forward Bloc"
 RAJ_forward_bloc_desc:0 "The Forward Bloc represents a bold vision for India’s future—one that rejects compromise and embraces revolutionary action. By uniting all anti-imperialist forces, we can accelerate the struggle for complete independence and lay the foundation for a stronger, more radical India."
 RAJ_give_me_blood_and_i_will_grant_you_freedom:0 "Give Me Blood And I Will Grant You Freedom"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_desc:0 "The path to independence is paved with struggle and sacrifice. By rallying the brave to fight for our cause, we can inspire a movement powerful enough to break the chains of colonial rule. Victory will come to those willing to pay its price."
 RAJ_give_me_blood_and_i_will_grant_you_freedom_tt:0 "Will start a civil war for independence between Democratic supporters and us\nEvery state that has above §Y65%§! or §Y85% resistance§! will side with us during the civil war and grant us 1 or 2 divisions respectively, depending on highest resistance.\nEvery other state will side with the Democratic side."
