 JAP_smaller_japanese_influence_growing_tibet:0 "Japanese Infiltration Attempts"
 JAP_socialist_pioneers_idea:0 "Socialist Pioneers"
 JAP_socialist_politician:0 "Socialist Politician"
 JAP_socialist_revolutionary:0 "Socialist Revolutionary"
 JAP_solidify_tohokai_rule:0 "Solidify Tohokai Rule"
 JAP_solidify_tohokai_rule_desc:0 "With Nakano's ascension to Prime Minister, the Tōhōkai faction within the Imperial Rule Assistance Association became the biggest one. Now, we have the opportunity to truly solidify rule under the Society of the East, and secure Nakano's role in [ROOT.GetAdjective] politics for the coming years!"
 JAP_soto_trait:0 "Sōtō"
 JAP_south_manchuria_railway_president:0 "South Manchuria Railway President"
 JAP_spiritual_mobilization_decisions:0 "Spiritual Mobilization"
 JAP_spiritual_mobilization_decisions_desc:0 "The [ROOT.GetAdjective] people are steadfast and ready to support our government in its every decision, as long as sufficient motivation is given. We should mobilize the population, both spiritually and physically, so that they may do their part in the war effort."
 JAP_spread_revolutionary_flames_to_south_asia_2_tt:0 "Unlocks decisions to §YStir Communist Sentiments§! inside §YSouth Asian§! nations"
 JAP_spread_revolutionary_flames_to_west_asia_2_tt:0 "Unlocks decisions to §YStir Communist Sentiments§! inside §YMiddle Eastern§! nations"
 JAP_spread_socialist_pamphlets_decision:0 "Distribute Socialist Pamphlets and Newspapers"
 JAP_spread_socialist_propaganda_in_campuses_decision:0 "Spread Socialist Propaganda in University Campuses"
 JAP_state_infiltrated_by_the_jcp:0 "Infiltrated by the JCP"
 JAP_state_infiltrated_by_the_jcp_tt:0 "This state will join the §YCommunists§! at the start of the civil war"
 JAP_state_shinotism_dm:0 "State Shintoism"
 JAP_state_shinotism_dm_desc:0 "Since the Meiji Restoration we have sought to use the worship at Shinto shrines to promote imperial loyalty and aid in nation building. This has allowed us to build up a country that is ready to sacrifice much in the name of the state."
 JAP_state_shinto_advocate:0 "State Shinto Advocate"
 JAP_state_shintoism_decisions:0 "State Shinto"
 JAP_state_shintoism_decisions_desc:0 "Shintoism has been the religion of the Japanese at the very least since the Yayoi period, syncretizing with Zen Buddhism over time. During the Meiji era, the Shrines came under growing government influence, and citizens were encouraged to worship the emperor as a kami. Due to this, we can now increase government control over the worship, and bend the people's wishes to our own."
 JAP_state_under_army_control:0 "Controlled by the Imperial Army"
 JAP_state_under_army_control_tt:0 "This state will join the §YFascists§! at the start of the civil war"
 JAP_state_under_rebel_control:0 "Secured by Opposition to the Imperial Army"
 JAP_state_under_rebel_control_tt:0 "This state will join the §YDemocrats§! at the start of the civil war, unless also §YInfiltrated by the JCP§!"
 JAP_staunch_traditionalist_trait:0 "Staunch Traditionalist"
 JAP_stolen_equipment_idea:0 "Military Depots Ransacked"
 JAP_strenghten_the_supply_lines:0 "Strengthen the Supply Lines"
 JAP_strenghten_the_supply_lines_desc:0 "Our supply lines are stretched thinner than we can handle, and our troops are suffering losses as a result. We must resolve this situation if we wish for our successes to continue, as time is rapidly running out before our troops will falter and fall."
 JAP_strike_north_doctrine:0 "Strike North Doctrine"
 JAP_strike_on_the_southern_resource_area:0 "Strike on the Southern Resource Area"
 JAP_strike_on_the_southern_resource_area_desc:0 "The time has come to set our plan in motion. We will strike south and take the resource-rich Western colonies for ourselves."
 JAP_strike_south_doctrine:0 "Strike South Doctrine"
 JAP_strike_south_doctrine_desc:0 "Though rich, China does not possess all resources we require. Not far away to the south, though, lie the Dutch East Indies and the British colonies of Malaya and Borneo. For true self-sufficiency we must wrest control over these areas away from the European imperialists."
 JAP_strike_south_idea:0 "Strike South"
 JAP_strike_south_idea_desc:0 "Only by acting decisively and striking fast can we hope to lay all of South East Asia at our feet. Our fleet must brave the waves in order for our soldiers to brave the enemies' beaches and subjugate the region."
 JAP_striking_the_sleeping_bear:0 "Striking the Sleeping Bear"
 JAP_strong_unions_idea:0 "Strong Unions"
 JAP_subdue_the_kwantung_army_2_tt:0 "A few §YKwantung Army§! Generals are demoted and retired from active service:"
 JAP_subject_tonarigumi_idea:0 "Tonarigumi"
 JAP_sufu_materials:0 "Sufu Materials"
 JAP_suiyuan_campaign_has_ended_flag:0 " The Suiyuan Campaign has Ended"
 JAP_suiyuan_campaign_has_started_flag:0 " The Suiyuan Campaign has Begun"
 JAP_superior_will:0 "Superior Will"
 JAP_support_ethiopia_static_modifier:0 "Support Ethiopia"
 JAP_supported_pro_japanese_sentiments_idea:0 "Growing Pro-Japanese Sentiments"
 JAP_supported_the_kozaha_idea_flag:0 "Supported the Kōza-ha in the debate"
 JAP_supported_the_kozaha_idea_tt:0 "Will unlock the focus §Y$JAP_the_lecture_group_ascendant$§!"
 JAP_supported_the_rounoha_idea_flag:0 "Supported the Rōnō-ha in the debate"
 JAP_supported_the_rounoha_idea_tt:0 "Will unlock the focus §Y$JAP_the_labor_farmer_faction_ascendant$§!"
 JAP_supremacy_of_technology:0 "Supremacy of Technology"
 JAP_supremacy_of_technology_desc:0 "Technology is what will bring us victory. All efforts must be directed to those efforts aiming at outclassing our enemies in terms of arms and equipment."
 JAP_supremacy_of_the_battlefleet:0 "Supremacy of the Battlefleet"
 JAP_supremacy_of_the_battlefleet_desc:0 "With our superior battleship designs, we require only one decisive engagement to decide the naval war. We must ensure we optimize our battlefleet to allow it to force such an engagement and win it."
 JAP_supreme_council_for_direction_of_war:0 "Supreme Council for the Direction of the War"
 JAP_supreme_council_for_direction_of_war_desc:0 "Our government has realized that we need to rapidly hold an Imperial General Headquarters-Government Liaison Conference, after seeing the dire need to strengthen coordination between state affairs and command. Perhaps this will be able to lead us to victory."
 JAP_surprise_invasion_idea:0 "Surprise Invasion"
 JAP_surprise_invasion_idea_desc:0 "The invasion that was recently launched by the Kwantung Army has not only taken the enemy by surprise, but also our own government and armed forces. It will take a short while before the army is fully mobilized and ready to fight its new foe."
 JAP_suzuki_bunji:0 "Bunji Suzuki"
 JAP_sway_admiral_loyalty_decision:0 "Sway Admiral Loyalty"
 JAP_sway_disillusioned_young_officers_2_tt:0 "A slightly larger portion of the §YImperial Army§! will be swayed to our side for the §YCivil War§!"
 JAP_sway_general_loyalty_decision:0 "Sway General Loyalty"
 JAP_sway_the_navy_moderates_2_tt:0 "§G4§! §YAdmirals§! will become loyal to us"
 JAP_syndicalism_idea:0 "Embraced Syndicalism"
 JAP_tachikawa_aircraft_company_organization:0 "$tachikawa_aircraft_company$"
 JAP_tadaichi_wakamatsu:0 "Tadakazu Wakamatsu"
 JAP_taiheyo_belt_modifier:0 "Taiheiyō Belt"
 JAP_taisei_party:0 "Taisei Yokusankai"
 JAP_taisei_party_long:0 "Imperial Rule Assistance Association"
 JAP_takahashi_korekiyo:0 "Korekiyo Takahashi"
 JAP_takahashi_korekiyo_was_killed:0 " Takahashi Korekiyo was killed by rebels"
 JAP_takaji_muranaka:0 "Takaji Muranaka"
 JAP_takashi_sakai:0 "Takashi Sakai"
 JAP_takeo_yoshikawa:0 "Takeo Yoshikawa" 
 JAP_taketora_ogata:0 "Taketora Ogata"
 JAP_tamon_yamaguchi:0 "Tamon Yamaguchi"
 JAP_teijiro_toyoda:0 "Teijirō Toyoda"
 JAP_temporary_better_supply_lines_bonus_idea:0 "Reinforced Supply Lines"
 JAP_temporary_construction_bonus_idea:0 "Rapid Industrial Expansion"
 JAP_temporary_dockyard_output_bonus_idea:0 "Increased Naval Production Quotas"
 JAP_temporary_factory_output_bonus_idea:0 "Increased Production Quotas"
 JAP_temporary_infra_construction_bonus_idea:0 "Rapid Infrastructure Expansion"
 JAP_temporary_manpower_growth_bonus_idea:0 "Rapid Mobilization"
 JAP_teruzo_ando:0 "Teruzō Andō"
 JAP_tetsu_katayama:0 "Tetsu Katayama"
 JAP_the_co_prosperity_sphere_decisions:0 "The Co-Prosperity Sphere"
 JAP_the_co_prosperity_sphere_decisions_desc:0 "Our ultimate goal of controlling Asia is coming ever closer, and through forming a pan-Asian union we can strengthen the ties between the different nations we seek to bring under our wings. We must do all in our power to make this dream a reality."
 JAP_the_crysanthemum_throne:0 "The Chrysanthemum Throne"
 JAP_the_crysanthemum_throne_desc:0 "The factions within our military squabble too much, and cannot reach an agreement on who to promote to be the next Prime Minister. With the situation being as volatile as it is, it might be prudent for the Emperor to step in and take direct control over the situation."
 JAP_the_divine_wind:0 "The Divine Wind"
 JAP_the_divine_wind_desc:0 "Kamikaze, the tactics of the Special Attack Unit, have changed suicide attacks from an improvised last measure to an established doctrine. With new planes, essentially manned missiles, these attacks will be unstoppable."
 JAP_the_divine_wind_idea:0 "The Divine Wind"
 JAP_the_economic_mirale_dm:0 "The Economic Miracle"
 JAP_the_economic_mirale_dm_desc:0 "Light industry and agriculture are no longer the backbone of the economy, with heavy industries having overtaken them. Adding to that, poverty and unemployment have been radically reduced as a result of Osamu Shimomura's brilliant economic reforms. Soon, we will be one of the world's largest economies!"
 JAP_the_eternal_kingdom:0 "The Eternal Empire"
 JAP_the_eternal_kingdom_desc:0 "Japan is a nation ruled by the divine Emperor, and is as such a country protected by the gods. With their aid, our divine country is immortal, and will stand strong for the rest of eternity. Long live His Majesty the Emperor, and long live the Great Empire of Japan!"
 JAP_the_eternal_kingdom_tt:0 "This spirit will be removed if we reach §Y50%§! Surrender Progress"
 JAP_the_eternal_kingdom_idea:0 "The Eternal Empire"
 JAP_the_final_war_theory_idea:0 "The Final War Theory"
 JAP_the_five_great_cities:0 "The Five Great Cities"
 JAP_the_five_great_cities_desc:0 "The cities of Kyoto, Osaka, Yokohama, Kobe, and Nagoya have been given special designations that provide them with various special provisions that are not available to ordinary cities, in order to aid in their industrialization and urbanization process, with the ultimate goal of becoming special cities independent from prefectures. We should increase our investments into this initiative."
 JAP_the_five_year_plan_idea:0 "The Five Year Plan"
 JAP_the_flying_geese:0 "The Flying Geese"
 JAP_the_flying_geese_desc:0 "The technological development in Southeast Asia can only be led by that of our own, and Asian nations will catch up with the West as a part of a regional hierarchy where the production of commoditized goods would continuously move from the more advanced countries to the less advanced ones. Just like geese in a V-formation, we will lead the way for Asian development!"
 JAP_the_great_spiritual_evil_opm:0 "Staunchly Anti-Communist Stance"
 JAP_the_harakiri_debate:0 "The Harakiri Debate"
 JAP_the_harakiri_debate_desc:0 "Following the disgraceful act of defiance Hamada Kunimatsu showed against the military, Hisaichi Terauchi has demanded the resignation of the cabinet and the inauguration of a new prime minister, if the old one has even a shred of honor left within him. Through a bit of careful maneuvering, Senjūrō Hayashi can be installed as a puppet of the military."
 JAP_the_heavenly_sovereign_trait:0 "The Heavenly Sovereign"
 JAP_the_imperial_defense_plan:0 "[JAP_the_imperial_defense_plan_key]"
 JAP_the_imperial_defense_plan_desc:0 "In order to protect the state, we must formulate a new plan for proactive defense. All wars will be won by sudden large-scale decisive strikes, avoiding prolonged wars and forcing our enemies to give in to our demands."
 JAP_the_imperial_defense_plan_imperial:0 "The Imperial Defense Plan"
 JAP_the_imperial_defense_plan_national:0 "The National Defense Plan"
 JAP_the_imperial_way_dm:0 "The Imperial Way"
 JAP_the_koiso_cabinet:0 "The Koiso Cabinet"
 JAP_the_koiso_cabinet_desc:0 "With the Emperor expressing growing distrust in the capabilities of [ROOT.GetLeader] and the Imperial Japanese forces, he has expressed a wish to unify the nation and seek a way out of the war, in order to avoid ultimate destruction of the nation. Though unpopular as a candidate among the politicians and generals, Koiso could have the ability to bring the nation out of the conflict."
 JAP_the_long_march_to_victory_idea:0 "The Long March to Victory"
 JAP_the_metal_collection_order:0 "The Metal Collection Order"
 JAP_the_metal_collection_order_desc:0 "Our nation is rapidly running out of strategic materials, regular metals included. We must therefore enact Imperial Ordinance No. 667, for the purpose of collecting metals owned by the public and private sectors in order to make up for the intensification of the war situation and shortages of materials."
 JAP_the_peoples_state_decisions:0 "The Anti-Military Struggle"
 JAP_the_peoples_state_decisions_desc:0 "Imperial rule and feudalism will soon be things of the past. It is time for the common man to steer his own destiny, and guide himself towards the goal of ultimate salvation for his people."
 JAP_the_shuilikeng_power_plant:0 "The Shuilikeng Power Plant"
 JAP_the_shuilikeng_power_plant_desc:0 "Our development of Taiwan is going ahead as planned, though the issue of power generation is becoming ever more pressing. This has been partially alleviated by the construction of hydroelectric power plants such as the Menpaitan Power Plant. We should take a page out of our past engineers' books, and continue building up these dams and stations across the island."
 JAP_the_suiyuan_offensive_mission:0 "The Suiyuan Campaign"
 JAP_the_suiyuan_offensive_mission_tt:0 "§Y[ROOT.GetNameDefCap]§! or any of our allies must capture §Y[621.GetName]§! or §Y[746.GetName]§! before the Campaign runs to an end"
 JAP_the_surrender_broadcast:0 "The Surrender Broadcast"
 JAP_the_surrender_broadcast_desc:0 "We have considered deeply the general trends of the world and the current situation of the Empire, and we have decided to take extraordinary measures to bring the current state of affairs to an end. The war situation has developed not necessarily to Japan's advantage, and we must accept this fact."
 JAP_the_surrender_broadcast_tt:0 "We will be more likely to be able to retain control of the Home Islands if we surrender peacefully"
 JAP_the_tokugawa_heir:0 "The Tokugawa Heir"
 JAP_the_ultimate_battleship:0 "The Ultimate Battleship"
 JAP_the_ultimate_battleship_desc:0 "As we are not rich in resources, we must ensure we put it to best use. We will build the most powerful battleships ever put on the surface of the planet, capable of defeating any enemy in a head-on engagement."
 JAP_the_ultimate_tank:0 "The Ultimate Tank"
 JAP_the_ultimate_tank_desc:0 "Our engineers have come up with a brilliant idea. Instead of fielding vast amounts of smaller vehicles, we should aim to build metal behemoths, ones that can crush our foes with only minimal support. Their first draft is a vehicle they refer to as the O-I tank, and we should get working on turning this vision into reality as soon as possible."
 JAP_the_war_has_not_necessarily_developed_focus:0 "Staunch Opposition to the East-Asian Conflict"
 JAP_the_war_has_not_necessarily_developed_focus_desc:0 "With the army-navy rivalry still a thorn in our side, and with our strategy for ending the war by striking a hard blow against our enemies having failed, it seems we are close to being out of options. Perhaps it is time to embrace dishonor, and bring about an era free from conflict."
 JAP_the_war_has_not_necessarily_developed_focus_tt:0 "Radical parts of the military will attempt to coup the government in an effort to stop the Emperor from broadcasting our nation's surrender."
 JAP_the_zero_tt:0 "Enables production of §HMitsubishi A6M Zero-sen§!"
 JAP_tohokai_leader:0 "Tōhōkai Leader"
 JAP_tohokai_party:0 "Tōhōkai"
 JAP_tohokai_party_long:0 "Society of the East"
 JAP_tohokai_sympathies:0 "Tōhōkai Sympathies"
 JAP_tohokai_sympathies_desc:0 "§LSupporter of the Tōhōkai's cause.§!"
 JAP_tojos_premiership:0 "Tojo's Premiership" 
 JAP_tojos_premiership_desc:0 "With the situation being as it currently is, it will prove vital to select a Prime Minister who can rally the IJA behind him, and lead as a martial leader as well as a civilian one. As such, general Hideki Tōjō will be chosen to lead the nation to glory."
 JAP_tojos_premiership_tt:0 "Is Not a Chinese State"
 JAP_tokko_arresting_anti_army_disidents_mission:0 "Tokkō Arresting Anti-Army Dissidents"
 JAP_tokko_arresting_anti_army_disidents_mission_tt:0 "The following advisors will be arrested and won't be usable until the civil war begins:"
 JAP_tokko_chief:0 "Tokkō Chief"
 JAP_tokko_idea_lar:0 "Tokkō"
 JAP_tokko_idea_lar_desc:0 "The Special Higher Police is an organization established for the purpose of carrying out civil law enforcement, control of political groups and ideologies deemed to threaten the public order of our nation. Keeping a close eye on people within our nation, they act as a vanguard against foreign agents as well as political dissidents."
 JAP_tokugawa_iesato:0 "Iesato Tokugawa"
