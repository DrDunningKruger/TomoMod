 JAP_army_smuggling_kwantung_army_units_to_the_home_islands_mission_tt:0 "The IJA will gain §R3§! additional §YCavalry Divisions§! at the start of the §YCivil War§!"
 JAP_army_weapons_administration_headquarters:0 "Army Weapons Administration HQ"
 JAP_army_weapons_administration_headquarters_desc:0 "In order to unify the manufacturing, supply, research, development, testing, and training of the Army's weapons, we should establish the Army Weapons Administration Headquarters. By doing this, our industries will hopefully stand a chance against juggernauts like [SOV.GetNameDef] and [USA.GetNameDef]."
 JAP_army_weapons_administration_headquarters_tt:0 "If the $JAP_army_faction$ is at least $JAP_imperial_influence_tier_3$, also gain §G1§! §YLand Warfare Facility§!"
 JAP_asahi_shimbun_editor:0 "Asahi Shimbun Vice President"
 JAP_asaichi_isobe:0 "Asaichi Isobe"
 JAP_assure_superior_naval_quality:0 "Assure Superior Naval Quality"
 JAP_assure_superior_naval_quality_desc:0 "While numbers matter, we must not let the enemy possess any ships more powerful than our greatest ones. The Yamato has been a good first step, but we must take these ideas even further."
 JAP_balanced_naval_approach:0 "Balanced Naval Approach"
 JAP_balanced_naval_approach_desc:0 "We must avoid building ourselves into a corner if it turns out that either battleships or carriers are ineffective against our foes. We should therefore keep a balanced naval approach, and invest in both sectors."
 JAP_battle_for_australia:0 "The Battle for Australia"
 JAP_battle_for_australia_desc:0 "Now that [AST.GetNameDef] has been isolated, it is time to begin fighting for the skies over the continent. If we can succeed in controlling their skies, then maybe occupying Oceania may not be so unreasonable after all."
 JAP_battle_for_oceania:0 "The Battle for Oceania"
 JAP_began_the_suiyuan_campaign:0 "Began the Suiyuan Campaign"
