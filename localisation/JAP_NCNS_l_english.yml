 sp_air_intercontinental_bomber:0 "Intercontinental Bomber"
 sp_air_intercontinental_bomber_desc:0 "A huge aircraft loaded with bombs and fuel, designed specifically for long-distance high-altitude flying granting it the ability to cross oceans and continents."
 sp_air_mothership_aircraft:0 "Mothership Aircraft"
 sp_air_mothership_aircraft_desc:0 "A massive aircraft that carries fighter planes into battle, enabling deep escort missions into enemy territory—truly the swarm-lord of the skies."
 sp_air_radar:0 "Radar"
 sp_air_radar_desc:0 "By using pulsed radio waves and detecting their reflections, we will be able to monitor enemy movements from land, air and sea."
 sp_naval_super_heavy_battleship:0 "Super Heavy Battleship"
 sp_naval_super_heavy_battleship_desc:0 "The naval arms race may have diversified in recent years, yet it is hard to deny the sheer majesty of the battleship, and the potential for building even greater behemoths."
 sp_naval_super_heavy_battleship_tt:0 "Add technology: §YSuper Heavy Hull§!"
 sp_rocket_interceptor:0 "Rocket Interceptor"
 sp_rocket_interceptor_desc:0 "Combining the power of a rocket with the maneuverability of a small chassis, we will create an unmatched interceptor aircraft."
