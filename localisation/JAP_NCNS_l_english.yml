 ship_hull_carrier_2:0 "Improved Carrier"
 ship_hull_carrier_2_desc:0 "As work begins on the first keel-up carrier designs, we must ensure that these ships have the range and speed to keep up with the rest of our navy, while respecting the post-war naval treaties."
 ship_hull_cruiser:0 "Cruiser"
 ship_hull_cruiser_desc:0 "The workhorse of the fleet, cruisers take over a lot of important duties, from scouting and screening for light cruisers to supporting the battleline for heavy cruisers."
 ship_hull_heavy:0 "Heavy Ship"
 ship_hull_heavy_desc:0 "The ultimate symbol of naval power, these massive, heavily armored behemoths still command respect on the high seas, even as some experts question their role in the age of the airplane and the submarine."
 ship_hull_light_2:0 "Basic Destroyer"
 ship_hull_light_2_desc:0 "Longer torpedo range and faster reload speeds, along with new types of armaments such as anti-air turrets, will allow our destroyers to remain efficient and versatile."
 ship_hull_submarine:0 "Submarine"
 ship_hull_submarine_desc:0 "A far cry from the crude boats of the Great War, the modern submarine is more capable than ever before and can threaten even the biggest ship for a very moderate cost."
 ship_hull_super_heavy_1:0 "Super Heavy Battleship"
 ship_hull_super_heavy_1_desc:0 "The current state of the world no longer has any room for abiding by naval treaties. Without these limitations, we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
 siam.10.a:0 "For [ROOT.GetName]!"
 siam.10.b:0 "Actually this is going quite well"
 siam.10.desc:0 "The enemy is routing, and our victory seems assured. With the territory firmly in control the old imperialist forces must be shaking in their boots. How could they lose? It is a sign of our divine providence."
 siam.10.t:0 "Victory!"
 siam.11.a:0 "We must cut our losses and withdraw."
 siam.11.b:0 "We will not abandon our claim!"
 siam.11.desc:0 "Against expectations, the [FROM.GetAdjective] military has outmaneuvered our forces and seized control of the contested region. Their occupation has weakened our authority and cast doubt on our claim to the area. Continuing the conflict risks further erosion of discipline and confidence, yet surrendering the territory would be a public admission of failure."
 siam.11.t:0 "[FROM.GetAdjective] Strategic Breakthrough"
 siam.12.a:0 "Our strength is undeniable."
 siam.12.desc:0 "Our campaign has succeeded. Enemy resistance has collapsed, and [FROM.GetName] has formally relinquished control of the disputed lands to avoid further devastation. This victory elevates our standing and secures our borders—for now."
 siam.12.t:0 "[FROM.GetName] Accepts Defeat"
 siam.13.a:0 "So be it."
 siam.13.desc:0 "[FROM.GetName] has dismissed all proposals involving territorial concessions, branding them unacceptable. Their leadership has declared that only the destruction of our state will end this conflict."
 siam.13.t:0 "[FROM.GetName] Rejects Any Settlement"
 siam.14.a:0 "No compromise, no surrender."
 siam.14.desc:0 "[FROM.GetNameDefCap] has abandoned any pretense of negotiation. Their intent is clear: complete conquest and absorption of our nation. This war will not be decided by treaties, but by total victory or total collapse."
 siam.14.t:0 "[FROM.GetNameDefCap] Commits to Total War"
 siam.15.a:0 "Offer Concessions."
 siam.15.b:0 "Only total victory is acceptable."
 siam.15.desc:0 "The swift assault by the [SIA.GetAdjective] forces may have caught us off guard, but as their advance falters under mounting strain, their weakness is plain to see. What was meant to be a lightning campaign has become a grinding ordeal for the [SIA.GetAdjective] military. We could choose to be magnanimous and offer them a way out through concessions, yet the decision rests with us whether mercy serves our interests better than total victory."
 siam.15.t:0 "The [SIA.GetAdjective] Assault Stalls"
 siam.16.a:0 "Peace it is"
 siam.16.b:0 "We will never surrender!"
 siam.16.desc:0 "Our offensive has stalled, that is not the problem, the problem is that our enemy knows it. They have sent us an ultimatum, either surrender now with minimal losses, or continue the war with more bloodshed. The only difference is how many dead to bury."
 siam.16.t:0 "Stalled Offensive"
 siam.17.a:0 "They shall have their wish."
 siam.17.desc:0 "[FROM.GetName] has stated in no uncertain terms that it would rather see their entire country lit in flames than cede one single bit to us. The war continues."
 siam.17.t:0 "[FROM.GetName] refuses to yield"
 siam.18.a:0 "[ROOT.GetNameDefCap] Stands!"
 siam.18.desc:0 "Intercepted communications from the enemy high command have confirmed our gravest fears, there will be no negotiated settlement, no concessions to bring this war to a measured end. They demand nothing less than the total capitulation of our nation, condemning us to life beneath yet another imperialist boot. If that is their aim then we have but one answer, we refuse to yield."
 siam.18.t:0 "[FROM.GetName] seek to capitulate us!"
