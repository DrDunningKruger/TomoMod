 JAP_shinkansen_in_operation_idea:0 "Shinkansen in Operation"
 JAP_ship_management_committee:0 "Ship Management Committee"
 JAP_ship_management_committee_desc:0 "With the recent ratification of the Wartime Shipping Control Order, we can authorize the establishment of a special corporation in charge of managing the shipping industry to control it and cooperate in the implementation of national policies regarding shipping in order to maximize the full potential of the shipping industry in wartime."
