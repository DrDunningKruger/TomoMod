 JAP_pending_imperial_influence_decision:0 "NOT: Pending Imperial Influence Decision"
 JAP_peoples_liberation_army_of_monglia_idea:0 "The Mongol People's Liberation Army"
 JAP_pivot_towards_defensive_measures:0 "Pivot Towards Defensive Measures"
 JAP_pivot_towards_defensive_measures_desc:0 "The war has developed not necessarily to our favor. It is becoming ever more plausible that our enemies land on the home islands, something we are currently ill equipped to combat. We should set out to solve this issue, lest we experience a century of humiliation of our own making!"
 JAP_popular_diplomat:0 "Popular Diplomat"
 JAP_prepare_for_peninsular_warfare:0 "Prepare for Peninsular Warfare"
 JAP_prepare_for_peninsular_warfare_desc:0 "In the case that we find ourselves at war and on the retreat, the Korean Peninsula would likely have to be our final holdout on the continent. We should make preparations so that we are able to hold this region, should such a worst-case scenario ever occur."
 JAP_prepare_the_southern_front:0 "Prepare the Southern Fronts"
 JAP_prepare_the_southern_front_desc:0 "A war in the pacific will involve naval landings to a large degree. The Special Naval Landing Forces require expansion if they are to be up to the task. Alongside this, it will prove worthwhile to invest in our marine paratroopers, as they will be able to capture strategic locations and islands before our main forces make it to the location."
 JAP_prepare_the_southern_front_tt:0 "When [ROOT.GetNameWithFlag] §Rdeclares war§! on a country that controls a §YSouth East Asian State§!:"
 JAP_press_association_idea:0 "Great Japan Press Association"
 JAP_pro_japanese_sentiments_for_usa_idea:0 "Civilian Pro-Japanese Sentiments"
 JAP_produce_bullet_stamps_decision:0 "Produce Bullet Stamps"
 JAP_promulgate_the_military_ministers_system:0 "The Military Ministers' Attaché System"
 JAP_promulgate_the_military_ministers_system_desc:0 "The brief period since the attempted coup d'etat by the Kōdōha faction has been anything but stable. With the military growing upset at the government, something needs to be done to placate them. To that end, Kōki Hirota has proposed making the minister of war a position that can only be given to an actively serving officer, as has been the case a few times throughout our history."
 JAP_protector_of_the_eternal_kingdom:0 "Protector of the Eternal Empire"
 JAP_publically_distance_from_sov_decision:0 "Publicly Distance from Soviet Bolshevism"
 JAP_publically_distance_from_sov_decision_tt:0 "Will allow for further decisions to be taken after having completed specific focuses to increase the chance for a successful revolution"
 JAP_radical_nichiren_preacher:0 "Radical Nichiren Preacher"
 JAP_raise_military_moreale_decision:0 "Raise Military Morale"
 JAP_raise_support_within_the_proletarian_class_2_tt:0 "We will gain §Y$JAP_strong_unions_idea$§! in the event of a §YCivil War§!" 
 JAP_range_focus_desc:0 "The distances involved in warfare in the Pacific theater are vast, and so we need models capable of bridging those distances."
 JAP_red_dawn_over_asia_idea:0 "A Red Dawn over Asia"
 JAP_reduce_zaibatsu_focus_cost_tt:0 "Taking §Y$JAP_sea_guide_the_zaibatsus$§! or §Y$JAP_democratic_work_with_the_zaibatsus$§! will reduce the time this focus takes down to §G35§! days."
 JAP_reform_the_army:0 "Reform the Army"
 JAP_reform_the_army_desc:0 "Count Hisaichi Terauchi, a general rapidly climbing the ranks of our military, has proposed for a revision to our army doctrines. He sees the old grand assault doctrines as outdated, claiming that a more mobile type of warfare will dominate the future battlefields. We should heed his advice, and make sure we do not fall behind the times."
 JAP_regional_development:0 "Regional Development"
 JAP_rely_on_supremacy_of_the_will:0 "Rely on Infantry Offensives"
 JAP_rely_on_supremacy_of_the_will_desc:0 "General Hideki Tōjō once proposed that wars should be won through decisive preemptive strikes, and battles through glorious mass charges and supremacy of will. We should support this idea, as it suits our current military doctrine well."
 JAP_reorganization_of_society_idea:0 "Reorganization of Society"
 JAP_reorganization_of_society_idea_desc:0 "We are currently eliminating remnants of feudalism, nationalism, and conservative traditions while promoting communist ideology. Abolishing Samurai and Feudal Hierarchy ideals, and removing Bushido from education and society, as well as promoting gender equality by granting women full legal and economic rights."
 JAP_reprimand_hamada_kunimatsu:0 "Reprimand Hamada Kunimatsu"
 JAP_reprimand_hamada_kunimatsu_desc:0 "In his speech criticizing the military in the Diet, Hamada Kunimatsu went way too far. In order to keep the military from completely outmaneuvering the civilian government politically, we need to properly reprimand him, and show that we still have some fight left in us."
 JAP_restructing_the_industrial_conglomerates:0 "Restructuring the Industrial Conglomerates"
 JAP_rethink_armor_doctrine:0 "Rethink Armor Doctrine"
 JAP_rethink_armor_doctrine_desc:0 "Hisaichi Terauchi has come to a dire conclusion. Our current armor and land vehicle designs are ill equipped to fight against anything other than light infantry, and will be decimated if they ever face off against western armor. We should remedy this oversight as soon as possible!"
 JAP_return_of_the_manchukuo_exiles_2_tt:0 "§G5§! §YIJA-loyal Generals of Noble Descent§! will be sent to §YManchuria§! in exchange for §YSocialist Industrialists§!"
 JAP_revere_the_emperor_shortcut:0 "Politics: Imperial Way"
 JAP_revoke_the_peace_preservation_law_requirements_tt:0 "The combined §YCommunist§! and §YDemocratic§! support is over 50%"
 JAP_riken_institute_director:0 "RIKEN Institute Director"
 JAP_rikichi_ando:0 "Rikichi Andō"
 JAP_rikken_minseito_victory_flag:0 "The Rikken Minseitō has won the General Election"
 JAP_rikken_seiyukai_leader:0 "Rikken Seiyūkai Leader"
 JAP_rikken_seiyukai_victory_flag:0 "The Rikken Seiyūkai has won the General Election"
 JAP_rounouha_modifier:0 "The Rōnō-ha Government"
 JAP_rounouha_party:0 "Rōnō-ha"
 JAP_rounouha_party_long:0 "The Labor-Farmer Faction"
 JAP_royal_lineage:0 "Royal Lineage"
 JAP_royal_lineage_desc:0 "This character is a royal of either direct, Miyake or Shinnōke descent."
 JAP_royal_support_for_civilian_government_idea:0 "Royal Support for the Civilian Government"
 JAP_saburo_aizawa:0 "Saburō Aizawa"
 JAP_sadao_araki:0 "Sadao Araki"
 JAP_saionji_kinmochi:0 "Kinmochi Saionji"
 JAP_sanzo_nosaka:0 "$sanzo_nosaka$"
 JAP_scholarly_ashigaru:0 "Scholarly Ashigaru"
 JAP_sea_battleship_initiative:0 "Battleship Initiative"
 JAP_sea_battleship_initiative_desc:0 "With our superior battleship designs, we require only one decisive engagement to decide the naval war. must ensure our battlefleet is optimized to engage decisively and secure victory as swiftly as the wind."
 JAP_sea_bigger_better_yamato:0 "Tsushima Class Battleships"
 JAP_sea_bigger_better_yamato_desc:0 "As we are not rich in resources, we must ensure we put it to best use. We will build the most powerful battleships ever put on the surface of the planet, capable of defeating any enemy in a head-on engagement. With this, our enemies will bow before us, or cease to exist."
 JAP_sea_exploit_southern_resource_area:0 "Exploit the Southern Resource Area"
 JAP_sea_exploit_southern_resource_area_desc:0 "Now that we have brought the south under our heel, we must greatly expand the exploitation of the South East Asian and East Indies' abundant resources to nourish our forces in our war."
 JAP_sea_greater_east_asian_co_properity_sphere:0 "The Greater East Asia Co-Prosperity Sphere"
 JAP_sea_greater_east_asian_co_properity_sphere_desc:0 "We must form a union in Asia in order to ensure economic self-sufficiency and cooperation among the member states, along with resisting the influence of Western imperialism and Soviet communism. Of course however, this is an effective propaganda tool to enforce our hegemony over the continent."
 JAP_sea_greater_east_asian_co_properity_sphere_tt:0 "It becomes §G25%§! cheaper to liberate and puppet §YAsian§! and §YOceanian§! states."
 JAP_sea_greater_east_asian_co_properity_sphere_2_tt:0 "Unlocks Decisions to §YEstablish Puppet-Regimes§! throughout Southeast Asia"
 JAP_sea_heavier_naval_guns:0 "Heavier Naval Guns"
 JAP_sea_heavier_naval_guns_desc:0 "It seems that our adversaries have invested heavily into armor for their naval vessels. We must ensure that we can keep up with their development and pierce their hulls. To that end, investments into heavier naval gunnery seem prudent."
 JAP_sea_long_operational_range:0 "Long Operational Range"
 JAP_sea_long_operational_range_desc:0 "As much as we may desire quick victories, wars are not easily won through direct military confrontations alone. The distances involved in warfare in the Pacific theater are vast, and so we need models capable of bridging those distances if we wish to succeed."
 JAP_sea_mil_tech_coop_with_germany:0 "Military Cooperation with Germany"
 JAP_sea_mil_tech_coop_with_germany_desc:0 "We require better technology to unite the world under one roof. Germany is not only a historical partner in technological developments for us, but also has ample military technological advances that would be extremely useful for our war effort. We must see to obtaining these schematics, no matter the cost!"
 JAP_sea_mountaineers:0 "Establish Mountaineer Regiments"
 JAP_sea_mountaineers_desc:0 "Our army has realized that it will not be able to penetrate the mountainous regions of southern and western China unless something drastic is done. They have therefore requested that special mountaineer brigades be established, so that they may lead the charge and penetrate the enemy lines."
 JAP_sea_national_defense_state:0 "National Defense State"
 JAP_sea_national_defense_state_desc:0 "[ROOT.GetLeader] has proclaimed the Shintaisei, making Japan into a National Defense State, in which every man, woman and child is to be mobilized to protect the nation. Under the National Mobilization Law, the government has also been given absolute power over the nation's assets. Through this, the Empire will be able to last for all of eternity!"
 JAP_sea_national_spiritual_mobliization_movement:0 "National Spiritual Mobilization Movement"
 JAP_sea_national_spiritual_mobliization_movement_desc:0 ""Luxury is our Enemy!" With thrift, hygiene and hard work elevated to national virtues, more manpower is made available to the war effort and the will of the heavenly emperor is properly conveyed to all of our imperial subjects."
 JAP_sea_pressure_siam:0 "Pressure Siam"
 JAP_sea_pressure_siam_desc:0 "Siam is located in a prime location to aid us in our coming war with the Western powers. By getting them on our side we will greatly facilitate the inevitable invasion of Malaya and, thereby, the East Indies. We must therefore make it abundantly clear to them, that if they are not with us, they are against us."
 JAP_sea_promote_japanese_settlement:0 "Promote Japanese Settlement"
 JAP_sea_promote_japanese_settlement_desc:0 "By settling our own people in Manchuria, we can increase the work force and thereby create more opportune locations for factories. The people moving there can also produce agricultural goods that can be sent back to the home islands."
 JAP_sea_purge_the_kodoha_faction:0 "Purge the Kodoha Faction"
 JAP_sea_purge_the_kodoha_faction_desc:0 "The Kōdōha squandered their opportunity to seize power, and it will cost them dearly. For their treachery towards his imperial majesty, we will strip them of their ranks, and try them for treason. The time has finally come for the Tōseiha to take control within the Imperial Army!"
 JAP_sea_state_general_mobilization_law:0 "The State General Mobilization Law"
 JAP_sea_state_general_mobilization_law_desc:0 "It has come to our attention that we need to put the national economy on war-time footing, so that we don't fall behind in the development of weapons. Through this new law, we can get government control over civilian organizations and labor unions, the nationalization of strategic industries, price controls and the ability to impose rationing where needed." 
 JAP_sea_state_general_mobilization_law_tt:0 "Unlocks the ability to go to §Y$closed_economy$§! despite being §YNon-Aligned§!"
 JAP_sea_sturdy_aircraft:0 "Sturdy Aircraft"
 JAP_sea_sturdy_aircraft_desc:0 "Agility and range are both essential, but are not the only factors for determining our success in the skies. Should our planes be thin as paper, we would lose before any war had even started. We must therefore invest in the development of stronger air-frames and thicker armor, so that we may dominate the skies for years to come."
 JAP_sea_sturdy_aircraft_tt:0 "Reduces the chance of targeted air attacks against certain characters"
 JAP_sea_the_showa_restoration_emperor_genka_desc:0 "At long last, the era of liberal Taishō Democracy is at an end. Once again, the nation will be led by a small group of qualified people backing up a strong Emperor. Only through this will our country finally be brought salvation."
 JAP_sea_the_showa_restoration_emperor_showa_desc:0 "At long last, the era of liberal Taishō Democracy is at an end. Once again, the nation will be led by a small group of qualified people backing up a strong Emperor. Only through this will our country finally be brought salvation."
 JAP_sea_the_showa_restoration_key_emperor_genka:0 "The Genka Restoration"
 JAP_sea_the_showa_restoration_key_emperor_showa:0 "The Showa Restoration"
 JAP_sea_tripartite_pact:0 "Propose the Tripartite Pact"
 JAP_sea_tripartite_pact_desc:0 "As our enemies coalesce against us, the task of defeating them becomes more of a challenge. We should reach out to other governments with similar goals, so that we may engage in some measure of cooperation."
 JAP_sea_unify_the_air_forces:0 "Unify the Air Forces"
 JAP_sea_unify_the_air_forces_desc:0 "For too long, have we been plagued by separate research and development of aviation between the army and the navy. We must unify these programs to ensure both uniformity of armament and better use of our limited research resources."
 JAP_sea_unify_the_air_forces_tt:0 "Unlocks the MIO trait §Y$JAP_mio_trait_unified_research_and_development$§! for all §YPlane Designers§!. §RIt can however only be applied to one of them§!."
 JAP_sea_unify_the_air_forces_2_tt:0 "Replace §Y$JAP_army_and_naval_air_services_dm$§! with §Y$JAP_japanese_airforce_dm$§!, effective change:"
 JAP_second_russo_japanese_war_fervor_idea:0 "Second Russo-Japanese War Fervor"
 JAP_secure_china_desc:0 "Chinese resistance is proving to be stubborn and unceasing. We must redouble our efforts to pacifying the mainland with all haste."
 JAP_securing_control_over_osaka_mission:0 "Army Securing Control over Osaka"
 JAP_securing_control_over_osaka_mission_tt:0 "§Y[531.GetName]§! will be secured by IJA loyalists and will be guaranteed to join them in the case of a §YCivil War§!"
 JAP_seek_strength_in_numbers:0 "Seek Strength in Numbers"
 JAP_seek_strength_in_numbers_desc:0 "One ship isn't enough to win an engagement. We need to diversify our fleets, and expand upon our numbers instead of simply focusing on quality. After all, quantity is a quality of its own."
 JAP_seek_strength_in_numbers_tt:0 "Unlocks the MIO trait §Y$JAP_mio_trait_strength_in_numbers$§! for all §YNaval Designers§!. §RIt can however only be applied to one of them§!."
 JAP_seek_yakuza_support_2_tt:0 "§G1§! §YGeneral§! will become loyal to us"
