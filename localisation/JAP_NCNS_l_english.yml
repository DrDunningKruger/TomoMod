 JAP_pacific_integrated_customs_union_member_tt:0 "§Y[JAP.GetNameDefCap]§! will be able to §RAttempt to Subjugate us Diplomatically!§!"
 JAP_pacific_trade_offshore_tt:0 "([ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!) Add §G1§! offmap §Y$industrial_complex$§!"
 JAP_pacifist_baron:0 "Influential Pacifist Baron"
 JAP_pan_asian_union_idea:0 "A Pan-Asian Union"
