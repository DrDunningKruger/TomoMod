 JAP_unlocks_pearl_harbor_raid:0 "Unlocks §YRaid§!:\nPearl Harbor Strike on §Y[USA.GetNameWithFlag]§!"
 JAP_unsinkable_aircraft_carriers:0 "The Unsinkable Aircraft Carriers"
 JAP_unsinkable_aircraft_carriers_desc:0 "The South Seas territories serve as perfect bases for the operation of our aircraft in the fight for the Pacific. We should reinforce these islands, and fortify these locations so that we can hold them, lest they 'sink' like regular carriers."
 JAP_upgrade_the_oriental_development_company:0 "Expand the Oriental Development Company"
 JAP_upgrade_the_oriental_development_company_desc:0 "The ODC currently has nine active branches, operating in nearly all of our overseas territories. They serve a crucial role in guiding the progress of the regions in a direction that pleases our ambitions, and steer the industrial and agricultural developments to aim for efficiency above all else. To improve our colonies, we must therefore look to expanding this company, and ensuring it has all the resources it needs."
