 SPR_class_war:0 "Class War"
 SPR_class_war_desc:0 "The concept of the Popular Front is flawed; the worker can never truly be free as long as they are forced to work together with the bourgeoisie. Only all-out uncompromising class war can bring us the freedom we desire, even if this means fighting the capitalists and the fascists at the same time."
