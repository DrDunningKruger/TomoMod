 JAP_women_in_industry_idea:0 "Women in Industry"
 JAP_women_in_industry_idea_desc:0 "With a woman as the standing leader for [JAP.GetNameDef], it sets a precedence that women should have the right to work in other industries as well. With this large addition to our workforce, we can expect great economic progress for our country."
