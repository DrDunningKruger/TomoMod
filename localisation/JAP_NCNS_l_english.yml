 JAP_greater_tohokai_rule_ADJ:0 "Japanese"
 JAP_guide_the_chinese_2_tt:0 "Every §YCommunist Chinese§! nation is invited to our faction. Current targets:"
 JAP_guide_the_zaibatsus:0 "Guide the Zaibatsus"
 JAP_guide_the_zaibatsus_desc:0 "The largest corporations of our nation have long had unprecedented political and economical power. With some finesse, we may be able to guide their efforts in our favour."
 JAP_guided_by_amaterasu_trait:0 "Guided by Amaterasu"
 JAP_hajime_kawakami:0 "Hajime Kawakami"
 JAP_hakamada_satomi:0 "Satomi Hakamada"
 JAP_harakiri_debate_has_taken_place_flag:0 "Tensions between the §YCivilian Government§! and the §YMilitary Factions§! have reached a breaking point, and the §YHarakiri Debate§! has taken place"
 JAP_harukichi_hyakutake:0 "Harukichi Hyakutake"
