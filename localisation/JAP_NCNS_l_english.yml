 JAP_government_supporter_desc:0 "§LWill join the Government in the case of a Civil War.§!"
 JAP_governor_general_of_korea:0 "Governor-General of Korea"
 JAP_greater_army_dominant_fascism:0 "Empire of Japan"
 JAP_greater_army_dominant_fascism_DEF:0 "the Empire of Japan"
 JAP_greater_army_dominant_fascism_ADJ:0 "Japanese"
 JAP_greater_east_asia_railroad:0 "The Greater East Asia Railroad"
 JAP_greater_east_asia_railroad_desc:0 "Our leading engineers have come up with an idea for a railroad linking Japan with mainland Asia and Europe, including a tunnel or bridge connecting our nation to our Korean possession. Having gotten the idea from the South Manchuria Railway, our bullet trains will travel from Tokyo to Rangoon, and onward to Tehran. May our empire last for an eternity!"
 JAP_greater_east_asia_railroad_tt:0 "Every state controlled by us or our allies with less than §Y2 Infrastructure§! will gain §G1§! §YInfrastructure§!"
 JAP_greater_east_asian_co_prosperity_sphere:0 "Greater East-Asian Co-Prosperity Sphere"
 JAP_greater_east_asian_federation_2_tt:0 "Unlocks decisions to integrate §YAsian§! states that are under our §YControl§!"
