 RULE_OPTION_COMMUNIST_JAP_AI:0 "The Red Sun Rises"
 RULE_OPTION_COMMUNIST_JAP_AI_DESC:0 "The Japanese AI will attempt to turn communist and support other communist regimes in Asia by going down the relevant path in the national focus tree."
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI:0 "The Labor-Farmer Faction Ascendant"
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI_DESC:0 "The Japanese AI will attempt to turn communist and install a Ronoha-led government, leading a crusade against imperialism in Asia by going down the relevant path in the national focus tree."
 RULE_OPTION_DEFAULT:0 "Default"
