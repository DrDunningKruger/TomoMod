 JAP_army_securing_navy_support_mission:0 "Army Securing Navy Support"
 JAP_army_securing_navy_support_mission_tt:0 "A larger portion of the §YImperial Navy§! will be swayed to the IJA's side in the case of a §YCivil War§!"
