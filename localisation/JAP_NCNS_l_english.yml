 JAP_nobusuke_kishi:0 "Nobusuke Kishi"
 JAP_okadas_military_purge_speech_tt:0 "§RThis will lead to an escalation of the conflict between the Government and the Military, which can only be resolved by repealing the Peace Preservation Law!§!"
