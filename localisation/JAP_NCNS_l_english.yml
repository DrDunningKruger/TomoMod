 JAP_manchuria_five_year_plan:0 "Manchuria Industrial Five Year Plan"
 JAP_manchuria_five_year_plan_desc:0 "While our islands are scarce in usable land, our mainland possessions are not. What we cannot build up ourselves, we can build up on the mainland, instead. We will begin a large-scale industrialization program for [MAN.GetNameDef]."
