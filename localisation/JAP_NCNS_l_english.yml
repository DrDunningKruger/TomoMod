 SWE_refuge_from_war:0 "Refuge from War"
 SWE_refuge_from_war_desc:0 "War inevitably leads to an exodus of those who fear for their lives under a new regime. Many of those on the run have skills that could benefit us. As such, we can surely find a mutually beneficial arrangement."
 SWE_refuge_from_war_tt:0 "Gains manpower for every country that is not currently communist, scaled as a proportion to that country's communist support. §YNordics§! and §Ymajors§! provide a bigger possible share of manpower, with §Yminors§! providing a smaller possible share, for a total possible manpower gain of: §G+80000§!\nTotal manpower gained based on current world situation: §G+[?SWE_refugee_from_war_total_manpower_gained]§!\nNation providing the least amount of manpower: §Y[?SWE_refugee_min_manpower_country.GetName]§!: §G+[?SWE_refugee_min_manpower_gained]§!\nNation providing the most amount of manpower: §Y[?SWE_refugee_max_manpower_country.GetName]§!: §G+[?SWE_refugee_max_manpower_gained]§!\nAverage manpower gained per country: §G+[?SWE_refugee_from_war_average_manpower_per_country]§!"
