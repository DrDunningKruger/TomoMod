 JAP_boeitai_idea:0 "Boeitai"
 JAP_buddhist_socialism_idea:0 "Buddhist Socialism"
 JAP_buddhist_socialist_trait:0 "Buddhist Socialist"
 JAP_build_diet_building_landmark_tt:0 "\nReplaces the §Y$landmark_tokyo_imperial_palace$§! with the §Y$landmark_national_diet$§!"
 JAP_build_hakko_ichiu_landmark_tt:0 "Creates the §Y$landmark_hakko_ichiu$§! in [1018.GetName]" 
 JAP_build_the_nishotaki_and_miyanaka_dams:0 "Build the Nishotaki and Miyanaka Dams"
 JAP_build_the_nishotaki_and_miyanaka_dams_desc:0 "The new factories and facilities in our nation require more electricity than we are currently capable of affordably producing. We must establish new hydroelectric dams, so that we can generate electricity without burning our precious coal stockpiles."
 JAP_build_up_korean_industries:0 "Build up Korean Industries"
 JAP_build_up_korean_industries_desc:0 "We should make concentrated efforts to build up the industrial base in the Korean peninsula, especially in the areas of heavy industry and munitions. After all, these will be invaluable in any upcoming wars with China or the westerners. This policy was initially proposed by Kazushige Ugaki, and we should continue down this path."
 JAP_can_no_longer_manually_promote_civ_government_tt:0 "We will no longer be able to §RManually Endorse§! the §YCivic Faction§!"
 JAP_can_no_longer_manually_promote_zaibatsus_tt:0 "We will no longer be able to §RManually Endorse§! the §YZaibatsu Faction§!"
 JAP_cannot_train_due_to_military_strike:0 "Cannot train new units while the §Y$JAP_military_strike_idea$§! is active"
 JAP_carrier_warfare_experiments:0 "Carrier Warfare Experiments"
 JAP_carrier_warfare_experiments_desc:0 "Battleships are the relics of a bygone age. We must look to the future, and the future is aviation. Aircraft carriers will allow us to project that air power across the Pacific."
 JAP_central_agricultural_association:0 "Central Agricultural Association"
 JAP_central_agricultural_association_desc:0 "Our many scattered agricultural organizations need to be consolidated into one if we wish to solve the bottlenecks in our supply chains. To ensure this is done, we should task Sengoku Kotaro to establish the Central Agricultural Association as outlined in the Agricultural Organizations Law."
 JAP_central_economic_council_idea:0 "Central Economic Council"
 JAP_chairman_title_text:0 "Chairman"
 JAP_chikuhei_nakajima:0 "Chikuhei Nakajima"
 JAP_chuuichi_nagumo:0 "Chūichi Nagumo"
 JAP_civilian_cabinet_modifier:0 "The Civilian Cabinet"
 JAP_civilian_government_faction_is_not_subdued_tt:0 "£imperial_influence_texticon NOT: $JAP_government_faction$ is $JAP_imperial_influence_tier_1$"
 JAP_civilian_government_is_at_least_influential_tt:0 "£imperial_influence_texticon $JAP_government_faction$ is at least $JAP_imperial_influence_tier_3$"
 JAP_cleaning_up_our_own_mess:0 "Finishing what we Started"
 JAP_coal_liquification:0 "Coal Liquification"
 JAP_coal_liquification_desc:0 "[JAP.GetNameDefCap] is lacking in oil, and so we must redouble our efforts in the field of synthetic oil."
 JAP_collapsing_government_idea:0 "Collapsing Cabinet"
 JAP_collect_civilian_donations_decision:0 "Collect Civilian Donations"
 JAP_colonial_independence_desc:0 "With the reconquest of former imperial possessions, it is high time we liberate their people and grant them the independence they deserve."
 JAP_combined_arms:0 "Combined Arms"
 JAP_combined_arms_desc:0 "Coordination between our air and land forces is the key to success. In order to provide better support and clear the battlefield of any obstacles our army may face, we should invest in combined arms tactics that allow our planes to work in tandem with our other branches."
 JAP_communist_party_modifier:0 "The Japanese Communist Party"
 JAP_conflict_between_faction_reaching_boiling_point_mission:0 "Faction Conflict Reaching a Breaking Point"
 JAP_conflict_between_faction_reaching_boiling_point_mission_desc:0 "The conflict between the Civilian Government and the Military is rapidly reaching a breaking point due to both fighting for power, which will likely spill over into a political incident that will dramatically shape the course our country takes in the future."
 JAP_construct_the_sui_ho_dam:0 "Build the Sui-ho Dam"
 JAP_construct_the_sui_ho_dam_desc:0 "In order to provide enough energy for our industries in the Manchurian Liaoning Province, we should construct the Suihō gravity dam. Our engineers have drawn up plans for what will be the largest in all of Asia, with plans for contracting the Yalu Hydroelectric Company and Pyeongbuk Railway company to achieve this."
 JAP_continue_takahashi_korekiyos_policies:0 "Continue Takahashi Korekiyo's Policies"
 JAP_continue_takahashi_korekiyos_policies_desc:0 "Viscount Takahashi Korekiyo saved our nation from the Great Depression, and ensured that the effects of it would no longer be felt in our economy. To achieve this however, he made budget cuts to the military's finances, something that has proven to be an unpopular move for many. We must follow in his footsteps!"
 JAP_convoy_production_cost_tt:0 "[JAPGetConvoyProductionCostBonusText]"
 JAP_cruiser_modernization:0 "Cruiser Modernization"
 JAP_cruiser_modernization_desc:0 "Cruisers will be the mainstay of our task forces throughout the Pacific, and so we need the best we can build."
 JAP_crumbling_military_cabinet_idea:0 "A Crumbling Cabinet"
 JAP_crumbling_military_cabinet_idea_2:0 "The Current Situation of the Empire"
 JAP_crumbling_military_cabinet_idea_5:0 "Ketsugo Sakusen"
 JAP_customs_union_trade_idea:0 "West Pacific Trade Agreement"
 JAP_dadaist_nihilist:0 "Dadaist Nihilist"
 JAP_danchi_idea:0 "Danchi"
 JAP_danganressha:0 "The Bullet Train Plan" # Danganressha
 JAP_danganressha_desc:0 "The Ministry of Railways has approved the so called Danganressha plan, in which broad gauge railways are to be laid next to the standard gauge ones, on which transport trains will be able to travel as fast as a bullet. The railway pioneer Yasujiro Shima and his son have promised to aid in the development of this plan."
 JAP_day_of_infamy:0 "A Day of Infamy"
 JAP_demand_tonkinese_bases:0 "Demand Tonkinese Bases"
 JAP_demand_tonkinese_bases_desc:0 "The region of Tonkin is not only rich in resources, but also a vital stepping stone for our further expansion southward. Being on the border with China, it may also serve as an important base of operations for our air force to strike into Canton."
 JAP_demand_tonkinese_bases_tt:0 "France owns §YTonkin§!"
 JAP_demand_tonkinese_bases_2_tt:0 "France doesn't own §YTonkin§!"
 JAP_democratic_party_long:0 "Rikken Seiyūkai"
 JAP_democratic_side_also_spawns_tt:0 "The §YDemocratic Government§! will also attempt to fight back against our Revolution!"
 JAP_democratic_socialist:0 "Democratic Socialist"
 JAP_develop_chinese_resources_desc:0 "We must develop the rich Chinese resources that have fallen into our hands so that they may be useful for the next war."
 JAP_develop_lethal_infantry_equipment:0 "Develop Lethal Infantry Equipment"
 JAP_develop_lethal_infantry_equipment_desc:0 "The army has made it clear to us how outdated the weapons currently in their possession are, and are requesting something be done about it. We should make large investments into developing more modern infantry equipment, so that we may never again lose a war."
 JAP_develop_lethal_infantry_equipment_tt:0 "If the $JAP_army_faction$ is at least $JAP_imperial_influence_tier_3$, also gain:\n"
 JAP_develop_sophisticated_artillery_equipment:0 "Develop Sophisticated Artillery Equipment"
 JAP_develop_sophisticated_artillery_equipment_desc:0 "The army has made it clear to us how outdated the weapons currently in their possession are, and are requesting something be done about it. We should make large investments into developing more modern artillery guns, so that we won't have to charge the enemy until they have practically already surrendered."
 JAP_develop_sufu_materials_decision:0 "Develop Sufu Materials"
 JAP_develop_the_south_seas_mandate:0 "Develop the South Seas Mandate"
 JAP_develop_the_south_seas_mandate_desc:0 "The Japanese Mandate for the Governance of the South Seas Islands, given to us by the League of Nations after the Great War is a vast and largely unexplored territory, ripe for exploitation. If we make sure to develop these regions and specialize them in providing our people with their riches, the Nan'yō Government that governs the region may even be able to sway the locals to properly integrate into our state."
 JAP_develop_the_yen_bloc:0 "Develop the Yen Block"
 JAP_develop_the_yen_bloc_desc:0 "We must put further emphasis on the economic aspects of the Greater East Asia Co-Prosperity Sphere. The economies of Asia must be integrated, and all should adopt the Yen as their currency. This can be achieved by continuing the development of the Japan–Manchukuo–China yen bloc whilst ultimately perfecting it."
 JAP_develop_the_yen_bloc_tt:0 "Unlocks decisions to §YIntegrate the Economies§! of our §YAsian Allies§!"
 JAP_dimantle_faction_tt:0 "§RWhen §Y$JAP_japanese_chinese_friendship$§! is removed the §Y$JAP_sino_japanese_pact$§! is dismantled§!"
 JAP_diplomatic_prime_minister:0 "Diplomatic Prime Minister"
 JAP_distribute_rations_decision:0 "Distribute Rations"
 JAP_distributing_rations:0 "Distributing Rations"
 JAP_divert_naval_guns_to_the_army:0 "Divert Naval Guns to the Army"
 JAP_divert_naval_guns_to_the_army_desc:0 "In order to allow the land forces to utilize heavy weaponry such as railway guns and tanks, we must divert parts of the naval gun production to the army."
 JAP_divert_naval_guns_to_the_army_tt:0 "Create §Y2 $railway_gun_equipment_1$§! units in [ROOT.capital.GetName]."
 JAP_do_not_align_me_flag:0 "Can not be aligned by any side of the Government-Army conflict"
 JAP_domestic_tank_modernization_program:0 "Domestic Tank Modernization Program"
 JAP_domestic_tank_modernization_program_desc:0 "We must learn from our mistakes, and ensure that our armor can survive anti-tank weaponry, else our forces will be doomed to failure. This should not be done by relying on the designs of the western powers, but on the ingenuity of the great [ROOT.GetAdjective] people."
 JAP_double_leaf_society_idea:0 "Fruits of the Double Leaf Society"
 JAP_draft_the_showa_constitution_desc_key_emperor_eian:0 "We accept and respect our nation's imperial history. However, authoritarianism has no place in the Japan we want to build. We will maintain the new Emperor as a figurehead leader, but we will limit his power in the constitution, much as is the case in many Western countries."
 JAP_draft_the_showa_constitution_desc_key_emperor_showa:0 "We accept and respect our nation's imperial history. However, authoritarianism has no place in the Japan we want to build. We will maintain the Emperor as a figurehead leader, but we will limit his power in the constitution, much as is the case in many Western countries."
 JAP_draft_the_showa_constitution_key_emperor_eian:0 "Draft the Eian Constitution" # Eian (永安)
 JAP_draft_the_showa_constitution_key_emperor_showa:0 "Draft the Showa Constitution"
 JAP_early_industrialization_efforts_dm:0 "Early Industrialization Efforts"
 JAP_early_industrialization_efforts_dm_desc:0 "Our Industrial Revolution only really got started in the 1870s during the Meiji Restoration, after the Iwakura Mission brought home the knowledge needed to get our industrialization projects off the ground. Ever since then, our economy has expanded greatly, and modern industries have been established. Despite this however, our economy is still far behind those in the western world, largely due to our lack of natural resources."
 JAP_east_asia_co_prosperity_sphere_dm:0 "Dai Tōa Kyōeiken"
 JAP_east_asia_development_board:0 "The East Asia Development Board"
 JAP_east_asia_development_board_desc:0 "Establishing the Kōain will help coordinate the government's China policy, designed to sponsor industrial and commercial development in China to boost support for Japanese rule in occupied territories. It can also be used as a tool for ensuring laborers for our mines and war industries."
 JAP_east_asia_development_board_tt:0 "Unlocks decisions to start §YIndustrial Projects§! in our allies"
 JAP_eastern_road_and_steel_expansion:0 "Eastern Road and Steel Expansion"
 JAP_eastern_road_and_steel_expansion_desc:0 "In order to facilitate the expansion of our mines and industries in Manchuria, we should found the Eastern Road Development Corporation. Once this has been accomplished, mining stations will be set up in Tiechangzi, Wudaojiang, and Shirengou, and iron ore mining offices will be set up in Dalizi and Qidaogou."
 JAP_educating_the_peasants_modifier:0 "Educating the Peasants"
 JAP_embodying_empress_jingu:0 "Embodying Empress Jingū"
 JAP_embodying_empress_jingu_and_zheng_yi_sao:0 "$JAP_embodying_empress_jingu$"
 JAP_emperor_hirohito:0 "$JAP_hirohito$"
 JAP_emperor_hirohito_has_abdicated_flag:0 "§YHirohito§! has abdicated the throne"
 JAP_emperor_hirohito_under_house_arrest_flag:0 "§YHirohito§! has been placed under §YHouse Arrest§!"
 JAP_emperor_nobuhito:0 "Nobuhito"
 JAP_emperor_title_text:0 "Emperor"
 JAP_emperor_yasuhito:0 "Yasuhito"
 JAP_empower_the_yi_dynasty_decision:0 "Empower the Yi Dynasty"
 JAP_empress_nagako:0 "Nagako"
 JAP_empress_title_text:0 "Empress"
 JAP_enact_religious_organizations_law:0 "Enact the Religious Organizations Law"
 JAP_enact_religious_organizations_law_desc:0 "In order to direct our people's attention toward the right things, and ensure their unwavering support for the pursuit of the [ROOT.GetAdjective] destiny, we must promulgate a law that would give the state authority control over all religious organizations within the nation."
 JAP_enact_the_national_conscription_law:0 "Enact the National Conscription Law"
 JAP_enact_the_national_conscription_law_desc:0 "It has been decreed, that every eligible [ROOT.GetAdjective] man be sought out and conscripted into the army. We should dispatch recruiters to even the most remote of villages, so that we can rapidly enlist more men."
 JAP_replace_the_power_of_the_colonials:0 "Replace the Power of the Colonials"
 JAP_replace_the_power_of_the_colonials_desc:0 "India, Australia and New Zealand have fallen, and with them the pillars of Western colonial rule in Asia and the Pacific. The remaining powers of the old order must now be driven from our sphere, and our armies will meet them as the masters of the East."
 JAP_replace_the_power_of_the_colonials_idea:0 "Replacing the Colonial Powers"
 JAP_replace_the_power_of_the_colonials_idea_desc:0 "With the colonial strongholds of India, Australia and New Zealand broken, our soldiers fight the remaining Western powers with the confidence of conquerors."
 JAP_enemy_of_our_enemy_opm:0 "The Enemy of our Enemy"
 JAP_establish_housing_corporation:0 "Establish Housing Corporation"
 JAP_establish_housing_corporation_desc:0 "In order to provide housing throughout the country to all those who need it, we must establish a corporation with the goal of building tens of thousands of housing units for laborers, and many rental properties for carpenters and citizens."
 JAP_establish_manchuria_airplane_manufacturing_company:0 "Establish Manchuria Airplane Company"
 JAP_establish_manchuria_airplane_manufacturing_company_desc:0 "In order to produce our equipment closer to where the resources for them are being extracted, the Nakajima Aircraft Company has offered to open a subsidiary under our supervision in Manchuria that they currently refer to as Manshū. We must support this brilliant idea."
 JAP_establish_showa_aircraft_idnsutry:0 "Establish Showa Aircraft Industry"
 JAP_establish_showa_aircraft_idnsutry_desc:0 "We have received a request for permission to establish the Shōwa Hikōki Kōgyō Kabushiki-gaisha in Akishima, Tokyo. This company wishes to build military aircraft to provide to our armed forces. We should approve their request, and have them get working on providing us with aviation equipment immediately."
 JAP_establish_the_japanese_korean_army:0 "Expand the Japanese Korean Army"
 JAP_establish_the_japanese_korean_army_desc:0 "Ever since 1904, the Chōsen-gun has operated as a garrison force in Korea, but hasn't seen much combat outside of the invasion of Manchuria in 1931. We should revoke the treaties that bind our Korean governorate in an effort to expand this army, so that it may be used as a proper fighting force."
 JAP_establish_the_provisional_government_of_free_india_decision:0 "Establish the Provisional Government of Free India"
 JAP_establish_the_second_philippine_republic_decision:0 "Establish the Second Philippine Republic"
 JAP_establish_the_state_of_burma_decision:0 "Establish the State of Burma"
 JAP_eth_is_invited_to_faction_tt:0 "§Y[ETH.GetNameDefCap]§! is invited to our faction"
 JAP_every_kodoha_member_tt:0 "Every §YKōdōha Sympathizer§!:"
 JAP_expand_hiratsuka_navy_arsenal_tt:0 "Has either left the §YLondon Naval Treaty§!, or an §YEscalator Clause has been Invoked§!"
 JAP_expand_japan_manchukuo_economic_bloc:0 "East-Asian Economic Bloc"
 JAP_expand_japan_manchukuo_economic_bloc_desc:0 "We should take the initiative to build an economic bloc between us and our imperial subjects, in order to bolster our economies and secure sufficient strategic materials, such as iron, coal, cotton, and salt."
 JAP_expand_kawagoe_army_arsenal:0 "Expand Kawagoe Army Arsenal"
 JAP_expand_kawagoe_army_arsenal_desc:0 "Our arms industry is currently struggling to keep up with the production demands to ensure our army is capable of combat on a modern battlefield. We should expand the Kawagoe army arsenal in Saitama in order to improve our chances of matching supply with the demand."
 JAP_expand_navy_technical_department:0 "Expand the Navy's Technical Department"
 JAP_expand_navy_technical_department_desc:0 "We must issue new estimates for the size of the increase to our navy, and, thereby, the dockyard facilities that will be required to bring about this increase. The first step to bringing our facilities in line with modern requirements will be to expand the navy's technical department."
 JAP_expand_the_irago_proving_ground:0 "Expand the Irago Proving Ground"
 JAP_expand_the_irago_proving_ground_desc:0 "In order to better dominate the battlefield, we should expand the Irago proving ground where we test new and experimental weapons. There, we may be able to develop tools of warfare that will bring all of our enemies to heel."
 JAP_expand_the_metropolitan_police_2_tt:0 "The democratic government will gain an additional §G8§! §YPolice Divisions§! when the §YCivil War§! occurs"
 JAP_expand_the_showa_research_association:0 "Expand the Showa Research Association"
 JAP_expand_the_showa_research_association_desc:0 "The Shōwa Kenkyūkai, a political think tank established to generate innovative ideas for political reform by reviewing and assessing issues with the Meiji Constitution, has been expanding its zones of interest and forming new subgroups. We should encourage this, so that they may develop new technologies and ways of dominating Asia."
 JAP_expand_the_snlf:0 "Expand the SNLF"
 JAP_expand_the_snlf_desc:0 "A war in the pacific will involve naval landings to a large degree. The Special naval Landing Forces require expansion if they are to be up to the task. "
 JAP_expel_the_barbarians:0 "Expel the Barbarians"
 JAP_expert_propaganda_artist:0 "Knowledgeable Propaganda Artist"
 JAP_fascism_party_kodoha:0 "Kōdōha"
 JAP_fascism_party_kodoha_long:0 "Imperial Way Faction"
 JAP_fascist_poet:0 "Fascist Poet"
 JAP_female_leader_2_text:0 "hers"
 JAP_female_leader_3_text:0 "her"
 JAP_female_leader_text:0 "she" # These pronouns are intentionally lowercase
 JAP_fifth_international_agitation:0 "Fifth International Agitation"
 JAP_fighter_modernization:0 "Fighter Modernization"
 JAP_fighter_modernization_desc:0 "We must maintain superiority over our enemies in all areas, including air warfare. Modernized fighter planes are essential to achieve this."
 JAP_financial_genius:0 "Financial Genius"
 JAP_first_air_fleet:0 "First Air Fleet"
 JAP_first_air_fleet_desc:0 "To maximize offensive striking power we will combine the largest concentration of aircraft carriers the world has ever seen into one battlegroup. By developing the doctrines required to enable concerted offensive operations in this form, our enemies will stand no chance against our superiority in naval aviation."
 JAP_first_secretary_of_the_jcp_trait:0 "First Secretary of the Japanese Communist Party"
 JAP_first_strike_blocked_due_to_kwantung_army_tt:0 "Due to the Kwantung Army's §RUnplanned Offensive§!, we will not gain the §Y$JAP_first_strike_principle_dm$§! bonus"
 JAP_first_strike_principle_1:0 "$GetFirstStrikeString$ [?JAP.JAP_first_strike_principle_target_1.GetNameDef] §Wfor [?JAP_first_strike_principle_remaining_days_1:days_left|Y0] days§!"
 JAP_first_strike_principle_2:0 "$GetFirstStrikeString$ [?JAP.JAP_first_strike_principle_target_2.GetNameDef]  §Wfor [?JAP_first_strike_principle_remaining_days_2:days_left|Y0] days§!"
 JAP_first_strike_principle_3:0 "$GetFirstStrikeString$ [?JAP.JAP_first_strike_principle_target_3.GetNameDef]  §Wfor [?JAP_first_strike_principle_remaining_days_3:days_left|Y0] days§!"
 JAP_first_strike_principle_tt:0 "When §Y[ROOT.GetNameDef]§! §Rdeclares war§! on a §Yneighboring country§!, or a neighboring country of a subject, gain for §Y90 days§!:\n §Y$JAP_first_strike_principle_dm$§!\n $MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!\n  $MODIFIER_BREAKTHROUGH_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!"
 JAP_focus_on_aircraft_carriers:0 "Focus on Aircraft Carriers" 
 JAP_focus_on_aircraft_carriers_desc:0 "Battleships are the relics of a bygone age. We must look to the future, and the future is aviation. Aircraft carriers will allow us to project that air power across the Pacific."
 JAP_foreign_tank_modernization_cooperation:0 "Foreign Tank Modernization Initiative"
 JAP_foreign_tank_modernization_cooperation_desc:0 "In order to beat the west, we must first study their designs, and through that learn how to overcome them. We should seek friendship with one of the western powers, so that we may eventually be able to produce tanks that even they will marvel at."
 JAP_form_a_labor_patriot_corps_decision:0 "Form a Labor Patriot Corps"
 JAP_form_the_central_economic_council:0 "Form the Central Economic Council"
 JAP_form_the_central_economic_council_desc:0 "To solve the economic downturn our country faces from political instability and war, we should establish a special advisory body to the Prime Minister with the goal to investigate and deliberate economic policies between the home and overseas territories and basic plans for their implementation."
 JAP_form_the_dai_nippon_fujinkai:0 "Form the Dai Nippon Fujinkai"
 JAP_form_the_dai_nippon_fujinkai_desc:0 "Yamauchi Sachiko has volunteered to establish the Great Japan Women's Association, a proposed merger of three other nationalistic Women's Associations, with the proposed goal of mobilizing women in war work; to strengthen the morale of the military, to maintain a frugal lifestyle in order to save the nation's resources, to raise the production levels and to support the military."
 JAP_form_the_great_japan_industrial_patriotic_association:0 "Great Japan Industrial Patriotic Association"
 JAP_form_the_great_japan_industrial_patriotic_association_desc:0 "The industrialists and trade unions in our nation are split and inefficient, which hinders our economic development. We must unite all of these under one umbrella organization, so that our industries can be run as efficiently as possible, and lead to further expansion."
 JAP_form_the_kido_butai:0 "Form the Kido Butai" # Form the Kidō Butai
 JAP_form_the_kido_butai_desc:0 "To maximize offensive striking power we will combine the largest concentration of aircraft carriers the world has ever seen into one battlegroup. By developing the doctrines required to enable concerted offensive operations in this form, our enemies will stand no chance against our superiority in naval aviation."
 JAP_form_the_kido_butai_tt:0 "The success chance for the Pearl Harbor §YRaid§! on §Y[USA.GetNameWithFlag]§! will increase"
 JAP_form_the_yokusan_sonendan:0 "Form the Yokusan Sonendan"
 JAP_form_the_yokusan_sonendan_desc:0 "In order to protect the sovereignty of our nation, we need more people who are not only willing to fight for us, but also take part in the home guard to assist in matters of civil defense under the direction of official local authorities. To that end, we should form an elite paramilitary youth branch of the Imperial Rule Assistance Association, the 'Yokusan Sonendan'."
 JAP_formalize_the_tonarigumi:0 "Formalize the Tonarigumi"
 JAP_formalize_the_tonarigumi_desc:0 "The Neighborhood Associations have existed informally for quite some time, aiding in allocating rationed goods, distributing government bonds, fire fighting, public health, civil defense, distributing spiritual mobilization propaganda, informing the Tokkō of political dissidence and watched coasts for suspicious activity. We should formalize them, so that we can allocate more funds towards these groups."
 JAP_formalize_the_tonarigumi_tt:0 "Unlocks decisions to §YOrganize Tonarigumi§! in our subjects"
 JAP_found_the_air_defense_surveilance_corps:0 "Found the Air Defense Surveillance Corps"
 JAP_found_the_air_defense_surveilance_corps_desc:0 "In order to ensure early detection of enemy aircraft attacks, we must mobilize our civilians to serve at air defense observation posts set up all over the country, and to detect enemy aircraft at an early stage and report them to the relevant authorities. This will be organized by enacting the Air Defense Law."
 JAP_found_the_boeitai:0 "Found the Boeitai"
 JAP_found_the_boeitai_desc:0 "With a defensive war on our own lands becoming ever more realistic, we must establish some sort of Defense Corps that can be rapidly mobilized to defend our Home Islands in the case of an enemy incursion. This will also include individuals who would not normally be liable for military service under the Japanese conscription system."
 JAP_found_the_boeitai_tt:0 "Unlocks the ability to recruit §YVolunteer Fighting Corps Militias§! in the Home Islands"
 JAP_free_asia_pacific_idea:0 "A Free Asia-Pacific"
 JAP_fukumoto_kazuo:0 "Kazuo Fukumoto"
 JAP_fumimaro_konoe:0 "Fumimaro Konoe"
 JAP_fund_propaganda_films:0 "Fund Propaganda Films"
 JAP_fund_propaganda_films_desc:0 "Our navy has proposed greater investments into the film industry, in order to motivate our people to continue fighting. As such they have contracted the Moving Picture Laboratory to produce an animated propaganda movie that strengthens the narrative of the IJN, while throwing the IJA under the bus in the process."
 JAP_fund_propaganda_films_tt:0 "Refreshes the §Y[ROOT.GetImportOrDomesticFilmIndustry]§! Decision"
 JAP_fund_propaganda_films_2_tt:0 "§Y[ROOT.GetImportOrDomesticFilmIndustry]§! can be taken an extra time"
 JAP_fund_the_riken_institute:0 "Fund the RIKEN Institute"
 JAP_fund_the_riken_institute_desc:0 "Founded in 1917 during the Taishō era, the Institute of Physical and Chemical Research is currently controlled by the Riken Concern, a zaibatsu which currently controls about 121 factories and 63 companies. Under Viscount Masatoshi Ōkōchi, we should endeavor to expand the institute further, so that we can conduct our atomic research program there."
 JAP_fund_the_riken_institute_tt:0 "If the $JAP_zaibatsu_faction$ is at least $JAP_imperial_influence_tier_3$, also gain §G1§! §YNuclear Research Facility§!"
 JAP_fushimi_hiroyasu:0 "$fushimi_hiroyasu$"
 JAP_futurist_samurai:0 "The Futurist Samurai"
 JAP_gain_national_defense_state_remove_total_mob_tt:0 "§RRemove§! §Y$tot_economic_mobilisation$§!. Gain §Y$national_defense_state$§!."
 JAP_genki_abe:0 "Genki Abe"
 JAP_genro:0 "The Last Genrō"
 JAP_german_tech_exchange:0 "German Technological Exchange"
 JAP_german_tech_exchange_desc:0 "Further German technological advances would be extremely useful for our war effort. We must see to obtaining these schematics, no matter the cost."
 JAP_giro_senoo:0 "Girō Seno'o"
 JAP_god_of_constitutional_politics:0 "God of Constitutional Politics"
 JAP_godfather_of_the_yamaguchi_gumi:0 "Godfather of the Yamaguchi-Gumi"
