 JAP_nakajima_president:0 "Nakajima President"
 JAP_nanshin_ron:0 "Nanshin-ron"
 JAP_nanshin_ron_desc:0 "Though rich, China and Siberia do not possess all the resources we require. Not far away to the south, though, lie the Philippines, the Dutch East Indies and the British colonies of Malaya and Borneo. For true self-sufficiency we must wrest control over these areas away from the European imperialists."
 JAP_nanshin_ron_started_flag:0 "Has completed focus §Y$JAP_nanshin_ron$§!"
 JAP_naruhiko_higashikuni:0 "Naruhiko Higashikuni"
 JAP_nashimoto_morimasa:0 "Prince Morimasa Nashimoto"
 JAP_national_army_dm:0 "National Army"
 JAP_national_army_dm_desc:0 "The NJLF is our principal ground force, having played a central role in our rapid modernization during the Meiji era, and having fought in numerous conflicts including the Japan–Qing War, the Russo-Japanese War as well as the Great War. Initially formed from domain armies after the Meiji Restoration, it evolved into a powerful modern military influenced by French and German models."
 JAP_national_defense_brotherhood:0 "The National Defense Brotherhood"
 JAP_national_defense_brotherhood_desc:0 "In order to fund our war effort, Nobusuke Kishi and Hideki Tōjō have conceived a plan for the Gokoku Doshikai, a political organization to better coordinate the nation's financial strategies and industrial initiatives. This pairing is quite controversial however, and many issues may lie in the cards for the National Defense Brotherhood."
 JAP_national_defense_brotherhood_idea:0 "The National Defense Brotherhood"
 JAP_nationalize_fujinagata_shipyards:0 "Nationalize Fujinagata Shipyards"
 JAP_nationalize_fujinagata_shipyards_desc:0 "The Fujinagata Shipyards are an important shipyard and railroad car manufacturer in Osaka, being of strategic importance to our war effort. In order to expand the facilities and conscript more workforce for them, we should endeavor to nationalize these shipyards."
 JAP_nationalize_suzuka_naval_arsenal:0 "Nationalize Suzuka Naval Arsenal"
 JAP_nationalize_suzuka_naval_arsenal_desc:0 "The Suzuka Naval Arsenal is a production facility for aviation ordnance, light arms, and munitions for the navy. We should nationalize this facility, so that we can control the expansion of it, and establish new naval repair yards at the site."
 JAP_nationalize_war_industry:0 "Nationalize War Industry"
 JAP_nationalize_war_industry_desc:0 "Increasing state control over our war industry will go a long way to improving efficiency and, therefore, output."
 JAP_naval_armaments_program:0 "Naval Armaments Program"
 JAP_naval_armaments_program_desc:0 "In order for our shipyards and industries to keep up with our ever growing ambitions, our navy has drafted new expansion plans as part of the Rapid Naval Armaments Supplement Programme. This includes new warships, and has the goal to extend the navy to at least 293 maritime vessels."
 JAP_naval_armaments_program_tt:0 "With §Y$JAP_focus_on_aircraft_carriers$§! completed: Create Carrier §Yvariant§! and §Y4 production lines§! of the §YShokaku Class§!\nWith §Y$JAP_balanced_naval_approach$§! completed: Create Carrier and Super Battleship §Yvariants§! and §Y2 production lines§! of both the §YShokaku Class§! and the §YYamato Class§!\nWith §Y$JAP_sea_battleship_initiative$§! completed: Create Super Battleship §Yvariant§! and §Y4 production lines§! of the §YYamato Class§!\n"
