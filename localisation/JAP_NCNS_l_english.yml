 JAP_militarism:0 "Militarism"
 JAP_militarism_desc:0 "Militarism dominates the political and social life of the nation, and the belief that the strength of the military is equal to the strength of a nation is prominent. Beginning with the introduction of conscription during the Meiji Restoration, it has now become a core tenet in our national beliefs."
 JAP_militarist:0 "Militarist"
 JAP_military_coalition_party:0 "Renritsu Seiken"
 JAP_military_coalition_party_long:0 "Nippon-gun Renritsu Seiken"
