 JAP_yamamotos_premiership:0 "Yamamoto's Premiership"
 JAP_yamamotos_premiership_desc:0 "With the situation being as it currently is, it will prove vital to select a Prime Minister who can rally the IJN behind him, and lead as a martial leader as well as a civilian one. As such, admiral Isoroku Yamamoto will be chosen to lead the nation to glory."
