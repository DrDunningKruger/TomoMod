 JAP_konoes_first_cabinet:0 "Konoe's First Cabinet"
 JAP_konoes_first_cabinet_desc:0 "Senjūrō Hayashi is only intended as a short-term interregnum prime minister. Prince Fumimaro Konoe, apolitical and educated by the Genrō Saionji Kinmochi, he is the perfect candidate for stabilizing the chaotic political situation and uniting the nation in spirit. It is time that he formed a cabinet of his own, being personally nominated to Emperor Hirohito by Saionji himself."
