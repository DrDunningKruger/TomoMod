 JAP_new_industrial_city_development_policy:0 "New Industrial City Development Policy"
 JAP_new_industrial_city_development_policy_desc:0 "The national land planning committee has developed a plan for establishing new cities centered around military supply facilities for the army and navy, munitions factories and related facilities developed, and large-scale urban planning to support these industries. We should invest in this initiative."
 JAP_new_naval_estimates:0 "New Naval Estimates"
 JAP_new_naval_estimates_desc:0 "We must issue new estimates for the size of the increase to our navy, and, thereby, the dockyard facilities that will be required to bring about this increase."
 JAP_new_order_in_east_asia:0 "The New Order in East Asia"
 JAP_new_order_in_east_asia_desc:0 "In recent statements by [ROOT.GetLeader], it has become ever more clear that he intends to establish a new order in East Asia, one which has six main goals. They include permanent stability of Eastern Asia, neighborly amity and international justice, joint defense against communism, the creation of a new culture, economic cohesion and co-operation and finally world peace."
 JAP_new_order_in_east_asia_tt:0 "Taking the focus $JAP_sea_greater_east_asian_co_properity_sphere$ will transform this faction"
 JAP_new_order_in_east_asia_idea:0 "The New Order in East Asia"
 JAP_new_order_movement:0 "New Order Movement"
 JAP_new_order_movement_desc:0 "We must form a national organization in domestic affairs modeled after the one party states in the west, in order to mobilize the nation for war with the Colonialist Powers and prevent communism by rejecting the modern capitalist path that began with the Meiji Restoration. This issue is now more pressing than ever, as if we do not follow through soon, we may miss the bus."
 JAP_nichiren_abbot:0 "Nichiren Abbot"
 JAP_nichiren_marxist_trait:0 "Nichiren Marxist"
 JAP_nishizo_tsukahara:0 "$nishizo_tsukahara$"
