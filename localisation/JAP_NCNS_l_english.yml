 JAP_adopt_new_assault_doctrine:0 "Adopt New Assault Doctrine"
 JAP_adopt_new_assault_doctrine_desc:0 "General Shunroku Hata has proposed a new way to decisively defeat the enemy in battle. By employing large amounts of artillery, we should be able to shell the enemy into submission, and will then only have to charge the demoralized and shattered remnants to seal the deal."
 JAP_advance_one_hundred_million_fireballs:0 "Advance, One Hundred Million Fireballs"
 JAP_advance_one_hundred_million_fireballs_desc:0 "The Imperial Rule Assistance Association has come up with the slogan 'Advance, One Hundred Million Fireballs', which will be used to express the people's anger towards the west and growing fighting spirit. Must sacrifices be made to take down our enemies, then our population will be sure to lay down their lives for the Empire!"
 JAP_advance_one_hundred_million_fireballs_tt:0 "This spirit will be removed if we drop below §Y40%§! Stability"
 JAP_advance_one_hundred_million_fireballs_idea:0 "Advance, One Hundred Million Fireballs!"
 JAP_advanced_weapon_projects_dm:0 "Advanced Weapon Projects"
 JAP_agility_focus:0 "Agility Focus"
 JAP_agility_focus_desc:0 "Range alone will do us no good if our models cannot compete with the enemy when they arrive. We must produce craft with superior agility, so they may never be outmaneuvered."
 JAP_agricultural_protectionism_idea:0 "Agricultural Protectionism"
 JAP_aichi_organization:0 "$aichi$"
 JAP_aid_ETH:0 "Aid for Ethiopia"
 JAP_ainu_revoluton_theory_implemented_dm:0 "Ainu Revolution Theory Implemented"
 JAP_air_defence_surveilance_corps_idea:0 "Air Defense Surveillance Corps"
 JAP_aizawa_trial_ongoing:0 "Saburō Aizawa's Trial Ongoing"
 JAP_aizawa_trial_ongoing_desc:0 "Lieutenant Colonel Saburō Aizawa is currently under house arrest whilst his trial is still ongoing over his murder of the military officer Tetsuzan Nagata. However, with the trial becoming a media sensation with the judges colluding with his faction and turning the trial into a soapbox from which their ideology could be broadcast, it is clear that he will receive no tangible sentence. As a core member of the Kōdōha, if the group is to make a move, they will not do so until Aizawa's house arrest is over."
 JAP_aizawa_trial_ongoing_tt:0 "The outcome of the Incident will decide which political path we will be able to take"
 JAP_aizawas_trial_over_flag:0 "Saburō Aizawa's trial has concluded, and the §YFebruary 26 Incident§! has taken place"
 JAP_akira_kurosawa:0 "Akira Kurosawa"
 JAP_akira_muto:0 "Akira Mutō"
 JAP_allied_civilian_administration_integration_tt:0 "Unlocks Decisions to: §YIntegrate our Subjects' Civilian Administrations§!, allowing for us to §YAnnex§! our §YPuppets§!"
 JAP_amakudari_idea:0 "Amakudari"
 JAP_amaterasus_weapons_idea:0 "The Weapons of Amaterasu's Aramitama"
 JAP_an_integrated_union_2_tt:0 "Unlocks decision to invite allies to have their §YEconomies Become Increasingly Integrated§! with ours, allowing for us to §YAttempt to Subjugate them Diplomatically§! afterwards"
 JAP_anarcha_feminist:0 "Anarcha Feminist"
 JAP_anti_breakway_navy_maneuvers_idea:0 "Offensive Naval Maneuvers"
 JAP_anti_communist_crackdowns_idea:0 "Anti-Communist Crackdowns"
 JAP_anti_communist_pm:0 "Anti-Communist Prime Minister"
 JAP_anti_kwantung_army_maneuvers_idea:0 "Anti-Kwantung Army Military Maneuvers"
 JAP_approach_mitsubishi:0 "Approach Mitsubishi"
 JAP_approach_mitsubishi_desc:0 "The Mitsubishi company was initially established as a shipping firm in the early Meiji era. Having expanded to most industrial sectors, they today control large parts of all military industries within our country. We must ensure their support for our government, so that we can most effectively utilize their facilities."
 JAP_approach_mitsui:0 "Approach Mitsui"
 JAP_approach_mitsui_desc:0 "The Mitsui zaibatsu traces its origins back to the Edo period, nowadays being one of the largest industrial corporations within our country. We must ensure their support for our government, so that we can most effectively utilize their services."
 JAP_approach_sumitomo:0 "Approach Sumitomo"
 JAP_approach_sumitomo_desc:0 "The Sumitomo zaibatsu traces its roots to a bookshop in Kyoto, though copper refining made the company famous. Today they specialize in mineral extraction, as well as banking. We must ensure their support for our government, so that we can most effectively utilize their assets."
 JAP_approach_the_young_officers_tt:0 "Gains §G3§! communist generals.\n"
 JAP_approach_yasuda:0 "Approach Yasuda"
 JAP_approach_yasuda_desc:0 "Yasuda zaibatsu traces its origins to the Meiji era, and has been doing banking ever since it was first founded. Being the body of the Yasuda bank, they are now intrinsically linked with all financial sectors within our nation. We must ensure their support for our government, so that we can most effectively utilize their vast wealth."
 JAP_armored_divisions:0 "Armored Divisions"
 JAP_armored_divisions_desc:0 "Other nations have already learned of the power of the armored division. We must not fall behind, and develop more advanced and more powerful armor models, allowing us to strike at the enemy both hard and fast."
 JAP_army_and_naval_air_services_dm:0 "Army and Naval Air Services"
 JAP_army_and_naval_air_services_dm_desc:0 "Our air force is currently divided between the Imperial Japanese Army Air Service and the Imperial Japanese Navy Air Service, being divided both in operation, production as well as research and development between our navy and army. Due to this it faces large logistical bottlenecks, some of which can only be overcome by the merging of our air forces."
 JAP_army_arsenals_emptied_idea:0 "Army Arsenals Emptied"
 JAP_army_broadcasting_militarist_propaganda_2_mission:0 "Army Broadcasting Anti-Government Propaganda"
 JAP_army_broadcasting_militarist_propaganda_mission:0 "Army Broadcasting Militarist Propaganda"
