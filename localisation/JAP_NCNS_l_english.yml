 JAP_hitoshi_imamura:0 "$hitoshi_imamura$"
 JAP_hitoshi_yamakawa:0 "Hitoshi Yamakawa"
 JAP_hokushin_ron:0 "Hokushin-ron"
 JAP_hokushin_ron_desc:0 "The faction within our army that refers to themselves as the Strike North Group advocate expansion into Siberia and Mongolia as a means of gaining the natural resources and economical value we require to continue our imperial ambitions. We should support this notion, and begin preparing our forces to undertake such a doctrine should the time prove right."
 JAP_hokushin_ron_started_flag:0 "Has completed focus §Y$JAP_hokushin_ron$§!"
 JAP_hold_speech_in_the_imperial_diet_decision:0 "Hold a Speech in the Imperial Diet"
 JAP_hotsumi_ozaki:0 "Hotsumi Ozaki"
 JAP_hydroelectric_dams_in_korea:0 "Hydroelectric Dams"
 JAP_hydroelectric_dams_in_korea_desc:0 "The industrialization and electrification of Korea will come to an abrupt halt unless we intervene and do something about the situation. We should construct new gravity dams across the region, and our engineers at the Han River Hydroelectric Company have already drawn up intricate plans for the construction of a dam they dub the Hwacheon Dam."
 JAP_ichikawa_fusae:0 "Fusae Ichikawa"
 JAP_ichioku_isshin:0 "Ichioku Isshin"
 JAP_ichioku_isshin_desc:0 "As one of the slogans of the Taisei Yokusankai goes, the [ROOT.GetAdjective] people are truly 'One Hundred Million, One Heart'. Though our people are all individual subjects to the Emperor, they all stand together as one single entity, with their hearts and minds being as one."
 JAP_ichiro_hatoyama:0 "Ichirō Hatoyama"
 JAP_if_man_accepts:0 "If §HManchukuo§! accepts the following will happen:\n"
 JAP_ignatius_timothy_trebitsch_lincoln:0 "Ignatius Timothy Trebitsch Lincoln" 
 JAP_imperial_army_dm:0 "Imperial Army"
 JAP_imperial_army_dm_desc:0 "The IJA is our principal ground force, having played a central role in our rapid modernization during the Meiji era, and having fought in numerous conflicts including the Japan–Qing War, the Russo-Japanese War as well as the Great War. Initially formed from domain armies after the Meiji Restoration, it evolved into a powerful modern military influenced by French and German models."
 JAP_imperial_headquarters_liasion_conference:0 "Imperial Liaison Conference"
 JAP_imperial_headquarters_liasion_conference_desc:0 "With the reestablishment of the Imperial General Headquarters for the first time since the Russo-Japanese War, it is high time we hold a conference between the leaders of the various factions to promote cooperation and exchanging of information between the military and the government."
 JAP_imperial_influence_decision_cat:0 "Internal Faction Demands"
 JAP_imperial_influence_decision_cat_desc:0 "The Internal Factions within our country hold a lot of autonomy, and will not sit idly by while they are being ignored by [ROOT.GetLeader]. As such they will keep making extensive demands of our government so long as they have not been largely curtailed."
 JAP_imperial_influence_dm:0 "Imperial Influence"
 JAP_imperial_influence_dm_desc:0 "The various factions within the nation are all vying for power and influence over the [GetImperialInfluenceRulerTitle], a tradition dating back to the oligarchs and military cliques founded during the Meiji and Taisho eras."
 JAP_imperial_influence_dm_tt:0 "Current Faction Levels: \n[GetArmyFactionDesc] \n[GetNavalFactionDesc] \n[GetZaibatsuFactionDesc] \n[GetGovernmentFactionDesc]"
 JAP_imperial_influence_factions_names_text_communist:0 "Internal Faction"
 JAP_imperial_influence_factions_names_text_monarchist:0 "Imperial Faction"
 JAP_imperial_influence_interference_reset_days_tt:0 "Days until $JAP_imperial_influence_ruler_name_text$ can interfere with $JAP_imperial_influence_faction_names_text$ again: [?JAP_interfered_in_imperial_influence_flag:days_left|Y0]"
 JAP_imperial_influence_tier_1:0 "§RSubdued§!"
 JAP_imperial_influence_tier_2:0 "§RMeddling§!"
 JAP_imperial_influence_tier_3:0 "§RInfluential§!"
 JAP_imperial_influence_tier_4:0 "§RDominating§!"
 JAP_imperial_influence_title_text_communist:0 "NATIONAL INFLUENCE"
 JAP_imperial_influence_title_text_monarchist:0 "IMPERIAL INFLUENCE"
 JAP_imperial_navy_dm:0 "Imperial Navy"
 JAP_imperial_navy_dm_desc:0 "The IJN was formed in 1868 at the beginning of the Meiji Restoration, and was already by 1920 the third largest navy in the world. Now, our mighty navy is being rapidly expanded, in order for our nation to be able to face the times ahead."
 JAP_imperial_rule_assistance_association:0 "The Imperial Rule Assistance Association"
 JAP_imperial_rule_assistance_association_desc:0 "Due to the threats both internal and abroad, and the division within the civilian government, we must establish the Taisei Yokusankai to usher in a statist, para-fascist political system with the aim of removing sectionalism and factionalism from politics and economics, creating a totalitarian one-party state in order to maximize the efficiency of our total war doctrine."
 JAP_implementing_unos_economic_reforms_mission:0 "Implementing Kōzō Uno's Economic Reforms"
 JAP_improve_agricultural_output:0 "Improve Agricultural Output"
 JAP_improve_agricultural_output_desc:0 "The industrial production in Taiwan is set to exceed the agricultural production on the island. Though this benefits our industries, it is far from ideal, seeing as the agricultural exports from Taiwan are of great importance for keeping our people happy and supplying our military. We must remedy this at once!"
 JAP_improve_the_type_91_aerial_torpedo:0 "Improve the Type 91 Aerial Torpedo"
 JAP_improve_the_type_91_aerial_torpedo_desc:0 "We should seek to develop torpedoes specialized in hitting ships in shallow waters, to improve our port-striking capabilities. These aerial torpedoes will be inspired by our most advanced torpedo, the Long Lance, and will bring us the fruits of victory faster than we may have ever dreamed of."
 JAP_improved_radio_communications:0 "Improve Radio Communications"
 JAP_improved_radio_communications_desc:0 "Our radios are currently in a terrible shape, and as a result our formations often break up due to bad communications and lack of signal in deep jungles and on remote islands. We must modernize our equipment and construct new radio towers so that this won't keep happening."
 JAP_in_the_footsteps_of_jimmu:0 "In the Footsteps of Jimmu"
 JAP_increase_agricultural_export:0 "Increase Agricultural Export"
 JAP_increase_agricultural_export_desc:0 "Ever since our acquisition of the territory, Korea has functioned as a breadbasket for our empire. We should increase our efforts for expanding this field, so that their food can be exported all across the realm."
 JAP_increase_armament_spending:0 "Increase Armament Spending"
 JAP_increase_armament_spending_desc:0 "Viscount Takahashi Korekiyo may have done much for our economy, but he has left us ill-prepared for the wars to come. We must remedy this fact, and reinvest into our growing military industries."
 JAP_increase_crop_yields:0 "Increase Crop Yields"
 JAP_increase_crop_yields_desc:0 "The South Seas islands have a large amount of coconut, a lucrative potential cash crop. We should encourage monopolies that pair private initiative with government capital. By also contracting the Nan'yō Kōhatsu, sugar plantations, sugar mills, bananas, pineapples, taro, manioc, coffee and other tropical farming products can be grown, putting the islands on a par with Taiwan in terms of production."
 JAP_increase_jotaro_watanabe_security_decision:0 "Increase Security Around Jōtarō Watanabe"
 JAP_increase_jotaro_watanabe_security_decision_tt:0 "Security around Jōtarō Watanabe will be increased in order to protect him in case of any attacks by army radicals, but as a result they may re-prioritize their list of targets and put more forces towards taking out someone else"
 JAP_increase_takahashi_korekiyo_security_decision:0 "Increase Security Around $JAP_takahashi_korekiyo$"
 JAP_increase_takahashi_korekiyo_security_decision_tt:0 "Security around Takahashi Korekiyo will be increased in order to protect him in case of any attacks by army radicals, but as a result they may re-prioritize their list of targets and put more forces towards taking out someone else"
 JAP_increased_national_security_no_lar:0 "Increased National Security"
 JAP_industrial_development_support:0 "Japanese Industrial Support"
 JAP_industrial_meritocracy_idea:0 "Industrial Meritocracy"
 JAP_influx_of_socialist_industrial_expertise_idea:0 "Influx of Socialist Industrial Expertise"
 JAP_instill_the_spirit_of_bushido:0 "Instill the Spirit of Bushido"
 JAP_instill_the_spirit_of_bushido_desc:0 "Through State Shinto and the traditional ideas of morality known as Bushido, we will be able to instill in the people the need to sacrifice oneself for the good of the state and the Imperial family." 
 JAP_instill_the_spirit_of_bushido_tt:0 "Enables Tactic: §Y$tactic_grand_banzai_charge$§!"
 JAP_integrate_the_great_japan_youth_party:0 "Integrate the Great Japan Youth Party"
 JAP_integrate_the_great_japan_youth_party_desc:0 "The Great Japan Youth Party, a nationalist youth organization modeled after the German youth movements, is not yet fully under our control, and acts as an independent third party under colonel Kingoro Hashimoto. We must rein them in, and place them under the control of the Taisei Yokusankai."
 JAP_interservice_rivalry_effects:0 "£imperial_influence_texticon Due to the §Y$JAP_interservice_rivalry$§! between the Army and the Navy:"
 JAP_intervene_in_china:0 "Marco Polo Bridge Incident"
 JAP_intervene_in_china_desc:0 "[Root.GetNameDefCap] is poor in resources, but our neighbours are not. We must take from them what we lack, and only require an excuse to begin doing so. Such an excuse could be provided by a few enterprising soldiers, after which the Emperor will have no choice but to assent to a war, no matter how ill-prepared..."
 JAP_invesments_into_minor_asian_states_cost:0 "East Asia Development Costs"
 JAP_is_home_islands_state_tt:0 "Any §YHome Islands§! state"
 JAP_isamu_cho:0 "Isamu Chō"
 JAP_isolate_oceania:0 "Isolate Oceania"
 JAP_isolate_oceania_desc:0 "Our high command has deemed it unfeasible to land in and occupy [AST.GetNameDef] and [NZL.GetNameDef], and have proposed a better solution to the issue of these hostile nations. We should occupy the less defended islands around these states, and cut them off from their allies, in order to slowly starve them of the will to fight us."
 JAP_isoroku_yamamoto:0 "$isoroku_yamamoto$"
 JAP_issue_the_senjinkun_military_code:0 "Issue the Senjinkun Military Code"
 JAP_issue_the_senjinkun_military_code_desc:0 "The pocket-sized military code 'The Instructions for the Battlefield' should be issued to every [ROOT.GetAdjective] soldier, in order to prepare them for the years of conflict to come. They are to be taught military regulations, combat readiness, esprit de corps, filial piety, as well as veneration of Shinto kami and the kokutai. 'Never live to experience shame as a prisoner, honor before surrender!'"
 JAP_issue_the_shinmin_no_michi_manifesto:0 "Issue the 'Shinmin no Michi' Manifesto"
 JAP_issue_the_shinmin_no_michi_manifesto_desc:0 "Our people need to be taught the way of subjects. This will be done through an ideological manifesto directed towards the people to explain in clear terms what is expected of them 'as a people and a nation'. Issuing such a manifesto will be the responsibility of the Ministry of Education."
 JAP_issue_the_ten_commandments_for_marriage:0 "Ten Commandments for Marriage"
 JAP_issue_the_ten_commandments_for_marriage_desc:0 "Our officials have come up with the new slogan 'Be fruitful and multiply' as a part of their new campaign for increasing the [ROOT.GetAdjective] population, due to our relatively low population count compared to many of our adversaries. We must support this initiative."
 JAP_isuzu_motors:0 "Isuzu Motors"
 JAP_iwane_matsui:0 "Iwane Matsui"
 JAP_japanese_airforce_dm:0 "Japanese Air Force"
 JAP_japanese_armor_doctrine:0 "Japanese Armor Doctrine"
 JAP_japanese_armor_doctrine_tt:0 "[GetJapaneseArmorDoctrineDesc]\n"
 JAP_japanese_chinese_friendship:0 "Sino-Japanese Pact of Mutual Cooperation"
 JAP_japanese_influence_growing_tibet:0 "Growing Japanese Influence"
 JAP_japanese_investments:0 "[JAP.GetAdjective] Investments"
 JAP_japanese_navy_dm:0 "Japanese Navy"
 JAP_japanese_navy_dm_desc:0 "The IJN was formed in 1868 at the beginning of the Meiji Restoration, and was already by 1920 the third largest navy in the world. Now, our mighty navy is being rapidly expanded, in order for our nation to be able to face the times ahead."
 JAP_japans_longest_day:0 "Japan's Longest Day"
 JAP_japans_longest_day_desc:0 "The dishonorable prime minister and his cronies have been dealt with, and the misguided Emperor has been placed under house arrest. Now it is time to reinvigorate the war effort, and bring our nation back to the glory it is destined for."
 JAP_the_zero:0 "The Zero"
 JAP_the_zero_desc:0 "Mitsubishi's new carrier fighter outclasses anything flying in Asia. Fast, long-ranged and supremely agile, the Zero will give our pilots mastery of the skies from the Chinese interior to the open Pacific."
 JAP_the_zero_idea:0 "The Zero"
 JAP_the_zero_idea_desc:0 "Our fighters are built around the agility and reach of the Zero, letting our pilots dictate the terms of every dogfight."
 JAP_jet_prototypes:0 "Jet Prototypes"
 JAP_jet_prototypes_desc:0 "The future of aviation does not lie with propellers. We must look at jet propulsion for improved capabilities for our aircraft."
 JAP_jinzaburo_masaki:0 "Jinzaburō Masaki"
 JAP_jiro_horikoshi:0 "Jiro Horikoshi"
 JAP_jo_iimura:0 "Jō Iimura"
 JAP_john_semer_farnsworth:0 "John Semer Farnsworth" 
 JAP_joshi_teishin_tai:0 "Mobilize the [ROOT.GetAdjective] Women"
 JAP_joshi_teishin_tai_desc:0 "The Women's Volunteer Corps will be founded to give women a chance to serve the Empire prior to marriage, compelling them to perform war time labor duties. Through this, more citizens will be able to be mobilized to aid in our war time industries."
 JAP_jotaro_watanabe:0 "Jōtarō Watanabe"
 JAP_jotaro_watanabe_was_killed:0 " Jōtarō Watanabe was killed by rebels"
 JAP_jungle_adaptation:0 "Jungle Adaptations"
 JAP_jungle_adaptation_desc:0 "Our army has realized that it will not be able to penetrate the jungle-clad regions of Burma and Greater Indonesia unless something drastic is done. They have therefore requested that special jungle divisions be established, so that they may lead the charge and penetrate the enemy lines."
 JAP_jungle_armor_tt:0 "\n§Y$category_all_armor$§!:\n§YJungle§!:\n Attack Effective Change: §G+10%§!\n Defense Effective Change: §G+10%§!"
 JAP_kaiso:0 "Kaiso"
 JAP_kanin_kotohito:0 "$kanin_kotohito$"
 JAP_kanji_ishiwara:0 "Kanji Ishiwara"
 JAP_kanson_arahata:0 "Kanson Arahata"
 JAP_kantai_kessen_1:0 "$GetKantaiKessenString$ [?JAP.JAP_kantai_kessen_target_1.GetNameDef] §Wfor [?JAP_kantai_kessen_remaining_days_1:days_left|Y0] days§!"
 JAP_kantai_kessen_2:0 "$GetKantaiKessenString$ [?JAP.JAP_kantai_kessen_target_2.GetNameDef]  §Wfor [?JAP_kantai_kessen_remaining_days_2:days_left|Y0] days§!"
 JAP_kantai_kessen_3:0 "$GetKantaiKessenString$ [?JAP.JAP_kantai_kessen_target_3.GetNameDef]  §Wfor [?JAP_first_strike_principle_remaining_days_3:days_left|Y0] days§!"
 JAP_kantai_kessen_tt:0 "When §Y[ROOT.GetNameDef]§! §Rdeclares war§! on a country with §Y$capital_ship$§!, gain for §Y180 days§!:\n §Y$JAP_kantai_kessen_dm$§!\n  Capital Ship Attack Against Country: §G+10.0%§!\n  Spotting Speed Against Country: §G+10.0%§!"
 JAP_kawanishi_aircraft_company_organization:0 "$kawanishi_aircraft_company$"
 JAP_kawasaki_aircraft_industries_organization:0 "$kawasaki_aircraft_industries$"
 JAP_kawasaki_dockyards_organization:0 "$kawasaki_dockyards$"
 JAP_kazushige_ugaki:0 "Kazushige Ugaki"
 JAP_keiji_fukuda:0 "Keiji Fukuda"
 JAP_keisuke_fujie:0 "Keisuke Fujie"
 JAP_keisuke_okada:0 "Keisuke Okada"
 JAP_kempeitai_idea_lar:0 "Kempeitai"
 JAP_kenji_doihara:0 "$kenji_doihara$"
 JAP_kenjiro_matsumoto:0 "Kenjiro Matsumoto"
 JAP_kenkichi_ueda:0 "Kenkichi Ueda"
 JAP_kenkokukai:0 "The National Foundation Society"
 JAP_kiichiro_higuchi:0 "Kiichirō Higuchi"
 JAP_kiichiro_hiranuma:0 "Kiichirō Hiranuma"
 JAP_kijiro_nambu:0 "Kijirō Nambu"
 JAP_kijuro_shidehara:0 "$kijuro_shidehara$"
 JAP_kiyosada_koda:0 "Kiyosada Koda"
 JAP_kiyoshi_hasegawa:0 "Kiyoshi Hasegawa"
 JAP_kodoha_coup_will_fail_historically_tt:0 "We will declare Martial law and employ the Imperial Japanese Navy's Yokosuka Regiment to suppress the rebellion. Minimal casualties have been reported, though some of the Kōdōha's targets have been confirmed dead:"
 JAP_kodoha_coup_will_fail_non_historically_tt:0 "We will declare Martial Law and attempt to suppress the rebellion using the Emergency Service Units of the Tokyo Metropolitan Police Department, limiting military involvement in the delivery of justice towards the Kōdōha. Few casualties have been reported, though some of the Kōdōha's targets have been confirmed dead:"
 JAP_kodoha_coup_will_succeed_tt:0 "The Kōdōha will seize the Ministry of War, the Imperial Hotel, the National Diet as well as the Imperial Palace. Many of the key targets of the Kōdōha have been confirmed dead:"
 JAP_kodoha_insurgency_decisions:0 "The Imperial Way"
 JAP_kodoha_insurgency_decisions_desc:0 "The Kōdōha faction, a faction within our Imperial Army is currently on the move against their enemies, as evidenced by their assassination of military officer Tetsuzan Nagata in August 1935. If they do decide to take action on a larger scale, it would not be until their officer Aizawa's trial has ended. It might be best to increase the security around certain individuals that they claim threaten the Kokutai, the soul of our nation."
 JAP_kodoha_the_emperor_cooperated_flag:0 "§YEmperor Shōwa§! chose to cooperate with the Kōdōha"
