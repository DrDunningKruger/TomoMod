 TomoMod_late_war_armor.1.d:0 "Years of hard fighting have taught our engineers what a tank needs to survive on the modern battlefield. Thicker sloped armour, bigger guns and stronger engines are now within reach.\n\nThe §R1943 Light, Medium, Heavy and Super-Heavy tank chassis§! can now be researched."
 TomoMod_late_war_armor.1.a:0 "Get them into production."
