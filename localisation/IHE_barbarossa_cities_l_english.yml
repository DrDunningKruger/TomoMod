l_english:
 ihe_barbarossa_cities.1.t:0 "Moscow Has Fallen"
 ihe_barbarossa_cities.1.d:0 "After weeks of bitter fighting, Axis forces have taken §RMoscow§!. The heart of the Soviet state is in our hands, its railways severed and its government scattered to the east.\n\nThe momentum is ours. The offensive must press on before the Red Army can recover."
 ihe_barbarossa_cities.1.a:0 "Onwards to victory!"
 ihe_barbarossa_cities.2.t:0 "Leningrad Has Fallen"
 ihe_barbarossa_cities.2.d:0 "The cradle of the revolution has fallen. Axis troops have broken into §RLeningrad§!, securing the Baltic and freeing our northern flank.\n\nWith the north secured, the momentum carries our armies ever deeper into Russia."
 ihe_barbarossa_cities.2.a:0 "The north is ours!"
 ihe_barbarossa_cities.3.t:0 "Stalingrad Has Fallen"
 ihe_barbarossa_cities.3.d:0 "The city that bears Stalin's name now lies in Axis hands. With §RStalingrad§! taken and the Volga cut, the Soviet lifeline to the Caucasus and its oil is severed.\n\nThe momentum must not be lost. Our armies drive on."
 ihe_barbarossa_cities.3.a:0 "The Volga is ours!"
 ihe_barbarossa_cities.4.t:0 "Sevastopol Has Fallen"
 ihe_barbarossa_cities.4.d:0 "After a determined siege, the fortress of §RSevastopol§! has surrendered to Axis forces. The Crimea is secured and the Black Sea Fleet has lost its home port.\n\nFreed from the siege, our southern armies carry the momentum onward."
 ihe_barbarossa_cities.4.a:0 "The Crimea is secured!"
 IHE_super_directive_21:0 "§RFührer Directive 21 Ordered§!"
 IHE_super_directive_21_QUOTE:0 ""You only have to kick in the door and the whole rotten structure will come crashing down."\n\n- Adolf Hitler"
 IHE_super_directive_21_REMARK:0 "Forward to Victory"
 IHE_super_directive_21_DATE:0 "[?global.IHE_super_directive_21_date.GetDateStringNoHourLong]"
