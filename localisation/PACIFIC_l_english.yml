 pacific_war_desc:0 "Fate of the Pacific: a zone counts for a side only when that side controls every state in it. While both sides hold a similar number of zones the war is a stalemate; each zone taken from the enemy moves it one level in the attacker's favour.\n §YSumatra§!: [672.Controller.GetFlag] Sumatra\n §YBorneo§!: [333.Controller.GetFlag] North Borneo [334.Controller.GetFlag] Kalimantan\n §YJava§!: [335.Controller.GetFlag] Java [667.Controller.GetFlag] Lesser Sunda Islands\n §YNew Guinea§!: [523.Controller.GetFlag] Papua [669.Controller.GetFlag] West Papua\n §YPhilippines§!: [327.Controller.GetFlag] Manila [623.Controller.GetFlag] Luzon [624.Controller.GetFlag] Central islands [625.Controller.GetFlag] Samar [626.Controller.GetFlag] Palawan [627.Controller.GetFlag] Mindanao [628.Controller.GetFlag] Cebu\n §YBismarck Sea§!: [684.Controller.GetFlag] Caroline Islands [737.Controller.GetFlag] Bismarck\n §YSouth West Pacific§!: [632.Controller.GetFlag] Wake Island [633.Controller.GetFlag] Marshall Islands [639.Controller.GetFlag] Gilbert Islands [642.Controller.GetFlag] Phoenix Island [643.Controller.GetFlag] Ellice Islands [725.Controller.GetFlag] Nauru\n §YHawaii§!: [629.Controller.GetFlag] Hawaii\n §YWestern Pacific§!: [638.Controller.GetFlag] Guam [645.Controller.GetFlag] Iwo Jima [646.Controller.GetFlag] Saipan [648.Controller.GetFlag] Marcus Island\n §YBanda Sea§!: [668.Controller.GetFlag] The Moluccas [673.Controller.GetFlag] Sulawesi\n §YMalaya§!: [336.Controller.GetFlag] Singapore\n\n§YThe war stays at a stalemate and no bonuses apply until 2 months after Japan or its allies go to war with the Allies.§!\nCurrent zone balance (Allies minus Japan): §Y[?global.PACIFIC_standing]§!"
