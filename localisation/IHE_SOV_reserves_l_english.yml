l_english:
 ihe_sov_reserves.1.t:0 "RKKA Reserves Mobilised"
 ihe_sov_reserves.1.d:0 "With over 1.5 million men lost, the Stavka has released the first wave of reserve divisions from the Urals to the front."
 ihe_sov_reserves.1.a:0 "To the front!"
 ihe_sov_reserves.2.t:0 "Second Wave of RKKA Reserves"
 ihe_sov_reserves.2.d:0 "Losses have passed 3 million men. A second wave of reserve divisions is moving out of the Urals."
 ihe_sov_reserves.2.a:0 "Not one step back!"
 ihe_sov_reserves.3.t:0 "Third Wave of RKKA Reserves"
 ihe_sov_reserves.3.d:0 "With 4.5 million men lost, a third wave of reserves is committed to the front, and NKVD blocking detachments march behind it."
 ihe_sov_reserves.3.a:0 "For the Motherland!"
 ihe_sov_reserves.4.t:0 "Fourth Wave of RKKA Reserves"
 ihe_sov_reserves.4.d:0 "Losses have reached 6 million men. The Stavka scrapes together a fourth wave of reserve divisions from the depots of the Urals and Siberia."
 ihe_sov_reserves.4.a:0 "There is no land beyond the Volga!"
 ihe_sov_reserves.5.t:0 "Fifth Wave of RKKA Reserves"
 ihe_sov_reserves.5.d:0 "With 7.5 million men lost, a fifth wave of hastily trained reserves is sent west to hold the line."
 ihe_sov_reserves.5.a:0 "The Motherland calls!"
 ihe_sov_reserves.6.t:0 "Final RKKA Reserves Committed"
 ihe_sov_reserves.6.d:0 "Losses have passed 9 million men. The last of the strategic reserve leaves the Urals. There is nothing left to send after this."
 ihe_sov_reserves.6.a:0 "Everything for the front!"
