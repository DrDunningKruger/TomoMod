l_english:
 AXIS_accelerate_spanish_recovery:0 "Rebuild Spain"
 AXIS_accelerate_spanish_recovery_desc:0 "The Civil War left Spain in ruins. Axis engineers and credit will restore what was destroyed and bring Spain into the fold."
 AXIS_adaptive_1_phase2:0 "Mass Production Methods"
 AXIS_adaptive_1_phase2_desc:0 "Long production runs and fewer model changes trade early efficiency for a far higher ceiling."
 AXIS_adaptive_2:0 "Full Employment Drive"
 AXIS_adaptive_2_desc:0 "Labour offices across the pact move idle workers onto building sites, speeding every construction project."
 AXIS_adaptive_2_phase2:0 "Industrial Recovery"
 AXIS_adaptive_2_phase2_desc:0 "With the shock of mobilisation behind us, our workers and managers learn their new trades quickly."
 AXIS_adaptive_3:0 "The People's Industry"
 AXIS_adaptive_3_desc:0 "New civilian works are financed abroad, adding industry without drawing on our own construction capacity."
 AXIS_adaptive_3_phase2:0 "Reichsmark Credit Lines"
 AXIS_adaptive_3_phase2_desc:0 "Berlin extends credit to its partners so that construction never stalls for want of funds."
 AXIS_adaptive_economy:0 "The Adaptive Economy"
 AXIS_adaptive_economy_desc:0 "Rather than gamble on one strategy, the Axis economies will adapt as the war develops, converting industry where and when it is needed."
 AXIS_adaptive_phase3:0 "The Final Stage"
 AXIS_adaptive_phase3_desc:0 "The choices we made earlier now decide the last stage of our economic plan."
 AXIS_adaptive_phase3_high_high:0 "Resource Self-Sufficiency"
 AXIS_adaptive_phase3_high_high_desc:0 "Our industry is already strong. What remains is to dig deeper and secure the raw materials that feed it."
 AXIS_adaptive_phase3_low_low:0 "Total Output Programme"
 AXIS_adaptive_phase3_low_low_desc:0 "With nothing held in reserve, every factory, yard and mine is driven to its absolute maximum."
 AXIS_adaptive_phase3_low_med:0 "Emergency Output Targets"
 AXIS_adaptive_phase3_low_med_desc:0 "What our economy lacks in polish it must make up in sheer output."
 AXIS_adaptive_phase3_med_high:0 "Seasoned Workforce"
 AXIS_adaptive_phase3_med_high_desc:0 "Experienced workers and foremen raise productivity on every line."
 AXIS_adaptive_phase3_med_med:0 "Balanced War Output"
 AXIS_adaptive_phase3_med_med_desc:0 "Arms factories and shipyards alike are pushed to produce more from the same floor space."
 AXIS_afrika_korps:0 "The Afrika Korps"
 AXIS_afrika_korps_desc:0 "German armour will be sent to the desert to stiffen our Italian allies and drive the British out of Egypt."
 AXIS_air_specialization_1:0 "Standardised Airframes"
 AXIS_air_specialization_1_desc:0 "Common airframes and parts across the pact make every aircraft cheaper to build."
 AXIS_air_specialization_2:0 "Shared Armament Laboratories"
 AXIS_air_specialization_2_desc:0 "Aircraft guns, bombs and modules are developed jointly and shared with every air force in the pact."
 AXIS_air_specialization_3:0 "Long-Range Aces"
 AXIS_air_specialization_3_desc:0 "Our best pilots train in long-range flying and dogfighting, and their skills spread through every squadron."
 AXIS_balkan_economic_integration:0 "The Danubian Economic Bloc"
 AXIS_balkan_economic_integration_desc:0 "The Danube links Vienna to the Black Sea. Hungary, Romania and Bulgaria will be tied into a single Axis economic bloc."
 AXIS_blitzkrieg_economy:0 "The Blitzkrieg Economy"
 AXIS_blitzkrieg_economy_desc:0 "We will not prepare for a long war. Industry will be pushed to its limit now, and the war must be won before the bill comes due."
 AXIS_blitzkrieg_phase1:0 "Arms Before Butter"
 AXIS_blitzkrieg_phase1_desc:0 "Factories turn from consumer goods to munitions. Every month saved on the production line is a month taken off the war."
 AXIS_blitzkrieg_phase1_rubber:0 "Buna Synthetic Rubber"
 AXIS_blitzkrieg_phase1_rubber_desc:0 "Cut off from the plantations of Malaya, the Axis must make its own rubber. The Buna process will keep the tyres turning."
 AXIS_blitzkrieg_phase2:0 "Rationalised War Production"
 AXIS_blitzkrieg_phase2_desc:0 "Central planners standardise components and cut wasteful variants, letting every production line run closer to its true capacity."
 AXIS_blitzkrieg_phase3:0 "The Bill Comes Due"
 AXIS_blitzkrieg_phase3_desc:0 "The quick victory did not come. The overstretched economy must now be wound back before it breaks entirely."
 AXIS_bulgarian_development:0 "Bulgarian Industrial Plan"
 AXIS_bulgarian_development_desc:0 "A small but loyal ally, Bulgaria will be given the factories she needs to become more than a farming nation."
 AXIS_civ_eco_boost:0 "Pact Trade Agreements"
 AXIS_civ_eco_boost_desc:0 "Clearing agreements between the Axis economies let raw materials and machine tools flow across borders without the burden of hard currency."
 AXIS_continue_the_development_of_small_arms:0 "The Assault Rifle"
 AXIS_continue_the_development_of_small_arms_desc:0 "Combat has shown the value of automatic fire at short range. A new class of rifle will put it in every soldier's hands."
 AXIS_dday_last_stand:0 "Hold the Atlantic Wall"
 AXIS_dday_last_stand_desc:0 "The invasion has come. Every bunker and every man must hold until reserves arrive."
 AXIS_efficient_gun_assembly:0 "Simplified Small Arms"
 AXIS_efficient_gun_assembly_desc:0 "Stamped steel and simpler designs let our factories turn out far more weapons from the same lines."
 AXIS_emergency_gold_reserves:0 "Reichsbank Gold Reserves"
 AXIS_emergency_gold_reserves_desc:0 "Hidden gold reserves are released to pay for vital imports."
 AXIS_expand_hungarian_alu_industry:0 "Transdanubian Bauxite"
 AXIS_expand_hungarian_alu_industry_desc:0 "Hungary holds some of the richest bauxite deposits in Europe. The aluminium they yield will build the Axis air fleets."
 AXIS_factionwide_development:0 "The Axis Economic Miracle"
 AXIS_factionwide_development_desc:0 "Every partner that received Axis investment now enjoys a surge of growth."
 AXIS_fascist_researchers:0 "Academies of the New Order"
 AXIS_fascist_researchers_desc:0 "Scientists from Rome, Berlin and Budapest share their work through joint academies devoted to the needs of the state."
 AXIS_fill_in_italian_gaps:0 "Roads of the South"
 AXIS_fill_in_italian_gaps_desc:0 "The Mezzogiorno and Italy's islands lag far behind the north. New roads and railways will knit the peninsula together."
 AXIS_high_command:0 "Axis Supreme Command"
 AXIS_high_command_desc:0 "A joint staff will coordinate the plans of every Axis army, giving each member a voice and a share of the command."
 AXIS_hungarian_development:0 "Hungarian Industrial Plan"
 AXIS_hungarian_development_desc:0 "Following the Győr Programme, Hungary's industry will be expanded to supply the Axis war machine."
 AXIS_improve_bulgarian_chromium:0 "Rhodope Chromium Mines"
 AXIS_improve_bulgarian_chromium_desc:0 "The Rhodope mountains hold chromium vital to armour plate. Modern mining will bring it to Axis steelworks."
 AXIS_italian_development:0 "Italian Industrial Expansion"
 AXIS_italian_development_desc:0 "Italy's northern industry is the backbone of the Mediterranean front. German capital and know-how will expand it further."
 AXIS_joint_alliance:0 "The Pact of Steel"
 AXIS_joint_alliance_desc:0 "Rome, Berlin and their partners in the east and south bind their fortunes together. What one member builds, the whole pact will share."
 AXIS_massmob_mobilization_1:0 "Raise the Militias"
 AXIS_massmob_mobilization_1_desc:0 "Every able man will be trained to fight. Our armies will be built on sheer numbers."
 AXIS_massmob_mobilization_2:0 "The Nation Under Arms"
 AXIS_massmob_mobilization_2_desc:0 "Radio and propaganda keep the masses united, while depots ensure losses are quickly replaced."
 AXIS_massmob_mobilization_3:0 "The Endless Columns"
 AXIS_massmob_mobilization_3_desc:0 "The whole nation marches to war, its soldiers enduring hunger and shortage that would break other armies."
 AXIS_mediterranean_development_plan:0 "Mare Nostrum Development Plan"
 AXIS_mediterranean_development_plan_desc:0 "The Mediterranean must become an Axis lake. That begins with building up Italy and Spain into true industrial powers."
 AXIS_mediterranean_resources:0 "Mediterranean Prosperity"
 AXIS_mediterranean_resources_desc:0 "With investment flowing into Italy and Spain, the Latin partners of the Axis begin to share in its prosperity."
 AXIS_mil_eco_boost:0 "Armaments Exchange"
 AXIS_mil_eco_boost_desc:0 "Machine tools, blueprints and production methods are shared between Axis arsenals, putting every member's war industry on a common footing."
 AXIS_mining_expertise:0 "German Mining Engineers"
 AXIS_mining_expertise_desc:0 "Engineers from the Ruhr and Silesia are sent to every member state to modernise mines and squeeze more ore from every seam."
 AXIS_navy_specialization_1:0 "Coalition Shipyards"
 AXIS_navy_specialization_1_desc:0 "New dockyards on our coasts will give the pact a fleet worthy of its ambitions."
 AXIS_navy_specialization_2:0 "Fleet Repair Yards"
 AXIS_navy_specialization_2_desc:0 "Ships that return damaged must return to sea quickly. New repair yards make it so."
 AXIS_navy_specialization_3:0 "Pooled Naval Design Bureaus"
 AXIS_navy_specialization_3_desc:0 "Naval architects of the pact work together on the next generation of warships."
 AXIS_normandy_airbases:0 "Airfields of the Channel Coast"
 AXIS_normandy_airbases_desc:0 "Large airfields in northern France will carry the air war to Britain and guard the coast against invasion."
 AXIS_political_cooperation:0 "Axis Political Accords"
 AXIS_political_cooperation_desc:0 "Regular conferences between the Axis capitals smooth over old rivalries and give every member government a firmer grip at home."
 AXIS_research_library:0 "The Axis Scientific Exchange"
 AXIS_research_library_desc:0 "A joint library of patents, papers and test results gives every member of the pact access to the best Axis science."
 AXIS_rnd_department:0 "Joint Research Bureau"
 AXIS_rnd_department_desc:0 "A shared bureau coordinates research across the pact, ending duplicated effort."
 AXIS_romanian_development:0 "Romanian Industrial Plan"
 AXIS_romanian_development_desc:0 "Romania's factories around Bucharest will be expanded so she can arm her own divisions."
 AXIS_small_arms_expertise:0 "Mauser and Beretta"
 AXIS_small_arms_expertise_desc:0 "The great arms makers of the Axis pool their designs to give every soldier a better rifle."
 AXIS_spanish_development:0 "Spanish Industrial Revival"
 AXIS_spanish_development_desc:0 "New factories in Spain's industrial heartlands will turn a war-torn nation into a useful ally."
 AXIS_special_forces_1:0 "Assault Pioneers"
 AXIS_special_forces_1_desc:0 "Specially trained infantry and pioneers will lead the way through fortified lines."
 AXIS_special_forces_2:0 "Storm Detachments"
 AXIS_special_forces_2_desc:0 "Elite storm units work hand in hand with dive bombers to crack the strongest defences."
 AXIS_special_forces_3:0 "Elite Shock Formations"
 AXIS_special_forces_3_desc:0 "Our best soldiers form whole shock formations, backed by massed artillery and meticulous planning."
 AXIS_tank_specialization_1:0 "Panzer Spearheads"
 AXIS_tank_specialization_1_desc:0 "Concentrated armour will tear holes in the enemy line and drive deep into his rear."
 AXIS_tank_specialization_2:0 "Tank Assembly Lines"
 AXIS_tank_specialization_2_desc:0 "Dedicated tank works raise production and switch between models with less disruption."
 AXIS_tank_specialization_3:0 "Panzer Academies"
 AXIS_tank_specialization_3_desc:0 "Officer schools refine the doctrine of mobile warfare, sharing new designs across the pact."
 AXIS_technological_warfare:0 "The Wizard War"
 AXIS_technological_warfare_desc:0 "Radar, radio and electronic warfare will decide the coming battles. The Axis must lead in all of them."
 AXIS_the_ploiesti_oilfield:0 "Ploiești and the Jiu Valley"
 AXIS_the_ploiesti_oilfield_desc:0 "Ploiești fuels the Axis and the coal of the Jiu Valley powers Romania's industry. Both will be developed to their full potential."
 AXIS_the_waiting_game:0 "The Long War Plan"
 AXIS_the_waiting_game_desc:0 "The war will not be won in a single summer. We will build patiently, integrating conquered lands until our economy is ready to be unleashed."
 AXIS_the_waiting_game_phase1:0 "Currency Stabilisation"
 AXIS_the_waiting_game_phase1_desc:0 "A stable currency across the pact lays the groundwork for years of steady construction."
 AXIS_the_waiting_game_phase1_emergency:0 "Emergency Integration"
 AXIS_the_waiting_game_phase1_emergency_desc:0 "The plan is falling behind. Emergency measures will buy productivity now, at the cost of a much longer wait."
 AXIS_the_waiting_game_phase2:0 "Securing Raw Materials"
 AXIS_the_waiting_game_phase2_desc:0 "New mines and quarries across the Axis sphere feed the growing industrial base."
 AXIS_the_waiting_game_phase3:0 "Autarky Achieved"
 AXIS_the_waiting_game_phase3_desc:0 "Years of patient building have paid off. The Axis economy is self-sufficient and ready for total war."
 AXIS_total_economic_mobilization:0 "Danubian Mobilisation"
 AXIS_total_economic_mobilization_desc:0 "German engineers and capital flow down the Danube, speeding construction and modernising the mines and oilfields of Hungary, Romania and Bulgaria."
 AXIS_unlock_army_specializations:0 "Specialised Armies of the Pact"
 AXIS_unlock_army_specializations_desc:0 "No single nation can master every form of war. Each member of the pact will specialise, and the whole will be stronger for it."
 AXIS_war_economy:0 "War Bond Drives"
 AXIS_war_economy_desc:0 "Citizens across the pact lend their savings to the war effort, funding new factories that start production faster."
 AXIS_war_readiness_program:0 "War Readiness Programme"
 AXIS_war_readiness_program_desc:0 "With war imminent, every factory in the pact is given priority orders."
 MON_red_industry_rises_tt:0 "Industry rises across the nation."
 Shared_ALLIES_blitzkrieg_eco:0 "The Short War Gamble"
 Shared_ALLIES_blitzkrieg_eco_desc:0 "The war must be won quickly. Every major victory buys our strained economies more time."
 Shared_ALLIES_the_waiting_game:0 "Business as Usual"
 Shared_ALLIES_the_waiting_game_desc:0 "Liberating occupied lands speeds up our economic plan."
 Shared_AXIS_blitzkrieg_eco:0 "The Blitzkrieg Economy"
 Shared_AXIS_blitzkrieg_eco_desc:0 "The war must be won quickly. Every major victory buys the overstretched economy more time."
 Shared_AXIS_the_waiting_game:0 "The Long War Plan"
 Shared_AXIS_the_waiting_game_desc:0 "Integrating conquered lands speeds up our economic plan."
 Shared_allies_army_specializations:0 "Allied Army Specialisations"
 Shared_allies_army_specializations_desc:0 "Each Allied nation may choose one field to specialise in."
 adaptive_3_tt:0 "The final focus available depends on which earlier §HAdaptive Economy§! focuses were taken."
 air_assault_brigade:0 "Air Assault Brigade"
 air_specialization_1:0 "Long-Range Aces"
 aircraft_bonus:0 "Fighter Design Competition"
 allies_adaptive_1:0 "Shadow Arms Factories"
 allies_adaptive_1_desc:0 "Plans drawn up in peacetime let new arms factories across the alliance be raised in record time."
 allies_adaptive_1_phase2:0 "Mass Production Methods"
 allies_adaptive_1_phase2_desc:0 "Long production runs trade early efficiency for a much higher ceiling."
 allies_adaptive_2:0 "Full Employment"
 allies_adaptive_2_desc:0 "The unemployed of the Depression are put to work on the factory floor, raising output across the alliance."
 allies_adaptive_2_phase2:0 "Industrial Recovery"
 allies_adaptive_2_phase2_desc:0 "Workers and managers settle into wartime production, improving month by month."
 allies_adaptive_3:0 "Utility Production"
 allies_adaptive_3_desc:0 "Simple, standardised goods free up industry and labour for the war effort."
 allies_adaptive_3_phase2:0 "Lend and Lease"
 allies_adaptive_3_phase2_desc:0 "Generous credit between the Allied nations ensures construction never stalls for want of funds."
 allies_adaptive_economy:0 "The Flexible Economy"
 allies_adaptive_economy_desc:0 "Allied economies will adapt as the war develops, converting industry where it is needed most."
 allies_adaptive_phase3:0 "The Final Stage"
 allies_adaptive_phase3_desc:0 "The choices we made earlier now decide the last stage of our economic plan."
 allies_adaptive_phase3_high_high:0 "Imperial Resources"
 allies_adaptive_phase3_high_high_desc:0 "Our industry is already strong. Now we tap the vast raw materials of the Empire to feed it."
 allies_adaptive_phase3_low_low:0 "Victory Production Programme"
 allies_adaptive_phase3_low_low_desc:0 "Every factory, shipyard and mine is driven to its maximum output for the final push."
 allies_adaptive_phase3_low_med:0 "Production Targets"
 allies_adaptive_phase3_low_med_desc:0 "What our economy lacks in polish it makes up in sheer output."
 allies_adaptive_phase3_med_high:0 "Skilled Workforce"
 allies_adaptive_phase3_med_high_desc:0 "Experienced workers raise productivity on every line."
 allies_adaptive_phase3_med_med:0 "Balanced War Output"
 allies_adaptive_phase3_med_med_desc:0 "Arms factories and shipyards are both pushed to produce more."
 allies_afrika_korps:0 "The Desert Army"
 allies_afrika_korps_desc:0 "Allied forces in Africa will be reinforced and trained to fight in the desert."
 allies_air_specialization:0 "Air Power"
 allies_air_specialization_1:0 "Empire Air Training Scheme"
 allies_air_specialization_1_desc:0 "Aircrew from across the Commonwealth train together in Canada, Australia and South Africa."
 allies_air_specialization_2:0 "The Shadow Aircraft Factories"
 allies_air_specialization_2_desc:0 "Car makers turned aircraft builders give the alliance a huge reserve of production."
 allies_air_specialization_3:0 "All-Weather Squadrons"
 allies_air_specialization_3_desc:0 "Our pilots learn to fly in any weather and over any distance, and the best of them become aces."
 allies_air_specialization_desc:0 "Our nation will specialise in air power."
 allies_air_specialization_new:0 "All-Weather Squadrons"
 allies_all_for_one:0 "All for One"
 allies_all_for_one_desc:0 "The nation that leads the way receives the full benefit of the alliance's combined resources."
 allies_allied_researchers:0 "The Tizard Mission"
 allies_allied_researchers_desc:0 "Allied scientists share their secrets, from the cavity magnetron to jet engines, so that no discovery is wasted."
 allies_armored_trucks:0 "Motor Transport"
 allies_armored_trucks_desc:0 "Trucks and armoured cars from the factories of Detroit and Coventry will motorise the alliance."
 allies_armored_warfare_specialization:0 "Armoured Warfare"
 allies_armored_warfare_specialization_desc:0 "Our nation will specialise in tanks and mobile warfare."
 allies_artillery_advancements:0 "Royal Artillery Developments"
 allies_artillery_advancements_desc:0 "New guns and fire control methods will make Allied artillery the best in the world."
 allies_atlantic_development_plan:0 "The Atlantic Lifeline"
 allies_atlantic_development_plan_desc:0 "The Atlantic links the Allied nations together. Ports, roads and factories on both sides will be built up."
 allies_australian_development:0 "Australian Industrial Programme"
 allies_australian_development_desc:0 "Australia must be able to arm herself. New factories will be built across the mainland and New Zealand."
 allies_barbarossa_defense:0 "Aid to Russia"
 allies_barbarossa_defense_desc:0 "The enemy of our enemy is our friend. Supplies and intelligence will help the Soviets resist the invasion."
 allies_better_radios:0 "Wireless Sets for Every Unit"
 allies_better_radios_desc:0 "Reliable radios will link every tank, plane and battalion to its commanders."
 allies_blitzkrieg_economy:0 "The Short War Gamble"
 allies_blitzkrieg_economy_desc:0 "We will strike hard and fast, pushing industry to its limit to end the war before our economies give out."
 allies_blitzkrieg_phase1:0 "Shadow Factory Scheme"
 allies_blitzkrieg_phase1_desc:0 "Factories built in peacetime as shadow plants are brought into full arms production."
 allies_blitzkrieg_phase1_rubber:0 "Synthetic Rubber Programme"
 allies_blitzkrieg_phase1_rubber_desc:0 "With Malayan rubber under threat, the Allies must make their own."
 allies_blitzkrieg_phase2:0 "Ministry of Supply"
 allies_blitzkrieg_phase2_desc:0 "A single ministry controls supply and production, letting factories run closer to full capacity."
 allies_blitzkrieg_phase3:0 "The Reckoning"
 allies_blitzkrieg_phase3_desc:0 "The quick victory slipped away. Our strained economies must now be wound back before they break."
 allies_canada_eco_investment:0 "The Canadian Arsenal"
 allies_canada_eco_investment_desc:0 "New factories in Ontario and Quebec will turn Canada into an arsenal for the whole alliance."
 allies_canadian_development:0 "Canadian Industrial Programme"
 allies_canadian_development_desc:0 "Canada's vast resources and skilled workforce will make her a pillar of the Allied war economy."
 allies_civ_eco_boost:0 "Sterling Area Trade"
 allies_civ_eco_boost_desc:0 "Trade within the sterling area is freed of tariffs and red tape, boosting civilian industry across the alliance."
 allies_continue_the_development_of_small_arms:0 "Automatic Weapons"
 allies_continue_the_development_of_small_arms_desc:0 "Combat has shown the value of automatic fire. New weapons will put more of it in every soldier's hands."
 allies_dday_force_attack:0 "Operation Overlord"
 allies_dday_force_attack_desc:0 "The invasion of Europe has begun. Every man and every gun must push off the beaches."
 allies_development_eastward:0 "Developing the East"
 allies_development_eastward_desc:0 "The Empire east of Suez holds untapped potential. Allied investment will develop South Africa, India and Australia."
 allies_dynamic:0 "The Allies"
 allies_efficient_gun_assembly:0 "Simplified Small Arms"
 allies_efficient_gun_assembly_desc:0 "The Sten shows what simple, stamped weapons can achieve. Our factories will turn out far more."
 allies_emergency_gold_reserves:0 "Bank of England Gold"
 allies_emergency_gold_reserves_desc:0 "Gold reserves are released to pay for vital imports from abroad."
 allies_expanded_infra:0 "Imperial Railways"
 allies_expanded_infra_desc:0 "New railways and roads link the mines and factories of the Dominions to their ports."
 allies_expanded_slots:0 "Room to Grow"
 allies_expanded_slots_desc:0 "Every Dominion that received Allied investment will be given room for more industry."
 allies_factionwide_development:0 "Commonwealth Prosperity"
 allies_factionwide_development_desc:0 "Every partner that received Allied investment now shares in the growth."
 allies_factionwide_development_tt:0 "Every partner that received investment gains §G+1§! building slot and §G+1§! infrastructure in every core state."
 allies_france_foreign_investors:0 "Foreign Investment in France"
 allies_france_foreign_investors_desc:0 "British and American capital will flow into France, financing factories she cannot build alone."
 allies_france_mainland_development:0 "Rebuild the Paris Industries"
 allies_france_mainland_development_desc:0 "The industrial belt around Paris will be expanded to make France a match for Germany."
 allies_france_true_democracy:0 "Liberté, Égalité, Fraternité"
 allies_france_true_democracy_desc:0 "France must be reminded what she is fighting for. A renewed commitment to the Republic will rally the nation."
 allies_high_command:0 "Combined Chiefs of Staff"
 allies_high_command_desc:0 "A combined staff will coordinate the plans of every Allied army, navy and air force."
 allies_indian_development:0 "Indian Industrial Programme"
 allies_indian_development_desc:0 "India's huge population and resources will be harnessed with new factories across the subcontinent."
 allies_joint_alliance:0 "The Grand Alliance"
 allies_joint_alliance_desc:0 "The free nations of the world stand together. The resources of a dozen nations and five continents will be pooled against the aggressor."
 allies_massmob_mobilization_1:0 "Home Guard"
 allies_massmob_mobilization_1_desc:0 "Every able citizen will be trained and ready to defend their home."
 allies_massmob_mobilization_2:0 "Citizen Armies"
 allies_massmob_mobilization_2_desc:0 "Radio and newsreels keep the nation united, while depots ensure losses are quickly replaced."
 allies_massmob_mobilization_3:0 "The Arsenal of Men"
 allies_massmob_mobilization_3_desc:0 "The whole Empire marches to war, its soldiers ready to endure hardship and shortage."
 allies_massmob_specialization:0 "Mass Mobilisation"
 allies_massmob_specialization_desc:0 "Our nation will specialise in raising and sustaining large armies."
 allies_mil_eco_boost:0 "Arsenal of Democracy"
 allies_mil_eco_boost_desc:0 "Allied arms factories share designs and tooling, raising military output across the alliance."
 allies_mining_expertise:0 "Imperial Mining Survey"
 allies_mining_expertise_desc:0 "Geologists from across the Empire survey new deposits and modernise mines from Canada to the Transvaal."
 allies_navy_specialization:0 "Naval Power"
 allies_navy_specialization_1:0 "Dominion Shipyards"
 allies_navy_specialization_1_desc:0 "New dockyards on our coasts will build the ships the alliance needs."
 allies_navy_specialization_2:0 "Fleet Repair Yards"
 allies_navy_specialization_2_desc:0 "New repair yards will return damaged ships to sea quickly."
 allies_navy_specialization_3:0 "Pooled Naval Design Bureaus"
 allies_navy_specialization_3_desc:0 "Naval architects across the alliance work together on the next generation of warships."
 allies_navy_specialization_desc:0 "Our nation will specialise in building and maintaining a powerful fleet."
 allies_one_for_all:0 "One for All"
 allies_one_for_all_desc:0 "Every member of the alliance shares in its combined strength."
 allies_political_cooperation:0 "Commonwealth Conferences"
 allies_political_cooperation_desc:0 "Allied leaders meet regularly to coordinate policy, strengthening democratic governments across the alliance."
 allies_radars:0 "Chain Home"
 allies_radars_desc:0 "A chain of radar stations will warn of every raid long before it arrives."
 allies_radio_bonus:0 "Wireless Sets"
 allies_research_library:0 "The Allied Scientific Exchange"
 allies_research_library_desc:0 "A joint library of patents and research gives every Allied nation access to the best science of the alliance."
 allies_rnd_department:0 "Joint Research Committee"
 allies_rnd_department_desc:0 "A shared committee coordinates research across the alliance, ending duplicated effort."
 allies_saf_development:0 "The Witwatersrand Works"
 allies_saf_development_desc:0 "South Africa's mining wealth will fund new industry around Johannesburg."
 allies_shared_tt:0 "§HShared with every Allied member:§!"
 allies_small_arms_expertise:0 "Enfield and Springfield"
 allies_small_arms_expertise_desc:0 "The great arms makers of the Allies pool their designs to give every soldier a better rifle."
 allies_special_forces_1:0 "Commandos"
 allies_special_forces_1_desc:0 "Specially trained raiders will lead the way through the enemy's defences."
 allies_special_forces_2:0 "Combined Operations"
 allies_special_forces_2_desc:0 "Commandos work hand in hand with close air support to crack the strongest positions."
 allies_special_forces_3:0 "Elite Assault Divisions"
 allies_special_forces_3_desc:0 "Our best soldiers form whole assault divisions, backed by massed artillery and careful planning."
 allies_special_forces_specialization:0 "Special Forces"
 allies_special_forces_specialization_desc:0 "Our nation will specialise in elite and special forces."
 allies_specialized_forces:0 "Specialised Forces"
