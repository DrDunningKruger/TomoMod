l_english:
 AXIS_EAST_STATUS_HOLDING:0 "Held: [?global.axis_east_held_days|0]/30D"
 AXIS_EAST_STATUS_COUNTDOWN:0 "§YVictory: [?global.axis_east_countdown_days|0]/120D§!"
 AXIS_EAST_STATUS_PAUSED:0 "§RPaused: [?global.axis_east_held_days|0]/30D§!"
 AXIS_EAST_STATUS_WON:0 "§GPax Germanica§!"
 AXIS_EAST_STATUS_TT:0 "§YVictory in the East§!\nIf the Axis controls §YLeningrad§!, §YMoscow§!, §YKazan§!, §YStalingrad§! and §YBaku§! for §Y30§! days, the §RSoviet Union surrenders§!. Losing any of the five cities §Ypauses§! the 30 days until all five are held again.\n\nOnce the Soviets surrender, the Allies have §Y120§! days to make §YGermany§! capitulate.\nIf they do, the §GAllies win the game§!.\nIf they don't, the §RAxis wins the game§!."
 AXIS_EAST_PIP_LENINGRAD_RED_TT:0 "§YLeningrad§!: §Rnot held by the Axis§!"
 AXIS_EAST_PIP_LENINGRAD_GREEN_TT:0 "§YLeningrad§!: §Gheld by the Axis§!"
 AXIS_EAST_PIP_MOSCOW_RED_TT:0 "§YMoscow§!: §Rnot held by the Axis§!"
 AXIS_EAST_PIP_MOSCOW_GREEN_TT:0 "§YMoscow§!: §Gheld by the Axis§!"
 AXIS_EAST_PIP_KAZAN_RED_TT:0 "§YKazan§!: §Rnot held by the Axis§!"
 AXIS_EAST_PIP_KAZAN_GREEN_TT:0 "§YKazan§!: §Gheld by the Axis§!"
 AXIS_EAST_PIP_STALINGRAD_RED_TT:0 "§YStalingrad§!: §Rnot held by the Axis§!"
 AXIS_EAST_PIP_STALINGRAD_GREEN_TT:0 "§YStalingrad§!: §Gheld by the Axis§!"
 AXIS_EAST_PIP_BAKU_RED_TT:0 "§YBaku§!: §Rnot held by the Axis§!"
 AXIS_EAST_PIP_BAKU_GREEN_TT:0 "§YBaku§!: §Gheld by the Axis§!"
 ihe_axis_east_victory.1.t:0 "The Soviet Union Surrenders"
 ihe_axis_east_victory.1.d:0 "For thirty days the Axis has held Leningrad, Moscow, Kazan, Stalingrad and Baku. With its heartland broken and the oil of the Caucasus lost, the Soviet Union has laid down its arms and submitted to Germany.\n\nThe Allies now have §R120 days§! to force Germany to capitulate. If they fail, the war in Europe is lost."
 ihe_axis_east_victory.1.a:0 "Hold the line in the East!"
 ihe_axis_east_victory.1.b:0 "Strike at Berlin, now!"
 IHE_super_pax_germanica:0 "§YPax Germanica§!"
 IHE_super_pax_germanica_QUOTE:0 "From the Atlantic to the Urals, the guns fall silent. With the Soviet Union shattered from the Baltic to the Caspian and the Allies unable to bring Germany to its knees, Europe now lives under a German peace.\n- §RThe Axis has won the war§!"
 IHE_super_pax_germanica_REMARK_AXIS:0 "Victory!"
 IHE_super_pax_germanica_REMARK_ALLIES:0 "Europe is lost."
 IHE_super_allied_victory:0 "§GThe Reich Has Fallen§!"
 IHE_super_allied_victory_QUOTE:0 "Even as German armies stood deep in Russia, the Reich itself has collapsed. Germany has capitulated before its eastern conquests could be secured, and Europe is free once more.\n- §GThe Allies and the Soviet Union have won the war§!"
 IHE_super_allied_victory_early_QUOTE:0 "The Soviet Union never broke. Side by side with the Western Allies, the Red Army has fought from the gates of its own cities to the heart of the Reich, and Germany has capitulated.\n- §GThe Allies and the Soviet Union have won the war§!"
 IHE_super_allied_victory_REMARK_ALLIES:0 "Victory!"
 IHE_super_allied_victory_REMARK_AXIS:0 "It was so close..."
 IHE_SOV_no_surrender:0 "Not One Step Back"
 IHE_SOV_no_surrender_desc:0 "The Soviet Union will never capitulate on the battlefield. Only if the Axis holds §YLeningrad§!, §YMoscow§!, §YKazan§!, §YStalingrad§! and §YBaku§! for §Y30§! days will the Soviet Union surrender."
 IHE_super_pax_germanica_DATE:0 "[?global.IHE_super_pax_germanica_date.GetDateStringNoHourLong]"
 IHE_super_allied_victory_DATE:0 "[?global.IHE_super_allied_victory_date.GetDateStringNoHourLong]"
